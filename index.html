<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japon — novembre 2026</title>
<meta name="description" content="Vingt-trois nuits au Japon en novembre 2026, de Tokyo à Kyoto au rythme des érables.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1512" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="app.css">
<script>
/* Avant le rendu : éviter l'éclair clair quand le sombre est choisi. */
try { if (localStorage.getItem('jp2026_theme') === 'dark')
  document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
</script>
</head>
<body>

<main>
  <!-- Ouverture : la photo d'abord, le texte posé dessus, rien d'autre. -->
  <header class="cover">
    <img class="cover__img" src="img/hero/ouverture.webp"
         alt="Le chemin des torii de Fushimi Inari, Kyoto" fetchpriority="high">
    <div class="cover__text wrap">
      <h1>Japon</h1>
      <p class="cover__dates">8 novembre — 3 décembre 2026</p>
    </div>
    <p class="cover__credit">Fushimi Inari, Kyoto</p>
  </header>

  <div class="wrap">
    <p class="chapo" id="chapo"></p>

  </div>

  <div class="band">
    <div class="wrap">
      <section class="section">
        <div class="shead"><h2>Les érables</h2><p>Chaque ville rougit à sa date.</p></div>
        <div id="band"></div>
      </section>
    </div>
  </div>

  <!-- Les villes se cadrent elles-mêmes (.city porte max-width et padding) :
       les envelopper dans .wrap les rétrécissait d'un cran. -->
  <section class="cities" id="cities"></section>

  <div class="wrap">
    <section class="section">
      <div class="shead">
        <h2>La ligne</h2>
        <p>Les trains d'une ville à l'autre. Prix par personne, à revérifier.</p>
        <span class="shead__meta" id="route-meta"></span>
      </div>
      <ol class="rt" id="route"></ol>
      <div class="flights" id="flights"></div>
    </section>

    <section class="section">
      <div class="shead"><h2>La carte</h2></div>
      <div id="map" class="map map--wide"></div>
    </section>

    <section class="section">
      <div class="shead disc"><h2>L'argent</h2></div>
      <div id="progress"></div>
    </section>
  </div>
</main>

<script src="vendor/leaflet.js"></script>
<script type="module">
import { TRIP, CITIES, STEPS, EXCURSIONS, SEGMENTS, HOTELS, FLIGHTS, RESERVATIONS } from './data/trip.js';
import { SPOTS } from './data/spots.js';
import { DAYS } from './data/days.js';
import { mountChrome, initReveal, initCoverParallax, initProgressBar, esc, eur, formatDate, daysBetween, today } from './app/ui.js';
import { renderMomijiBand } from './app/momiji.js';
import { createMap, stepMarker, excursionMarker, routeLine, excursionLine, fitAll } from './app/map.js';

mountChrome('index.html');

// Pendant le voyage, l'accueil reste la couverture du magazine — mais la
// première chose à voir, c'est la journée en cours. Un bandeau au-dessus de la
// photo y mène ; il n'existe qu'entre le 8 novembre et le 3 décembre.
{
  const jourEnCours = DAYS.find((d) => d.date === today());
  if (jourEnCours) {
    const c = CITIES[STEPS.find((s) => s.id === jourEnCours.stepId)?.cityId];
    document.querySelector('.cover')?.insertAdjacentHTML('beforebegin', `
      <a class="ojd" href="jour.html?d=${jourEnCours.n}" ${c ? `style="--c:var(--c-${c.id})"` : ''}>
        <span class="ojd__quand">Aujourd'hui · jour ${jourEnCours.n} sur ${DAYS.length}</span>
        <b class="ojd__quoi">${esc(jourEnCours.title)}</b>
        <span class="ojd__aller">La journée sur la carte ›</span>
      </a>`);
  }
}

// Une phrase, pas une rangée de gros chiffres : l'information est la même et
// elle se lit d'un trait.
const q = (id) => document.getElementById(id);
q('chapo').innerHTML =
  `${TRIP.nights} nuits, ${new Set(STEPS.map((s) => s.cityId)).size} villes, ${EXCURSIONS.length} excursions à la journée. ` +
  `On monte à Kanazawa, on redescend sur Kyoto et Osaka, on finit par deux nuits ` +
  `de bain chaud à Hakone avant de rentrer à Tokyo pour le pic des érables.`;

// --- les six villes -----------------------------------------------------------
const HERO = {"ouverture": "img/hero/ouverture.webp", "tokyo": "img/hero/tokyo.webp", "kanazawa": "img/hero/kanazawa.webp", "kyoto": "img/hero/kyoto.webp", "osaka": "img/hero/osaka.webp", "hakone": "img/hero/hakone.webp", "tokyo2": "img/hero/tokyo2.webp"};
// Tokyo est deux étapes : la seconde a sa propre image, sinon la page bégaie.
const heroFor = (step) => (step.n === 6 && HERO.tokyo2) ? HERO.tokyo2 : HERO[step.cityId];

// Le bloc de ville disait où l'on dort et rien de ce qu'on y fait : la moitié
// droite restait vide sous cinq lignes. Il porte maintenant les incontournables
// de la ville et le nombre d'adresses du guide — avec le lien déjà filtré.
q('cities').innerHTML = STEPS.map((step) => {
  const c = CITIES[step.cityId];
  const h = HOTELS.find((x) => x.id === step.hotelId);
  const excs = EXCURSIONS.filter((e) => e.fromStepId === step.id);
  const dansLaVille = SPOTS.filter((sp) => sp.cityId === step.cityId);
  const nbAdresses = dansLaVille.length;
  // Tokyo a deux étapes : la seconde montre d'autres incontournables que la première.
  const obs = dansLaVille.filter((sp) => sp.priority === 'ob');
  const incontournables = (step.n === 6 ? obs.slice(3, 6) : obs.slice(0, 3));
  const premierJour = DAYS.find((d) => d.stepId === step.id && d.kind !== 'vol');
  return `
  <article class="city" style="--c:var(--c-${c.id})">
    <figure class="city__shot">
      <img src="${heroFor(step)}" alt="${esc(c.name)}" loading="lazy" decoding="async">
    </figure>
    <div class="city__text">
      <p class="city__n">${String(step.n).padStart(2, '0')}</p>
      <h3>${esc(c.name)}</h3>
      <p class="city__when">${formatDate(step.from)} → ${formatDate(step.to)} · ${step.nights} nuit${step.nights > 1 ? 's' : ''}</p>
      <p class="city__hotel">${esc(h.name)}<span class="mut"> · ${esc(h.room)}</span></p>
      ${excs.length ? `<p class="city__exc">Excursions : ${excs.map((e) => esc(e.name)).join(', ')}</p>` : ''}
      ${incontournables.length ? `
      <p class="city__ob">
        <span class="label">À ne pas rater</span>
        ${incontournables.map((sp) => `<a href="guide.html?ville=${esc(step.cityId)}&q=${encodeURIComponent(sp.name)}">${esc(sp.name)}</a>`).join('<span class="mut"> · </span>')}
      </p>` : ''}
      <p class="city__liens">
        <a class="btn btn--ghost" href="jour.html?d=${premierJour ? premierJour.n : 1}">Les journées</a>
        <a class="btn btn--ghost" href="guide.html?ville=${esc(step.cityId)}">${nbAdresses} adresses</a>
      </p>
    </div>
  </article>`;
}).join('');

renderMomijiBand(q('band'));

// --- la carte ---------------------------------------------------------------
const map = createMap('map');
SEGMENTS.forEach((s) => routeLine(s, STEPS).addTo(map));
EXCURSIONS.forEach((e) => {
  excursionLine(e, STEPS).addTo(map);
  excursionMarker(e).addTo(map)
    .bindPopup(`<b>${esc(e.name)}</b><br>Excursion · ${esc(e.date)}<br>${esc(e.hook)}`);
});
STEPS.forEach((s) => {
  const h = HOTELS.find((h) => h.id === s.hotelId);
  stepMarker(s).addTo(map).bindPopup(
    `<b>${s.n}. ${esc(CITIES[s.cityId].name)}</b><br>${esc(s.label)} · ${s.nights} nuits<br>${esc(h.name)}`);
});
fitAll(map, [...STEPS.map((s) => s.ll), ...EXCURSIONS.map((e) => e.ll)]);

// --- la ligne ---------------------------------------------------------------
// Un seul objet plutôt que deux listes : les étapes et les trains qui les
// relient sont la même chose vue sous deux angles. Les afficher séparément
// obligeait à lire deux fois la même séquence.
const excBySt = EXCURSIONS.reduce((m, e) => ((m[e.fromStepId] ||= []).push(e), m), {});
const MODES = { shk: 'Shinkansen', exp: 'Express', loc: 'Train local' };

function stop(step) {
  const c = CITIES[step.cityId];
  const h = HOTELS.find((x) => x.id === step.hotelId);
  const excs = excBySt[step.id] || [];
  return `
  <li class="rt__stop" style="--c:var(--c-${c.id})">
    <span class="rt__rail"><span class="rt__node">${step.n}</span></span>
    <div class="rt__body">
      <div class="rt__head">
        <h3>${esc(c.name)}${step.area ? ` <span class="mut">${esc(step.area)}</span>` : ''}</h3>
        <span class="rt__when data">${formatDate(step.from)} → ${formatDate(step.to)}</span>
        <span class="rt__nights">${step.nights} nuit${step.nights > 1 ? 's' : ''}</span>
      </div>
      ${excs.length ? `<ul class="rt__branches">
        ${excs.map((e) => `<li><span class="rt__branch"></span>${esc(e.name)}
          <span class="mut data">${esc(e.date)}</span></li>`).join('')}
      </ul>` : ''}
    </div>
  </li>`;
}

function leg(seg) {
  const to = STEPS.find((x) => x.id === seg.toStepId);
  const c = CITIES[to.cityId];
  return `
  <li class="rt__leg rt__leg--${seg.mode}" style="--c:var(--c-${c.id})">
    <span class="rt__rail"></span>
    <div class="rt__body">
      <span class="rt__mode">${MODES[seg.mode]}</span>
      <span class="rt__label">${esc(seg.label)}</span>
      <span class="rt__dur data">${esc(seg.duration)}</span>
      <span class="rt__price data">${esc(seg.pricePerPerson)}</span>
    </div>
  </li>`;
}

q('route').innerHTML = STEPS.map((step, i) => {
  const seg = SEGMENTS.find((g) => g.fromStepId === step.id);
  return stop(step) + (seg ? leg(seg) : '');
}).join('');

q('route-meta').textContent =
  `${STEPS.length} étapes · ${SEGMENTS.length} trains · ${EXCURSIONS.length} excursions`;

// Un vol, ce sont trois aéroports et une escale : autant le dessiner comme
// un trajet plutôt que le tasser dans une ligne de tableau.
q('flights').innerHTML = `
  <h3 class="flights__title">Les vols <span class="mut">${esc(FLIGHTS[0].airline)}</span></h3>
  ${FLIGHTS.map((f) => `
    <article class="fl">
      <header class="fl__head">
        <span class="fl__label">${esc(f.label)}</span>
        <span class="fl__date data">${formatDate(f.date, { weekday: true })}</span>
      </header>
      <div class="fl__strip">
        ${f.legs.map((l, i) => `
          <div class="fl__port">
            <span class="fl__code data">${esc(l.from)}</span>
            <span class="fl__city">${esc(l.fromCity)}</span>
            <span class="fl__time data">${esc(l.depart)}</span>
          </div>
          <div class="fl__hop">
            <span class="fl__no data">${esc(l.flight)}</span>
            <span class="fl__line"></span>
            <span class="fl__dur data">${esc(l.duration)}</span>
          </div>
          ${i === f.legs.length - 1 ? `
          <div class="fl__port fl__port--end">
            <span class="fl__code data">${esc(l.to)}</span>
            <span class="fl__city">${esc(l.toCity)}</span>
            <span class="fl__time data">${esc(l.arrive)}${l.dayShift ? ' <sup>+1</sup>' : ''}</span>
          </div>` : ''}
        `).join('')}
      </div>
      <p class="fl__layover mut">Escale de <span class="data">${esc(f.layover.duration)}</span> à ${esc(f.layover.at)}</p>
    </article>`).join('')}`;

// --- où on en est -----------------------------------------------------------
// Les hôtels sont tous réservés mais tous ne sont pas payés : la distinction
// compte, et l'ancien site ne la faisait pas.
const totalHotels = HOTELS.reduce((s, h) => s + h.price, 0);
const paidHotels = HOTELS.filter((h) => h.paid).reduce((s, h) => s + h.price, 0);
const pct = Math.round((paidHotels / totalHotels) * 100);

const ryokan = HOTELS.find((h) => h.cancelBefore);
const daysToCancel = ryokan ? daysBetween(today(), ryokan.cancelBefore) : null;

// Le suivi des paiements a sa page. Ici, juste le chiffre et le renvoi — pas
// une troisième liste de ce qui est réservé.
q('progress').innerHTML = `
  <div class="card cardlink">
    <a class="cardlink__in" href="budget.html">
      <span class="cardlink__texte">
        <b>${eur(paidHotels)} réglés sur ${eur(totalHotels)} d'hébergement</b>
        <span class="mut">Les ${HOTELS.length} hôtels et les ${FLIGHTS.length} vols sont pris${RESERVATIONS.length ? `, le ${esc(RESERVATIONS[0].title)} est payé` : ''}.
          Le budget complet, ligne par ligne, et ce qui reste à sortir.</span>
      </span>
      <span class="cardlink__fleche" aria-hidden="true">›</span>
    </a>
  </div>`;

initReveal();
initCoverParallax();
initProgressBar();
</script>

<script>
/* Enregistrement du service worker : c'est lui qui rend le site utilisable
   sans réseau. La page Pratique pilote en plus le téléchargement des photos. */
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
