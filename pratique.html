<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pratique — Japon 2026</title>
<meta name="description" content="Les hébergements, le budget calculé depuis les réservations, les paiements et le mode hors-ligne.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1512" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
<script>
/* Avant le rendu : éviter l'éclair clair quand le sombre est choisi. */
try { if (localStorage.getItem('jp2026_theme') === 'dark')
  document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
</script>
</head>
<body>

<!-- L'ouverture est une photo de la vraie réservation — le bain extérieur du
     ryokan de Hakone — plutôt qu'une image d'illustration trouvée ailleurs. -->
<header class="cover cover--short">
  <img class="cover__img" src="img/hananoyado-fukuya-47b10294@960.webp"
       alt="Le bain extérieur du ryokan Hananoyado Fukuya, Hakone" fetchpriority="high">
  <div class="cover__text wrap">
    <h1>Pratique</h1>
    <p class="cover__dates" id="cover-sub"></p>
  </div>
  <!-- La date vient des données : écrite à la main, elle disait « 15 novembre »,
       soit une nuit passée à Kanazawa. -->
  <p class="cover__credit" id="cover-credit"></p>
</header>

<main class="wrap">
  <header class="section">
    <p class="hero__lede" id="lede"></p>
  </header>

  <section class="section">
    <div class="shead">
      <h2>Hébergements</h2>
      <span class="shead__meta" id="hotels-meta"></span>
    </div>
    <div id="hotels"></div>
  </section>

  <section class="section">
    <div class="shead"><h2>L'argent</h2></div>
    <div class="card cardlink" id="vers-budget"></div>
  </section>

  <section class="section">
    <div class="shead"><h2>Hors-ligne</h2></div>
    <div id="offline"></div>
  </section>
</main>

<script type="module">
import { TRIP, CITIES, STEPS, HOTELS, SEGMENTS, AMENITY_LABELS } from './data/trip.js';
import { mountChrome, initReveal, initCoverParallax, initProgressBar, esc, eur, formatDate, daysBetween, today, bindLightbox } from './app/ui.js';

mountChrome('pratique.html');
const q = (id) => document.getElementById(id);

// --- les hébergements ---------------------------------------------------------
// Les six fiches affichent exactement les mêmes lignes. Quand une information
// n'existe pas — la superficie, que deux établissements ne communiquent pas —
// on l'écrit, plutôt que d'escamoter la ligne : c'est ce qui rendait les
// anciennes fiches incomparables entre elles.
const AMENITY_KEYS = Object.keys(AMENITY_LABELS);

q('hotels-meta').textContent =
  `${HOTELS.length} réservations · ${TRIP.nights} nuits · ${eur(HOTELS.reduce((s, h) => s + h.price, 0))}`;

q('hotels').innerHTML = HOTELS.map((h) => {
  const step = STEPS.find((s) => s.id === h.stepId);
  const c = CITIES[h.cityId];
  const seg = SEGMENTS.find((g) => g.toStepId === h.stepId);
  const cancel = h.cancelBefore ? daysBetween(today(), h.cancelBefore) : null;

  return `
  <article class="hotel card" style="--c:${c.color}">
    <div class="hotel__shots">
      ${h.images.slice(0, 4).map((src, i) => `
        <img src="${esc(src)}" alt="${esc(h.name)} — photo ${i + 1}"
             loading="lazy" decoding="async" data-full="${esc(src)}">`).join('')}
      <span class="hotel__step step-num" style="--c:${c.color}">${step.n}</span>
    </div>

    <div class="hotel__body">
      <header class="hotel__head">
        <div>
          <h3>${esc(h.name)}</h3>
          <p class="hotel__where">
            <span class="city-dot" style="--c:${c.color}">${esc(c.name)}</span>
            ${h.address ? `<span class="mut">· ${esc(h.address)}</span>` : ''}
          </p>
        </div>
        <p class="hotel__price">
          <b class="data">${eur(h.price)}</b>
          <span class="mut data">${eur(h.perNight)} / nuit</span>
        </p>
      </header>

      <dl class="hotel__facts">
        <div><dt>Dates</dt><dd class="data">${formatDate(step.from)} → ${formatDate(step.to)}</dd></div>
        <div><dt>Nuits</dt><dd class="data">${step.nights}</dd></div>
        <div><dt>Chambre</dt><dd>${esc(h.room)}</dd></div>
        <div><dt>Superficie</dt><dd>${h.size ? `<span class="data">${h.size} m²</span>` : '<span class="mut">non communiquée</span>'}</dd></div>
        <div><dt>Capacité</dt><dd>${esc(h.capacity)}</dd></div>
        <div><dt>Arrivée</dt><dd class="data">${esc(h.checkIn)}</dd></div>
        <div><dt>Départ</dt><dd class="data">${esc(h.checkOut)}</dd></div>
        <div><dt>Salle de bains</dt><dd>${esc(h.bath)}</dd></div>
        <div><dt>Repas</dt><dd>${h.meals ? esc(h.meals) : '<span class="mut">non compris</span>'}</dd></div>
        <div><dt>Paiement</dt><dd>${h.paid
          ? '<span class="ok">réglé</span>'
          : `<span class="todo">à régler — ${eur(h.price)}</span>`}</dd></div>
      </dl>

      <ul class="hotel__amenities">
        ${AMENITY_KEYS.map((k) => `
          <li class="${h.amenities[k] ? 'is-yes' : 'is-no'}">
            <span aria-hidden="true">${h.amenities[k] ? '✓' : '·'}</span>
            ${esc(AMENITY_LABELS[k])}
            <span class="sr">${h.amenities[k] ? 'oui' : 'non'}</span>
          </li>`).join('')}
      </ul>

      ${cancel !== null ? `<p class="hotel__flag">
        Annulation gratuite jusqu'au <span class="data">${formatDate(h.cancelBefore)}</span>
        ${cancel > 0 ? `<span class="mut">— dans ${cancel} jours</span>` : '<span class="mut">— échue</span>'}
      </p>` : h.refundable
        ? '<p class="hotel__flag hotel__flag--soft">Annulation gratuite</p>'
        : '<p class="hotel__flag hotel__flag--soft">Non remboursable</p>'}

      ${h.arrivee ? `<p class="hotel__arrivee"><b>À l'arrivée</b> ${esc(h.arrivee)}</p>` : ''}
      ${h.access ? `<p class="hotel__access">${esc(h.access)}</p>` : ''}

      ${seg ? `<details class="hotel__route">
        <summary>Y aller <span class="mut data">${esc(seg.duration)} · ${esc(seg.pricePerPerson)}</span></summary>
        <p>${esc(h.route ? h.route.text : seg.label)}</p>
      </details>` : ''}

      <p><a class="btn btn--ghost" href="${esc(h.maps)}" target="_blank" rel="noopener">Ouvrir dans Google Maps</a></p>
    </div>
  </article>`;
}).join('');

bindLightbox(q('hotels'));

// --- l'argent vit sur sa propre page -----------------------------------------
// Pratique faisait quatre choses : les lits, le budget, les paiements et le
// hors-ligne. Le budget a sa page ; il ne reste ici qu'un renvoi qui donne le
// chiffre, pour ne pas avoir à cliquer juste pour savoir où on en est.
const totalHeb = HOTELS.reduce((s, h) => s + h.price, 0);
const dejaPaye = HOTELS.filter((h) => h.paid).reduce((s, h) => s + h.price, 0);

q('vers-budget').innerHTML = `
  <a class="cardlink__in" href="budget.html">
    <span class="cardlink__texte">
      <b>Le budget et les paiements</b>
      <span class="mut">${eur(totalHeb)} d'hébergement, dont ${eur(dejaPaye)} déjà réglés.
        Le détail, les totaux et ce qui reste à sortir sont sur leur page.</span>
    </span>
    <span class="cardlink__fleche" aria-hidden="true">›</span>
  </a>`;

// --- hors-ligne ---------------------------------------------------------------
// Une action explicite, avec une progression réelle. Le pré-chargement
// silencieux à l'installation échouait sans que personne ne le sache.
q('offline').innerHTML = `
  <div class="offline card">
    <p><b id="off-state">Vérification…</b></p>
    <p class="mut" id="off-detail">
      Tout le site — les cinq pages, toutes les photos, les cartes déjà
      consultées — peut tenir sur le téléphone et fonctionner sans réseau.
      Environ 25 Mo. À faire avant de partir, en wifi.
    </p>
    <div class="offline__bar" id="off-bar" hidden><span></span></div>
    <p><button class="btn" id="off-go" hidden>Préparer le hors-ligne</button></p>
  </div>`;

if ('serviceWorker' in navigator) {
  const state = q('off-state');
  const bar = q('off-bar');
  const go = q('off-go');
  const detail = q('off-detail');
  const detailParDefaut = detail.textContent;

  navigator.serviceWorker.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.type === 'status') {
      const total = d.mediaTotal || 0;
      const pret = d.shell >= d.shellTotal && total > 0 && d.media >= total;
      // Une mise à jour du site vide le cache : sans ce repère, on lirait
      // « Pas encore téléchargé » après l'avoir fait, et on croirait à un raté.
      const dejaFait = localStorage.getItem('jp2026_offline') === 'ok';

      state.textContent = pret
        ? `Prêt pour le hors-ligne — ${d.media} photos en mémoire`
        : d.media > 0 ? `Téléchargement incomplet — ${d.media} photos sur ${total}`
        : dejaFait ? 'Le site a été mis à jour — à retélécharger'
        : 'Pas encore téléchargé';

      detail.textContent = dejaFait && !pret && d.media === 0
        ? 'C’était fait, mais une nouvelle version du site a remplacé l’ancienne : '
          + 'le cache repart de zéro. Quelques minutes en wifi.'
        : detailParDefaut;

      go.hidden = pret;
      go.textContent = d.media > 0 && !pret ? 'Reprendre le téléchargement' : 'Préparer le hors-ligne';
      if (pret) localStorage.setItem('jp2026_offline', 'ok');
    }
    if (d.type === 'progress') {
      bar.hidden = false;
      bar.firstElementChild.style.width = `${Math.round((d.done / d.total) * 100)}%`;
      state.textContent = d.phase === 'pages'
        ? `Pages — ${d.done} / ${d.total}`
        : `Photos — ${d.done} / ${d.total}`;
      go.disabled = true;
    }
    if (d.type === 'done') {
      bar.hidden = true;
      go.disabled = false;
      go.hidden = true;
      state.textContent = `Prêt pour le hors-ligne — ${d.media} photos en mémoire`;
      detail.textContent = detailParDefaut;
      localStorage.setItem('jp2026_offline', 'ok');
    }
  });

  navigator.serviceWorker.register('sw.js').then(async (reg) => {
    await navigator.serviceWorker.ready;
    const sw = () => navigator.serviceWorker.controller || reg.active;
    sw()?.postMessage({ type: 'cache-status' });
    go.addEventListener('click', () => {
      state.textContent = 'Démarrage…';
      sw()?.postMessage({ type: 'cache-all' });
    });
  }).catch(() => { state.textContent = 'Indisponible sur ce navigateur'; });
} else {
  q('off-state').textContent = 'Indisponible sur ce navigateur';
}
</script>
</body>
</html>
