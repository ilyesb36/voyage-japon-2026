<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le budget — Japon 2026</title>
<meta name="description" content="Qui a payé quoi, ce qu'il reste à payer, et qui doit combien à l'autre.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1512" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<main class="wrap">
  <!-- À deux, le budget c'est trois questions : qui doit combien à l'autre,
       qu'est-ce qui reste à payer, et qui a payé quoi. La page fait ça et rien
       d'autre : un bilan de trois lignes, puis la liste, une ligne par dépense
       avec le payeur. -->
  <header class="section">
    <h1>Le budget</h1>
    <p class="hero__lede" id="lede"></p>
  </header>

  <section class="section">
    <div class="bilan" id="bilan"></div>
  </section>

  <section class="section">
    <p class="dep__legende mut"><b>I</b> Ilyès · <b>M</b> Mathilde · <b>½</b> moitié chacun. Re-cliquer efface.</p>
    <div class="dep" id="dep"></div>
  </section>

  <section class="section">
    <p class="jour__ailleurs">
      <a class="btn btn--ghost" href="pratique.html">Les hébergements</a>
      <a class="btn btn--ghost" href="aujourdhui.html">Ce qu'il reste à réserver</a>
    </p>
  </section>
</main>

<script type="module">
import { TRIP, HOTELS, BUDGET } from './data/trip.js';
import { mountChrome, initReveal, esc, eur } from './app/ui.js';

mountChrome('budget.html');
const q = (id) => document.getElementById(id);

const QUI = { I: 'Ilyès', M: 'Mathilde', D: 'moitié chacun' };

// --- le calcul ----------------------------------------------------------------
// Le poste hébergement est la somme des réservations, jamais une saisie.
const RATE_LABEL = { vol: '€ / pers.', train: '€ / pers.', food: '€ / jour / pers.', act: '€ / jour / pers.' };
const MULT = { vol: 2, train: 2, food: 24 * 2, act: 24 * 2 };

const lire = (k, repli) => { try { return JSON.parse(localStorage.getItem(k)) ?? repli; } catch { return repli; } };
const rates = { ...BUDGET.defaults, ...lire('jp2026_rates', {}) };
const saveRates = () => localStorage.setItem('jp2026_rates', JSON.stringify(rates));

function montant(item) {
  if (item.fromHotel) return HOTELS.find((h) => h.id === item.fromHotel).price;
  if (item.fix != null) return item.fix;
  return (rates[item.dyn] || 0) * MULT[item.dyn];
}
const somme = (items) => items.reduce((t, i) => t + montant(i), 0);
const ITEMS = BUDGET.categories.flatMap((c) => c.items);

// Ce qui est déjà sorti d'un compte, sans qu'on sache duquel : hôtels
// prépayés via Booking, billets datés. C'est un fait, pas une case à cocher.
const prepaye = new Set([
  ...HOTELS.filter((h) => h.paid).map((h) => h.id),
  ...ITEMS.filter((i) => i.settled).map((i) => i.key),
]);

// Qui a payé : 'I', 'M', 'D' (moitié chacun) ou rien. L'ancienne case « payé »
// sans payeur est reprise comme payé par on-ne-sait-qui.
const payeur = lire('jp2026_payeur', {});
const ancien = lire('jp2026_paid', lire('bdg_paid', {}));
const savePayeur = () => localStorage.setItem('jp2026_payeur', JSON.stringify(payeur));

const estPaye = (i) => prepaye.has(i.key) || !!ancien[i.key] || !!payeur[i.key];
const sansPayeur = (i) => estPaye(i) && !payeur[i.key];

function bilan(items = ITEMS) {
  const total = somme(items);
  const paye = somme(items.filter(estPaye));
  const avI = somme(items.filter((i) => payeur[i.key] === 'I'));
  const avM = somme(items.filter((i) => payeur[i.key] === 'M'));
  const flou = items.filter(sansPayeur);
  // Ce que chacun a déjà mis : ce qu'il a avancé, plus la moitié de ce qui a été
  // payé à deux — et, faute de mieux, la moitié de ce qui est payé sans qu'on
  // sache par qui.
  const moitie = (somme(items.filter((i) => payeur[i.key] === 'D')) + somme(flou)) / 2;
  const part = total / 2;
  // Chacun doit la moitié de ce que l'un ou l'autre a avancé.
  return {
    total, paye, reste: total - paye, avI, avM, flou, moitie,
    solde: (avI - avM) / 2,
    resteI: Math.max(0, part - avI - moitie),
    resteM: Math.max(0, part - avM - moitie),
  };
}

// Le compte, en tableau : une colonne par personne, trois lignes — sa part,
// ce qu'il a payé, ce qu'il lui reste. C'est lisible d'un coup d'œil là où une
// phrase mélangeait tout. « Lui reste » suppose qu'on ne se rembourse pas :
// chacun paie jusqu'à sa part. La phrase du dessous donne l'autre option.
function compteHTML(b) {
  const part = b.total / 2;
  const flou = somme(b.flou);
  const payeI = b.avI + (b.moitie || 0);
  const payeM = b.avM + (b.moitie || 0);
  return `
    <div class="compte" role="table">
      <span class="compte__coin"></span><span class="compte__t">Ilyès</span><span class="compte__t">Mathilde</span>
      <span class="compte__l">Sa part</span><span class="data">${eur(part)}</span><span class="data">${eur(part)}</span>
      <span class="compte__l">A payé</span><span class="data">${eur(payeI)}${flou ? '<sup>?</sup>' : ''}</span><span class="data">${eur(payeM)}${flou ? '<sup>?</sup>' : ''}</span>
      <span class="compte__l">Lui reste à payer</span><b class="data">${eur(b.resteI)}</b><b class="data">${eur(b.resteM)}</b>
    </div>`;
}

// Une seule phrase, qui lie les deux nombres au lieu de les poser côte à côte :
// si l'un rembourse l'autre, le reste se partage en deux.
function phraseSolde(b) {
  const s = Math.round(Math.abs(b.solde));
  if (!b.avI && !b.avM) return '';
  if (s === 0) return 'Chacun a mis autant.';
  const [doit, a] = b.solde > 0 ? ['Mathilde', 'Ilyès'] : ['Ilyès', 'Mathilde'];
  if (b.reste === 0) return `${doit} doit <b class="data">${eur(s)}</b> à ${a}.`;
  // « Ou bien » : le tableau dit ce qu'il reste à chacun sans se rembourser ;
  // la phrase donne l'autre option, pas un chiffre de plus à additionner.
  return `Ou bien ${doit} rembourse <b class="data">${eur(s)}</b> à ${a}, et il reste <span class="data">${eur(b.reste / 2)}</span> chacun.`;
}
const phraseFlou = (b) => b.flou.length
  ? `<sup>?</sup> ${eur(somme(b.flou))} payés sans savoir par qui, comptés moitié-moitié.` : '';

q('lede').textContent =
  'Qui a payé quoi, ce qu\'il reste, et qui doit combien à l\'autre. Mémorisé sur cet appareil.';

// --- le bilan : trois lignes ----------------------------------------------------
function renderBilan() {
  const b = bilan();
  const s = Math.round(Math.abs(b.solde));
  const phrase = !b.avI && !b.avM ? 'Personne n\'a encore rien avancé'
    : s === 0 ? 'Vous êtes à l\'équilibre'
    : b.solde > 0 ? `Mathilde doit <b class="data">${eur(s)}</b> à Ilyès`
    : `Ilyès doit <b class="data">${eur(s)}</b> à Mathilde`;

  q('bilan').innerHTML = `
    <div class="bilan__solde">
      <span class="chiffre__quoi">Entre vous</span>
      <span class="bilan__phrase">${phrase}</span>
      <span class="bilan__sous">${s && b.reste ? phraseSolde(b) : ''}</span>
      <span class="bilan__sous mut">
        Le voyage <span class="data">${eur(b.total)}</span> · reste à payer <b class="data">${eur(b.reste)}</b>
        · <span class="data">${eur(b.total / 2 / TRIP.days)}</span> par jour et par personne
      </span>
      ${b.flou.length ? `<span class="bilan__sous mut">${phraseFlou(b)}</span>` : ''}
    </div>
    ${compteHTML(b)}`;
}

// --- la liste : une ligne par dépense ---------------------------------------------
// Trois colonnes, toujours les mêmes : quoi, combien, qui a payé. Les en-têtes
// de poste sont dans la même grille, leur total dans la colonne des montants.
const court = (i) => (i.sub || '').split(' · ')[0];

function renderDep() {
  q('dep').innerHTML = `
    <div class="dep__ligne dep__tete" aria-hidden="true">
      <span>Dépense</span><span class="dep__n">Montant</span>
      <span class="dep__qui">Qui a payé</span>
    </div>
    ${BUDGET.categories.map((cat) => `
      <h2 class="dep__ligne dep__poste" id="cat-${cat.id}">
        <span>${esc(cat.name)}</span>
        <span class="dep__n data mut" data-cat="${cat.id}">${eur(somme(cat.items))}</span>
        <span class="dep__solde" data-solde="${cat.id}">${posteSolde(cat)}</span>
      </h2>
      ${cat.items.map(ligne).join('')}`).join('')}
    <div class="dep__ligne dep__pied">
      <span>Le voyage</span>
      <span class="dep__n data" data-cat="tout">${eur(somme(ITEMS))}</span>
      <span></span>
    </div>`;

  q('dep').querySelectorAll('input[data-rate]').forEach((input) => {
    input.addEventListener('input', () => {
      rates[input.dataset.rate] = Math.max(0, +input.value || 0);
      saveRates();
      refresh();
    });
  });

  q('dep').querySelectorAll('.qui button').forEach((btn) => {
    btn.addEventListener('click', () => {
      const key = btn.closest('.qui').dataset.key;
      // Re-cliquer le payeur choisi l'efface : la ligne redevient « pas payé »,
      // sauf si c'est un fait (prépayé) — alors seul le payeur s'efface.
      payeur[key] = payeur[key] === btn.dataset.qui ? undefined : btn.dataset.qui;
      if (!payeur[key]) { delete payeur[key]; delete ancien[key]; localStorage.setItem('jp2026_paid', JSON.stringify(ancien)); }
      savePayeur();
      refresh();
    });
  });
}

// Sous le nom du poste : le même tableau que le bilan, à l'échelle du poste,
// et la phrase qui lie remboursement et reste. Les hôtels surtout : c'est là
// que l'un avance pour l'autre.
function posteSolde(cat) {
  const b = bilan(cat.items);
  const etat = b.reste === 0
    ? `<span class="dep__ok">Tout est payé</span>`
    : `<span>Reste à payer <b class="data dep__reste">${eur(b.reste)}</b></span>`;
  return `
    <span class="dep__etat">${etat}
      ${phraseSolde(b) ? `<span>${phraseSolde(b)}</span>` : ''}
      ${b.flou.length ? `<span class="mut">${phraseFlou(b)}</span>` : ''}
    </span>
    ${compteHTML(b)}`;
}

function ligne(i) {
  const paye = estPaye(i);
  const sub = i.dyn
    ? `<label class="dep__forfait">
         <input type="number" min="0" step="5" value="${rates[i.dyn]}" data-rate="${i.dyn}"
                aria-label="${esc(i.label)} — ${RATE_LABEL[i.dyn]}">
         <span class="mut">${RATE_LABEL[i.dyn]}</span>
       </label>`
    : `<span class="mut" data-sub="${i.key}">${esc(sousLigne(i))}</span>`;
  return `
    <div class="dep__ligne dep__row${paye ? ' is-paye' : ''}" data-row="${i.key}">
      <span class="dep__quoi"><b>${esc(i.label)}</b>${sub}</span>
      <span class="dep__n data" data-line="${i.key}">${eur(montant(i))}</span>
      <span class="qui" role="group" data-key="${i.key}" aria-label="Qui a payé ${esc(i.label)}">
        ${['I', 'M', 'D'].map((k) => `
          <button type="button" data-qui="${k}" aria-pressed="${payeur[i.key] === k}"
                  title="${k === 'D' ? 'Moitié chacun' : `${QUI[k]} a payé`}">${k === 'D' ? '½' : k}</button>`).join('')}
      </span>
    </div>`;
}

// Sous le libellé : le lieu, et l'état quand il manque quelque chose.
function sousLigne(i) {
  const lieu = court(i);
  if (prepaye.has(i.key) && !payeur[i.key]) return `${lieu} · ${i.settled ? 'payé' : 'réglé via Booking'} — par qui ?`;
  if (ancien[i.key] && !payeur[i.key]) return `${lieu} · payé — par qui ?`;
  return lieu;
}

// En place : redessiner ferait perdre le focus du forfait qu'on tape.
function refresh() {
  const root = q('dep');
  for (const cat of BUDGET.categories) {
    for (const i of cat.items) {
      root.querySelector(`[data-line="${i.key}"]`).textContent = eur(montant(i));
      const row = root.querySelector(`[data-row="${i.key}"]`);
      row.classList.toggle('is-paye', estPaye(i));
      row.querySelectorAll('.qui button').forEach((b) => b.setAttribute('aria-pressed', String(payeur[i.key] === b.dataset.qui)));
      const sub = row.querySelector('[data-sub]');
      if (sub) sub.textContent = sousLigne(i);
    }
    root.querySelector(`[data-cat="${cat.id}"]`).textContent = eur(somme(cat.items));
    root.querySelector(`[data-solde="${cat.id}"]`).innerHTML = posteSolde(cat);
  }
  root.querySelector('[data-cat="tout"]').textContent = eur(somme(ITEMS));
  renderBilan();
}

renderBilan();
renderDep();
initReveal();
</script>
</body>
</html>
