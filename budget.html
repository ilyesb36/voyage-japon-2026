<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le budget — Japon 2026</title>
<meta name="description" content="Ce que coûte le voyage, calculé depuis les réservations réelles, et ce qui reste à payer.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1512" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<main class="wrap">
  <header class="section">
    <h1>Le budget</h1>
    <p class="hero__lede" id="lede"></p>
  </header>

  <!-- Les trois chiffres qui répondent vraiment à « ça coûte combien ». Le
       total seul ne dit rien : c'est le prix par personne et par jour qui se
       compare à une intuition. -->
  <section class="section">
    <div class="chiffres" id="chiffres"></div>
    <div class="repart" id="repart"></div>
  </section>

  <section class="section">
    <div class="shead">
      <h2>Le détail</h2>
      <p>Les montants variables s'ajustent, tout le reste suit.</p>
    </div>
    <div id="budget"></div>
  </section>

  <section class="section">
    <div class="shead">
      <h2>Ce qui est réglé</h2>
      <p>Mémorisé sur cet appareil.</p>
    </div>
    <div id="payments"></div>
  </section>

  <section class="section">
    <p class="jour__ailleurs">
      <a class="btn btn--ghost" href="pratique.html">Les hébergements</a>
      <a class="btn btn--ghost" href="aujourdhui.html">Ce qu'il reste à réserver</a>
    </p>
  </section>
</main>

<script type="module">
import { TRIP, CITIES, STEPS, HOTELS, BUDGET } from './data/trip.js';
import { mountChrome, initReveal, esc, eur, formatDate } from './app/ui.js';

mountChrome('budget.html');
const q = (id) => document.getElementById(id);

// --- le calcul ----------------------------------------------------------------
// Le poste hébergement est la somme des réservations, jamais une saisie.
const RATE_LABEL = { vol: '€ / personne', train: '€ / personne', food: '€ / jour / pers.', act: '€ / jour / pers.' };
const MULT = { vol: 2, train: 2, food: 24 * 2, act: 24 * 2 };

const rates = loadRates();
function loadRates() {
  try {
    const saved = JSON.parse(localStorage.getItem('jp2026_rates') || '{}');
    return { ...BUDGET.defaults, ...saved };
  } catch { return { ...BUDGET.defaults }; }
}
const saveRates = () => localStorage.setItem('jp2026_rates', JSON.stringify(rates));

function lineTotal(item) {
  if (item.fromHotel) return HOTELS.find((h) => h.id === item.fromHotel).price;
  if (item.fix != null) return item.fix;
  return (rates[item.dyn] || 0) * MULT[item.dyn];
}
const catTotal = (c) => c.items.reduce((t, i) => t + lineTotal(i), 0);
const grandTotal = () => BUDGET.categories.reduce((s, c) => s + catTotal(c), 0);

// Ce qui est déjà sorti du compte : hôtels prépayés et billets datés payés.
const prepaid = new Set([
  ...HOTELS.filter((h) => h.paid).map((h) => h.id),
  ...BUDGET.categories.flatMap((c) => c.items).filter((i) => i.settled).map((i) => i.key),
]);

function loadPaid() {
  try {
    const now = JSON.parse(localStorage.getItem('jp2026_paid') || 'null');
    if (now) return now;
    return JSON.parse(localStorage.getItem('bdg_paid') || '{}');
  } catch { return {}; }
}
const paid = loadPaid();
const savePaid = () => localStorage.setItem('jp2026_paid', JSON.stringify(paid));

const estRegle = (i) => prepaid.has(i.key) || !!paid[i.key];
const totalRegle = () => BUDGET.categories.flatMap((c) => c.items)
  .filter(estRegle).reduce((s, i) => s + lineTotal(i), 0);

q('lede').textContent =
  `Calculé depuis les réservations réelles, pas estimé. Hors shopping et souvenirs.`;

// --- les trois chiffres -------------------------------------------------------
function renderChiffres() {
  const t = grandTotal();
  const regle = totalRegle();
  const jours = TRIP.days;

  q('chiffres').innerHTML = `
    <div class="chiffre chiffre--fort">
      <span class="chiffre__quoi">Le voyage, à deux</span>
      <b class="chiffre__n data">${eur(t)}</b>
      <span class="chiffre__sous mut">${TRIP.nights} nuits, ${jours} jours</span>
    </div>
    <div class="chiffre">
      <span class="chiffre__quoi">Par personne</span>
      <b class="chiffre__n data">${eur(t / 2)}</b>
      <span class="chiffre__sous mut">vols et hébergement compris</span>
    </div>
    <div class="chiffre">
      <span class="chiffre__quoi">Par jour et par personne</span>
      <b class="chiffre__n data">${eur(t / 2 / jours)}</b>
      <span class="chiffre__sous mut">le chiffre qui se compare</span>
    </div>
    <div class="chiffre chiffre--reste">
      <span class="chiffre__quoi">Reste à sortir</span>
      <b class="chiffre__n data">${eur(t - regle)}</b>
      <span class="chiffre__sous mut">${eur(regle)} déjà payés</span>
    </div>`;
}

// --- la répartition -----------------------------------------------------------
// Une barre plutôt qu'une liste de totaux : on voit en une seconde que
// l'hébergement et les vols pèsent les deux tiers, ce qu'aucune colonne de
// chiffres ne montre aussi vite. Cliquer un segment descend à sa section.
// La palette d'automne du site, du plus lourd au plus léger — pas des couleurs
// de camembert. Elle est posée en style inline plutôt que par un sélecteur
// d'attribut : `[style*="--i:0"]` aurait attrapé n'importe quel élément du site.
const TEINTES = ['#B4451F', '#C9962F', '#6E8B4B', '#0F766E', '#6B5648', '#7A7168'];

function renderRepart() {
  const t = grandTotal();
  const parts = BUDGET.categories
    .map((c) => ({ id: c.id, name: c.name, montant: catTotal(c) }))
    .filter((p) => p.montant > 0)
    .sort((a, b) => b.montant - a.montant);

  q('repart').innerHTML = `
    <div class="repart__bar" role="img"
         aria-label="${parts.map((p) => `${p.name} ${Math.round((p.montant / t) * 100)} %`).join(', ')}">
      ${parts.map((p, i) => `
        <a class="repart__seg" href="#cat-${p.id}"
           style="width:${(p.montant / t) * 100}%; --teinte:${TEINTES[i] || TEINTES.at(-1)}"
           title="${esc(p.name)} — ${eur(p.montant)}"></a>`).join('')}
    </div>
    <ul class="repart__legende">
      ${parts.map((p, i) => `
        <li style="--teinte:${TEINTES[i] || TEINTES.at(-1)}">
          <span class="repart__pastille"></span>
          <a href="#cat-${p.id}">${esc(p.name)}</a>
          <b class="data">${eur(p.montant)}</b>
          <span class="mut data">${Math.round((p.montant / t) * 100)} %</span>
        </li>`).join('')}
    </ul>`;
}

// --- le détail ----------------------------------------------------------------
function renderBudget() {
  q('budget').innerHTML = `
    <div class="budget">
      ${BUDGET.categories.map((cat) => `
        <section class="budget__cat" id="cat-${cat.id}">
          <header>
            <h3>${esc(cat.name)}</h3>
            <span class="mut">${esc(cat.sub)}</span>
            <b class="data" data-cat-total="${cat.id}">${eur(catTotal(cat))}</b>
          </header>
          ${cat.items.map((i) => `
            <div class="budget__row${estRegle(i) ? ' is-regle' : ''}">
              <span class="budget__label">
                <b>${esc(i.label)}</b>
                ${i.sub ? `<span class="mut">${esc(i.sub)}</span>` : ''}
              </span>
              ${i.dyn ? `
                <label class="budget__input">
                  <input type="number" min="0" step="5" value="${rates[i.dyn]}" data-rate="${i.dyn}"
                         aria-label="${esc(i.label)} — ${RATE_LABEL[i.dyn]}">
                  <span class="mut">${RATE_LABEL[i.dyn]}</span>
                </label>` : ''}
              <span class="budget__amount data" data-line="${i.key}">${eur(lineTotal(i))}</span>
            </div>`).join('')}
        </section>`).join('')}
    </div>`;

  q('budget').querySelectorAll('input[data-rate]').forEach((input) => {
    input.addEventListener('input', () => {
      rates[input.dataset.rate] = Math.max(0, +input.value || 0);
      saveRates();
      refreshTotals();
    });
  });
}

// Les montants se rafraîchissent en place : redessiner tout le bloc ferait
// perdre le focus du champ qu'on est en train de taper.
function refreshTotals() {
  for (const cat of BUDGET.categories) {
    for (const i of cat.items) {
      const cell = q('budget').querySelector(`[data-line="${i.key}"]`);
      if (cell) cell.textContent = eur(lineTotal(i));
    }
    const catCell = q('budget').querySelector(`[data-cat-total="${cat.id}"]`);
    if (catCell) catCell.textContent = eur(catTotal(cat));
  }
  renderChiffres();
  renderRepart();
  renderPayments();
}

// --- ce qui est réglé ---------------------------------------------------------
function renderPayments() {
  const lines = BUDGET.categories.flatMap((c) =>
    c.items.map((i) => ({ ...i, cat: c.name, amount: lineTotal(i) })));
  const settled = lines.filter(estRegle);
  const sum = (ls) => ls.reduce((s, l) => s + l.amount, 0);
  const pct = Math.round((sum(settled) / sum(lines)) * 100) || 0;

  q('payments').innerHTML = `
    <div class="pay">
      <div class="prog__bar"><span style="width:${pct}%"></span></div>
      <p class="pay__sum">
        <b class="data">${eur(sum(settled))}</b> réglés sur <b class="data">${eur(sum(lines))}</b>
        <span class="mut">· reste <span class="data">${eur(sum(lines) - sum(settled))}</span></span>
      </p>
      ${BUDGET.categories.map((c) => `
        <section class="pay__cat">
          <h3>${esc(c.name)}</h3>
          ${c.items.map((i) => {
            const locked = prepaid.has(i.key);
            const on = locked || !!paid[i.key];
            return `
            <label class="pay__row${on ? ' is-paid' : ''}">
              <input type="checkbox" data-key="${i.key}" ${on ? 'checked' : ''} ${locked ? 'disabled' : ''}>
              <span class="pay__label">
                <b>${esc(i.label)}</b>
                <span class="mut">${locked ? (i.settled ? `payé · ${esc(i.sub || '')}` : 'réglé via Booking') : esc(i.sub || '')}</span>
              </span>
              <span class="data">${eur(lineTotal(i))}</span>
            </label>`;
          }).join('')}
        </section>`).join('')}
    </div>`;

  q('payments').querySelectorAll('input[type=checkbox]:not(:disabled)').forEach((cb) => {
    cb.addEventListener('change', () => {
      paid[cb.dataset.key] = cb.checked;
      savePaid();
      renderPayments();
      renderChiffres();
      q('budget').querySelectorAll('.budget__row').forEach(() => {});
      renderBudget();
    });
  });
}

renderChiffres();
renderRepart();
renderBudget();
renderPayments();
initReveal();
</script>
</body>
</html>
