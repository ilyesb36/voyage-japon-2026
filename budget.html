<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le budget — Japon 2026</title>
<meta name="description" content="Qui a payé quoi, ce qu'il reste à payer, et qui doit combien à l'autre.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1512" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Japon 2026">
<link rel="stylesheet" href="app.css">
<script>
/* Avant le rendu : éviter l'éclair clair quand le sombre est choisi. */
try { if (localStorage.getItem('jp2026_theme') === 'dark')
  document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
</script>
</head>
<body>

<main class="wrap">
  <!-- Le budget tient en une phrase : ce que coûte le voyage, ce qui est payé, ce
       qui reste à payer. Dessous, une barre en trois couleurs, « entre vous » en une
       ligne, ce qu'il reste à payer en deux listes (à réserver avant le départ, sur
       place), puis le détail par catégorie, replié. Pendant le voyage, une ligne en
       tête dit ce qu'on dépense par jour. Tout vient des données : qui a payé quoi
       s'écrit dans BUDGET[].qui, et le taux des yens dans BUDGET.yenParEuro, donc
       c'est pareil sur les deux téléphones. -->
  <header class="section bud__tete">
    <h1>Le budget</h1>
  </header>

  <section class="section bud__sec" id="synthese"></section>      <!-- la phrase et la barre -->
  <section class="section bud__sec" id="entre-vous"></section>    <!-- une phrase -->
  <section class="section bud__sec" id="avant"></section>         <!-- à réserver avant le départ -->
  <section class="section bud__sec" id="sur-place"></section>     <!-- sur place -->
  <section class="section bud__sec" id="detail"></section>        <!-- le détail par catégorie, replié -->

  <section class="section">
    <p class="jour__ailleurs">
      <a class="btn btn--ghost" href="secours.html#logements">Adresses des logements</a>
      <a class="btn btn--ghost" href="aujourdhui.html">Ce qu'il reste à réserver</a>
    </p>
  </section>
</main>

<script type="module">
import { HOTELS, BUDGET } from './data/trip.js';
import { RESERVER } from './data/pratique.js';
import { mountChrome, esc, eur, formatDate, moment } from './app/ui.js';
import { etatDe, ETAT } from './app/resa.js';

mountChrome('budget.html');
const q = (id) => document.getElementById(id);

// --- le calcul ----------------------------------------------------------------
// Rien ne vient du téléphone : les forfaits sont ceux de BUDGET.defaults et les
// payeurs ceux de BUDGET[].qui, donc la page est la même chez Ilyès et chez Mathilde.
// Le poste hébergement est la somme des réservations, jamais une saisie.
const MULT = { vol: 2, train: 2, food: 24 * 2, act: 24 * 2 };

function montant(item) {
  if (item.fromHotel) return HOTELS.find((h) => h.id === item.fromHotel).price;
  if (item.fix != null) return item.fix;
  return (BUDGET.defaults[item.dyn] || 0) * MULT[item.dyn];
}
const somme = (items) => items.reduce((t, i) => t + montant(i), 0);

// Payé = un payeur connu dans les données, ou un hôtel réglé.
const payeLigne = (i) => !!i.qui || HOTELS.some((h) => h.id === i.key && h.paid);
const lignes = BUDGET.categories.flatMap((c) => c.items.map((i) => ({ ...i, cat: c.id })));
const total = somme(lignes);
const paye = somme(lignes.filter(payeLigne));
// Avant le départ : ce qui se réserve ou se paie en ligne (billets, tables), non réglé.
const avant = lignes.filter((i) => ['billets', 'tables'].includes(i.cat) && !payeLigne(i));
// Sur place : le reste non réglé (passes, trains, repas, sorties).
const surPlace = lignes.filter((i) => !payeLigne(i) && !avant.includes(i));
// Entre vous : la part de chacun = ce qu'il a avancé seul + la moitié de ce qui est payé à deux.
const avI = somme(lignes.filter((i) => i.qui === 'I'));
const avM = somme(lignes.filter((i) => i.qui === 'M'));
const ecart = (avI - avM) / 2;   // > 0 : Mathilde doit cet écart à Ilyès

// --- de quoi écrire les listes ---------------------------------------------------
// Une rangée : le nom et, dessous, ce qui le situe ; le montant à droite. C'est du
// HTML : l'appelant échappe ce qui vient des données.
const rangee = (nom, sous, droite) => `
  <li class="bud__ligne">
    <span class="bud__texte">
      <b class="bud__nom">${nom}</b>
      <span class="bud__sous">${sous}</span>
    </span>
    <span class="bud__montant">${droite}</span>
  </li>`;
const chiffre = (n) => `<span class="data">${eur(n)}</span>`;
// Un montant écrit dans un texte des données (« ≈ 6 040 ¥ ») ne se coupe pas en deux lignes : les
// milliers, l'unité et le « ≈ » qui le précède tiennent ensemble.
const insec = (t) => t.replace(/(\d) (?=\d{3}(?!\d))/g, '$1\u00a0').replace(/ (¥|€)/g, '\u00a0$1').replace(/≈ /g, '≈\u00a0');
const QUI = { I: 'par Ilyès', M: 'par Mathilde', D: 'à deux' };
// Les yens des équivalents suivent le taux du budget, à la centaine près : un ordre de grandeur.
// Une espace insécable ordinaire, comme eur() : l'espace fine d'Intl se lit « 11500 ».
const yen = (euros) => {
  const n = new Intl.NumberFormat('fr-FR').format(Math.round((euros * BUDGET.yenParEuro) / 100) * 100);
  return `<span class="data">${n.replace(/\u202f/g, '\u00a0')}\u00a0¥</span>`;
};
// Ce qu'on dépense par jour, repas et sorties, pour deux : le forfait des données, rien de saisi ici.
const parJour = (BUDGET.defaults.food + BUDGET.defaults.act) * 2;
// Un total impair ne se partage pas en deux montants entiers (4 129,5 € chacun) : on écrit « ≈ » devant la moitié arrondie.
const chacun = `${Number.isInteger(total / 2) ? '' : '≈\u00a0'}${eur(total / 2)}`;

// --- la phrase et la barre ------------------------------------------------------
// Trois parts, qui font le voyage : ce qui est payé, ce qui est à réserver avant le départ,
// ce qui se dépense sur place. La barre les montre à l'échelle ; la légende les nomme.
// Pendant le voyage, la première ligne dit ce qu'on peut dépenser aujourd'hui, avec le
// chemin vers les tables. Dessous, ce que le budget ne compte pas, et son taux de change.
function renderSynthese() {
  const parts = [
    ['paye', 'Payé', paye],
    ['avant', moment() === 'avant' ? 'À réserver avant le départ' : 'À réserver', somme(avant)],
    ['place', 'Sur place', somme(surPlace)],
  ];
  q('synthese').innerHTML = `
    ${moment() === 'pendant' ? `<p class="bud__jour"><span>Aujourd'hui : <b>≈\u00a0${chiffre(parJour)} (≈\u00a0${yen(parJour)})</b> pour deux</span>
      <a class="btn btn--ghost" href="table.html">Où dîner</a></p>` : ''}
    <p class="bud__phrase">Le voyage coûte ${eur(total)} pour deux (${chacun} chacun).</p>
    <p class="bud__bilan"><span>Déjà payé : <b>${eur(paye)}</b></span> <span>Reste à payer : <b>${eur(total - paye)}</b></span></p>
    <div class="bud__barre" role="img" aria-label="${parts.map(([, nom, n]) => `${nom} ${eur(n)}`).join(', ')}">
      ${parts.filter(([, , n]) => n > 0).map(([id, , n]) => `<span class="bud__seg bud__seg--${id}" style="flex-grow:${n}"></span>`).join('')}
    </div>
    <ul class="bud__legende">
      ${parts.map(([id, nom, n]) => `<li><i class="bud__pastille bud__pastille--${id}" aria-hidden="true"></i>${nom} <b class="data">${eur(n)}</b></li>`).join('')}
    </ul>
    <p class="bud__note">Pas compris : la taxe de séjour (à régler sur place, voir <a href="aujourdhui.html#a-lire">À faire</a>) et les achats personnels.
      Les yens suivent le taux du budget : 1\u00a0€\u00a0≈\u00a0${BUDGET.yenParEuro}\u00a0¥.</p>`;
}

// --- entre vous -----------------------------------------------------------------
// « Payé à deux : hébergement et vols. Payé par Ilyès : Nintendo Museum. » — lu dans
// les `qui`, jamais écrit en dur. Une catégorie payée en entier par la même personne
// se nomme d'un mot ; sinon, on cite les lignes.
const liste = (xs) => (xs.length > 1 ? `${xs.slice(0, -1).join(', ')} et ${xs.at(-1)}` : xs.join(''));
const explication = () => ['D', 'I', 'M']
  .map((code) => ({
    code,
    quoi: BUDGET.categories.flatMap((c) => {
      const siennes = c.items.filter((i) => i.qui === code);
      return siennes.length === c.items.length ? [c.name.toLowerCase()] : siennes.map((i) => i.label);
    }),
  }))
  .filter((g) => g.quoi.length)
  .map((g) => `Payé ${QUI[g.code]} : ${liste(g.quoi)}.`)
  .join(' ');

function renderEntreVous() {
  const s = Math.round(Math.abs(ecart));
  const [doit, a] = ecart > 0 ? ['Mathilde', 'Ilyès'] : ['Ilyès', 'Mathilde'];
  const pourquoi = explication();
  q('entre-vous').innerHTML = `
    <h2 class="bud__quoi">Entre vous</h2>
    <p class="bud__solde">${s === 0 ? 'Vous êtes à égalité' : `${doit} doit <b>${eur(s)}</b> à ${a}`}</p>
    ${pourquoi ? `<p class="bud__explique">${esc(pourquoi)}</p>` : ''}`;
}

// --- à réserver avant le départ --------------------------------------------------
// Chaque ligne : le libellé, la date de la réservation, son état, le montant. L'état
// d'une table ou d'un billet à réserver s'écrit une seule fois, dans RESERVER : la clé
// du budget est `table-<id>` ou `billet-<id>`, on lit la réservation de l'<id>.
const resaDe = (i) => /^(table|billet)-/.test(i.key)
  ? RESERVER.find((r) => r.id === i.key.replace(/^(table|billet)-/, '')) : undefined;
// Du plus proche au plus lointain ; sans date, à la fin.
const parDate = (a, b) => (resaDe(a)?.forDate || '9999').localeCompare(resaDe(b)?.forDate || '9999');

function ligneAvant(i) {
  const resa = resaDe(i);
  const etat = resa ? etatDe(resa) : '';
  return rangee(esc(i.label),
    `${resa ? `<span class="data">${esc(formatDate(resa.forDate))}</span>` : ''}${
      etat ? ` <span class="bud__etat bud__etat--${etat}">${ETAT[etat]}</span>` : ''}`,
    chiffre(montant(i)));
}

// Les billets en lignes ; les tables, plus nombreuses, sous un seul total qui les replie.
function renderAvant() {
  const billets = avant.filter((i) => i.cat === 'billets').sort(parDate);
  const tables = avant.filter((i) => i.cat === 'tables').sort(parDate);
  q('avant').innerHTML = `
    <div class="shead"><h2 class="bud__titre"><i class="bud__pastille bud__pastille--avant" aria-hidden="true"></i>${moment() === 'avant' ? 'À réserver avant le départ' : 'À réserver'}</h2><span class="shead__meta">${eur(somme(avant))}</span></div>
    ${tables.length ? '<p class="bud__note">Les tables se paient au restaurant.</p>' : ''}
    ${billets.length ? `<ul class="card bud__lignes">${billets.map(ligneAvant).join('')}</ul>` : ''}
    ${tables.length ? `
    <details class="card bud__pli">
      <summary><span class="bud__texte"><b class="bud__nom">${tables.length} table${tables.length > 1 ? 's' : ''} · ${chiffre(somme(tables))}</b></span></summary>
      <ul class="bud__lignes">${tables.map(ligneAvant).join('')}</ul>
    </details>` : ''}
    ${avant.length ? '' : '<p class="mut">Tout est réservé : rien à réserver avant le départ.</p>'}`;
}

// --- sur place -------------------------------------------------------------------
// Les passes, les trains et les valises en lignes ; les repas et les sorties se disent en un
// forfait par jour, pour deux, avec son équivalent en yens.
const court = (i) => (i.sub || '').split(' · ')[0];

function renderSurPlace() {
  const forfaits = surPlace.filter((i) => i.cat === 'place');
  q('sur-place').innerHTML = `
    <div class="shead"><h2 class="bud__titre"><i class="bud__pastille bud__pastille--place" aria-hidden="true"></i>Sur place</h2><span class="shead__meta">${eur(somme(surPlace))}</span></div>
    <ul class="card bud__lignes">
      ${surPlace.filter((i) => i.cat !== 'place').map((i) => rangee(esc(i.label), esc(insec(court(i))), chiffre(montant(i)))).join('')}
      ${forfaits.length ? rangee('Repas et sorties', `≈\u00a0${chiffre(parJour)} (≈\u00a0${yen(parJour)}) par jour pour deux (les tables réservées en plus)`, chiffre(somme(forfaits))) : ''}
    </ul>`;
}

// --- le détail --------------------------------------------------------------------
// Un repli par catégorie : son total, ce qui est payé et ce qu'il reste ; dedans,
// ses lignes avec leur légende, leur montant et leur payeur.
function ligneDetail(i) {
  const texte = i.qui ? `payé ${QUI[i.qui]}` : payeLigne(i) ? 'payé' : 'pas encore payé';
  return rangee(esc(i.label), esc(insec(i.sub || '')),
    `${chiffre(montant(i))}<span class="bud__qui${payeLigne(i) ? ' is-paye' : ''}">${texte}</span>`);
}

function renderDetail() {
  q('detail').innerHTML = `
    <div class="shead"><h2>Le détail</h2></div>
    ${BUDGET.categories.map((cat) => {
      const items = lignes.filter((i) => i.cat === cat.id);
      const reste = somme(items.filter((i) => !payeLigne(i)));
      return `
      <details class="card bud__pli">
        <summary>
          <span class="bud__texte">
            <b class="bud__nom">${esc(cat.name)}</b>
            <span class="bud__sous">${reste === 0 ? '<span class="bud__ok">tout est payé</span>'
              : `payé ${eur(somme(items) - reste)} · reste ${eur(reste)}`}</span>
          </span>
          <span class="bud__montant">${chiffre(somme(items))}</span>
        </summary>
        <ul class="bud__lignes">${items.map(ligneDetail).join('')}</ul>
      </details>`;
    }).join('')}`;
}

renderSynthese();
renderEntreVous();
renderAvant();
renderSurPlace();
renderDetail();
</script>
</body>
</html>
