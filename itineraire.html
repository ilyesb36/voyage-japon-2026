<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jour par jour — Japon 2026</title>
<meta name="description" content="Les 25 jours du voyage, avec pour chaque journée libre les journées type de la ville.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1512" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
<script>
/* Avant le rendu : éviter l'éclair clair quand le sombre est choisi. */
try { if (localStorage.getItem('jp2026_theme') === 'dark')
  document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
</script>
</head>
<body>

<main class="wrap">
  <header class="section">
    <h1>Jour par jour</h1>
    <p class="hero__lede">
      25 jours. Rien n'est figé : les journées libres renvoient vers d'autres
      façons d'occuper la journée dans la même ville.
    </p>
  </header>

  <section class="section">
    <div class="shead disc">
      <h2>Les journées type</h2>
      <p>Trente façons d'occuper une journée, si le programme tombe à l'eau.</p>
      <span class="shead__meta" id="tpl-meta"></span>
    </div>
    <div class="chipbar" id="tpl-filter"></div>
    <div class="tplgrid" id="tplgrid"></div>
  </section>

  <section class="section">
    <div class="shead disc"><h2>Les 25 jours</h2></div>
    <nav class="daynav chipbar" id="daynav" aria-label="Aller à une étape"></nav>
    <div id="itin"></div>
  </section>
</main>

<script type="module">
import { CITIES, STEPS, HOTELS, SEGMENTS, EXCURSIONS } from './data/trip.js';
import { DAYS, TEMPLATES } from './data/days.js';
import { mountChrome, initReveal, initCoverParallax, initProgressBar, esc, formatDate, today } from './app/ui.js';

mountChrome('itineraire.html');
const q = (id) => document.getElementById(id);

// Les images d'ouverture, partagées avec l'accueil.
const HERO = {"ouverture": "img/hero/ouverture.webp", "tokyo": "img/hero/tokyo.webp", "kanazawa": "img/hero/kanazawa.webp", "kyoto": "img/hero/kyoto.webp", "osaka": "img/hero/osaka.webp", "hakone": "img/hero/hakone.webp", "tokyo2": "img/hero/tokyo2.webp"};
const heroFor = (step) => (step.n === 6 && HERO.tokyo2) ? HERO.tokyo2 : HERO[step.cityId];

const KIND = {
  vol: 'Vol', transfert: 'Trajet', excursion: 'Excursion', etape: null, libre: 'Journée libre',
};

// Les journées type ne méritent pas leur propre page : elles ne servent qu'au
// moment où l'on regarde un jour sans programme. On les rattache donc à la
// ville, et on les propose au bon endroit.
const tplByCity = TEMPLATES.reduce((m, t) => ((m[t.cityId] ||= []).push(t), m), {});

// Une journée est libre si elle le dit, ou si son programme tient en trois
// lignes. Ces jours-là renvoient vers les journées type de leur ville.
const isFree = (d) => d.kind === 'etape' && (/\blibre\b/i.test(d.title) || d.items.length <= 3);

// Tokyo est deux étapes distinctes mais une seule ville : ses journées type ne
// se rendent qu'à la première, la seconde y renvoie.
const firstStepOfCity = {};
STEPS.forEach((s) => (firstStepOfCity[s.cityId] ??= s.id));

// --- les journées type, en vue ------------------------------------------------
// Elles étaient repliées en fin d'étape : personne ne les trouvait. Elles ont
// leur section, en haut, avec leur photo — et le renvoi depuis les jours
// libres reste en place.
const TPL_CITY = [{ id: 'all', name: 'Toutes' },
  ...[...new Set(TEMPLATES.map((t) => t.cityId))].filter(Boolean)
    .map((id) => ({ id, name: CITIES[id]?.name || id, color: CITIES[id]?.color })),
  ...(TEMPLATES.some((t) => !t.cityId) ? [{ id: 'trip', name: 'Day trips' }] : [])];

let tplState = 'all';

q('tpl-filter').innerHTML = TPL_CITY.map((o) => `
  <button class="chip" data-city="${o.id}" aria-pressed="${o.id === 'all'}">
    ${o.color ? `<span class="chip__dot" style="background:${o.color}"></span>` : ''}${esc(o.name)}
  </button>`).join('');

q('tpl-filter').addEventListener('click', (e) => {
  const b = e.target.closest('.chip');
  if (!b) return;
  tplState = b.dataset.city;
  q('tpl-filter').querySelectorAll('.chip').forEach((c) =>
    c.setAttribute('aria-pressed', String(c === b)));
  paintTemplates();
});

function paintTemplates() {
  const list = TEMPLATES.filter((t) =>
    tplState === 'all' || (tplState === 'trip' ? !t.cityId : t.cityId === tplState));

  q('tplgrid').innerHTML = list.map((t) => {
    const c = t.cityId ? CITIES[t.cityId] : null;
    return `
    <a class="card card--link tpl" href="#${t.id}" style="--c:${c ? c.color : 'var(--mut)'}">
      <div class="thumb thumb--wide">
        ${t.img ? `<img src="${esc(t.img)}" alt="" loading="lazy" decoding="async">` : ''}
        ${t.category ? `<span class="tpl__tag">${esc(t.category)}</span>` : ''}
      </div>
      <div class="tpl__body">
        <h3>${esc(t.title)}</h3>
        <p>${esc(t.sub)}</p>
        <p class="tpl__meta">
          <span class="city-dot" style="--c:${c ? c.color : 'var(--mut)'}">${c ? esc(c.name) : 'Day trip'}</span>
          <span class="mut">${t.steps.length} étapes</span>
        </p>
      </div>
    </a>`;
  }).join('');

  q('tpl-meta').textContent = `${list.length} sur ${TEMPLATES.length}`;
}
paintTemplates();

// Cliquer une vignette ouvre le détail là où il vit déjà, en bas de l'étape.
q('tplgrid').addEventListener('click', (e) => {
  const a = e.target.closest('.tpl');
  if (!a) return;
  const target = document.querySelector(a.getAttribute('href'));
  if (!target) return;
  e.preventDefault();
  target.closest('details.alt')?.setAttribute('open', '');
  target.setAttribute('open', '');
  target.scrollIntoView({ block: 'center', behavior: 'smooth' });
});

// --- navigation par étape -----------------------------------------------------
q('daynav').innerHTML = STEPS.map((s) => {
  const c = CITIES[s.cityId];
  return `<a class="chip" href="#${s.id}" style="--c:${c.color}">
    <span class="chip__dot" style="background:${c.color}"></span>${esc(c.name)}
    <span class="mut data"> ${formatDate(s.from).replace(/ (novembre|décembre)/, (m, p) => ' ' + p.slice(0, 3))}</span>
  </a>`;
}).join('');

// --- les jours, groupés par étape ---------------------------------------------
const byStep = DAYS.reduce((m, d) => ((m[d.stepId || 'depart'] ||= []).push(d), m), {});
const now = today();

let html = '';
for (const step of STEPS) {
  const c = CITIES[step.cityId];
  const hotel = HOTELS.find((h) => h.id === step.hotelId);
  const days = byStep[step.id] || [];
  const seg = SEGMENTS.find((g) => g.toStepId === step.id);

  html += `
  <section class="phase" id="${step.id}" style="--c:${c.color}">
    <figure class="phase__shot">
      <img src="${heroFor(step)}" alt="${esc(c.name)}" loading="lazy" decoding="async">
    </figure>
    <header class="phase__head">
      <span class="step-num" style="--c:${c.color}">${step.n}</span>
      <div>
        <h2>${esc(c.name)}${step.area ? ` <span class="mut">· ${esc(step.area)}</span>` : ''}</h2>
        <p class="phase__sub">
          <span class="data">${formatDate(step.from)} → ${formatDate(step.to)}</span>
          · ${step.nights} nuit${step.nights > 1 ? 's' : ''}
          · ${esc(hotel.name)}
        </p>
      </div>
      ${seg ? `<span class="phase__arrive data">${esc(seg.duration)} depuis ${esc(CITIES[STEPS.find((s) => s.id === seg.fromStepId).cityId].name)}</span>` : ''}
    </header>

    ${days.map((d) => renderDay(d, c)).join('')}
    ${renderTemplates(step, c)}
  </section>`;
}

/**
 * Les journées type de la ville, une seule fois par étape et non sous chaque
 * jour : les répéter était précisément le défaut qu'on corrige.
 */
function renderTemplates(step, c) {
  const tpls = tplByCity[step.cityId] || [];
  if (!tpls.length) return '';

  const home = firstStepOfCity[step.cityId];
  if (home !== step.id) {
    return `<p class="alt-ref">
      Les <a href="#tpl-${home}">${tpls.length} journées type à ${esc(c.name)}</a>
      sont listées à la première étape.</p>`;
  }

  const free = STEPS.filter((s) => s.cityId === step.cityId)
    .flatMap((s) => byStep[s.id] || []).filter(isFree).length;

  return `
  <details class="alt alt--phase" id="tpl-${step.id}">
    <summary class="alt__head">
      <b>Les journées type à ${esc(c.name)}</b>
      <span class="mut">${tpls.length} façons d'occuper une journée${free ? ` — ${free} jour${free > 1 ? 's' : ''} libre${free > 1 ? 's' : ''} dans cette ville` : ''}</span>
      <span class="day__car" aria-hidden="true">›</span>
    </summary>
    <div class="alt__list">
      ${tpls.map(templateItem).join('')}
    </div>
  </details>`;
}

function templateItem(t) {
  return `
  <details class="alt__item" id="${t.id}">
    <summary>
      ${t.img ? `<img class="alt__thumb" src="${esc(t.img)}" alt="" loading="lazy" decoding="async">` : ''}
      <b>${esc(t.title)}</b>
      <span class="mut">${esc(t.sub)}</span>
      ${t.category ? `<span class="day__kind">${esc(t.category)}</span>` : ''}
      ${t.priority ? `<span class="prio prio--${t.priority}"></span>` : ''}
    </summary>
    <ol class="alt__steps">
      ${t.steps.map((s) => `
        <li>
          <span class="data alt__h">${esc(s.h)}</span>
          <span class="alt__what">${esc(s.text)}${s.note ? ` <span class="mut">— ${esc(s.note)}</span>` : ''}
          ${s.maps ? ` <a href="${esc(s.maps)}" target="_blank" rel="noopener" class="alt__pin" aria-label="Ouvrir dans Google Maps">↗</a>` : ''}</span>
          ${s.img ? `<img class="alt__stepshot" src="${esc(s.img)}" alt="" loading="lazy" decoding="async">` : ''}
        </li>`).join('')}
    </ol>
  </details>`;
}

// Le vol aller n'appartient à aucune étape : il ouvre le voyage.
const depart = byStep.depart || [];
if (depart.length) {
  html = `<section class="phase phase--depart" id="depart" style="--c:var(--mut)">
    <header class="phase__head">
      <span class="step-num" style="--c:var(--mut)">✈</span>
      <div><h2>Le départ</h2><p class="phase__sub">Paris → Shanghai → Tokyo</p></div>
    </header>
    ${depart.map((d) => renderDay(d, { color: 'var(--mut)', name: '' })).join('')}
  </section>` + html;
}

q('itin').innerHTML = html;

function renderDay(d, c) {
  const kind = isFree(d) ? KIND.libre : KIND[d.kind];
  const past = d.date < now;
  const isToday = d.date === now;
  const free = isFree(d) && (tplByCity[d.cityId] || []).length;

  return `
  <details class="day${past ? ' day--past' : ''}${isToday ? ' day--today' : ''}" id="jour-${d.n}"${isToday ? ' open' : ''}>
    <summary class="day__head">
      <span class="day__date">
        <b class="data">${d.label.split(' ')[0]}</b>
        <span class="label">${d.label.split(' ')[1]}</span>
      </span>
      <span class="day__title">
        <b>${esc(d.title)}</b>
        ${kind ? `<span class="day__kind">${kind}</span>` : ''}
      </span>
      <span class="day__count mut data">${d.items.length}</span>
      <span class="day__car" aria-hidden="true">›</span>
    </summary>

    <div class="day__body">
      <ul class="day__items">
        ${d.items.map((i) => `<li${i.evening ? ' class="day__evening"' : ''}>${esc(i.text)}</li>`).join('')}
      </ul>
      ${d.tip ? `<p class="day__tip">${esc(d.tip.replace(/^💡\s*/, ''))}</p>` : ''}
      ${free ? `<p class="day__free">Rien de calé : ${free} journées type sont proposées
        <a href="#tpl-${firstStepOfCity[d.cityId]}">plus bas</a>.</p>` : ''}
    </div>
  </details>`;
}

// Aucune journée type ne doit rester orpheline : celles rattachées à un lieu
// qui n'est pas une étape (les day trips) sont regroupées en fin de page.
const stepCities = new Set(STEPS.map((s) => s.cityId));
const orphans = TEMPLATES.filter((t) => !stepCities.has(t.cityId));

if (orphans.length) {
  q('itin').insertAdjacentHTML('beforeend', `
  <section class="phase" id="autres">
    <header class="phase__head">
      <span class="step-num" style="--c:var(--mut)">+</span>
      <div>
        <h2>Les autres journées type</h2>
        <p class="phase__sub">${orphans.length} idées de journées qui ne tombent pas sur un jour libre.</p>
      </div>
    </header>
    <div class="alt alt--standalone">
      <div class="alt__list">
        ${orphans.map(templateItem).join('')}
      </div>
    </div>
  </section>`);
}

// Ouvrir le jour ciblé par l'ancre, et le placer sous la nav collante.
if (location.hash) {
  const el = document.querySelector(location.hash);
  if (el?.tagName === 'DETAILS') el.open = true;
  el?.scrollIntoView({ block: 'start' });
}

initReveal();
initCoverParallax();
initProgressBar();
</script>

<script>
/* Enregistrement du service worker : c'est lui qui rend le site utilisable
   sans réseau. La page Pratique pilote en plus le téléchargement des photos. */
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
