<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le programme — Japon 2026</title>
<meta name="description" content="Le programme jour par jour, et trente journées type par ville si le programme tombe à l'eau.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1512" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
<script>
/* Avant le rendu : éviter l'éclair clair quand le sombre est choisi. */
try { if (localStorage.getItem('jp2026_theme') === 'dark')
  document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
</script>
</head>
<body>

<main class="wrap">
  <header class="section">
    <h1>Le programme</h1>
    <p class="hero__lede" id="lede"></p>
  </header>

  <section class="section">
    <div class="shead disc">
      <h2>Les journées type</h2>
      <p>Trente façons d'occuper une journée, si le programme tombe à l'eau.</p>
      <span class="shead__meta" id="tpl-meta"></span>
    </div>
    <div class="chipbar" id="tpl-filter"></div>
    <div class="tplgrid" id="tplgrid"></div>
  </section>

  <section class="section">
    <div class="shead disc">
      <h2>À manger absolument</h2>
      <p>Les spécialités de chaque étape — à cocher au fil du voyage.</p>
      <span class="shead__meta" id="eat-meta"></span>
    </div>
    <div class="chipbar" id="eat-filter"></div>
    <div id="eatlist"></div>
  </section>

  <section class="section">
    <div class="shead disc"><h2 id="jours-titre">Les jours</h2></div>
    <nav class="daynav chipbar" id="daynav" aria-label="Aller à une étape"></nav>
    <div id="itin"></div>
  </section>
</main>
<dialog class="tpldlg" id="tpldlg"><div class="tpldlg__in"><button class="tpldlg__x" id="tpldlg-x" aria-label="Fermer">&times;</button><div id="tpldlg-body"></div></div></dialog>


<script type="module">
import { CITIES, STEPS, HOTELS, SEGMENTS, EXCURSIONS } from './data/trip.js';
import { DAYS, TEMPLATES } from './data/days.js';
import { LIEUX } from './data/lieux.js';
import { DELICES } from './data/delices.js';
import { SPOTS } from './data/spots.js';
import { mountChrome, initReveal, initCoverParallax, initProgressBar, esc, formatDate, today } from './app/ui.js';
import { resaStrip, resasForDate } from './app/resa.js';

mountChrome('itineraire.html');
const q = (id) => document.getElementById(id);

// Les images d'ouverture, partagées avec l'accueil.
const HERO = {"ouverture": "img/hero/ouverture.webp", "tokyo": "img/hero/tokyo.webp", "kanazawa": "img/hero/kanazawa.webp", "kyoto": "img/hero/kyoto.webp", "osaka": "img/hero/osaka.webp", "hakone": "img/hero/hakone.webp", "tokyo2": "img/hero/tokyo2.webp"};
const heroFor = (step) => (step.n === 6 && HERO.tokyo2) ? HERO.tokyo2 : HERO[step.cityId];

const KIND = {
  vol: 'Vol', transfert: 'Trajet', excursion: 'Excursion', etape: null, libre: 'Journée libre',
};

// Les journées type ne méritent pas leur propre page : elles ne servent qu'au
// moment où l'on regarde un jour sans programme. On les rattache donc à la
// ville, et on les propose au bon endroit.
const tplByCity = TEMPLATES.reduce((m, t) => ((m[t.cityId] ||= []).push(t), m), {});

// Une journée est libre si elle le dit, ou si son programme tient en trois
// lignes. Ces jours-là renvoient vers les journées type de leur ville.

// Tokyo est deux étapes distinctes mais une seule ville : ses journées type ne
// se rendent qu'à la première, la seconde y renvoie.
const firstStepOfCity = {};
STEPS.forEach((s) => (firstStepOfCity[s.cityId] ??= s.id));

// --- les journées type, en vue ------------------------------------------------
// Elles étaient repliées en fin d'étape : personne ne les trouvait. Elles ont
// leur section, en haut, avec leur photo — et le renvoi depuis les jours
// libres reste en place.
const TPL_CITY = [{ id: 'all', name: 'Toutes' },
  ...[...new Set(TEMPLATES.map((t) => t.cityId))].filter(Boolean)
    .map((id) => ({ id, name: CITIES[id]?.name || id, color: CITIES[id]?.color })),
  ...(TEMPLATES.some((t) => !t.cityId) ? [{ id: 'trip', name: 'Day trips' }] : [])];

let tplState = 'all';

q('tpl-filter').innerHTML = TPL_CITY.map((o) => `
  <button class="chip" data-city="${o.id}" aria-pressed="${o.id === 'all'}">
    ${o.color ? `<span class="chip__dot" style="background:${o.color}"></span>` : ''}${esc(o.name)}
  </button>`).join('');

q('tpl-filter').addEventListener('click', (e) => {
  const b = e.target.closest('.chip');
  if (!b) return;
  tplState = b.dataset.city;
  q('tpl-filter').querySelectorAll('.chip').forEach((c) =>
    c.setAttribute('aria-pressed', String(c === b)));
  paintTemplates();
});

function paintTemplates() {
  const list = TEMPLATES.filter((t) =>
    tplState === 'all' || (tplState === 'trip' ? !t.cityId : t.cityId === tplState));

  q('tplgrid').innerHTML = list.map((t) => {
    const c = t.cityId ? CITIES[t.cityId] : null;
    return `
    <a class="card card--link tpl" href="#${t.id}" style="--c:${c ? `var(--c-${c.id})` : 'var(--mut)'}">
      <div class="thumb thumb--wide">
        ${t.img ? `<img src="${esc(t.img)}" alt="" loading="lazy" decoding="async">` : ''}
        ${t.category ? `<span class="tpl__tag">${esc(t.category)}</span>` : ''}
      </div>
      <div class="tpl__body">
        <h3>${esc(t.title)}</h3>
        <p>${esc(t.sub)}</p>
        <p class="tpl__meta">
          <span class="city-dot" style="--c:${c ? `var(--c-${c.id})` : 'var(--mut)'}">${c ? esc(c.name) : 'Day trip'}</span>
          <span class="mut">${t.steps.length} étapes</span>
        </p>
      </div>
    </a>`;
  }).join('');

  q('tpl-meta').textContent = `${list.length} sur ${TEMPLATES.length}`;
}
paintTemplates();

// Cliquer une vignette ouvre le détail là où il vit déjà, en bas de l'étape.
q('tplgrid').addEventListener('click', (e) => {
  const a = e.target.closest('.tpl');
  if (!a) return;
  const target = document.querySelector(a.getAttribute('href'));
  if (!target) return;
  e.preventDefault();
  target.closest('details.alt')?.setAttribute('open', '');
  target.setAttribute('open', '');
  // Le défilement animé est une animation comme une autre : si le système
  // demande de les réduire, on saute directement à la cible.
  const anime = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  target.scrollIntoView({ block: 'center', behavior: anime ? 'smooth' : 'auto' });
});

// --- navigation par étape -----------------------------------------------------
q('daynav').innerHTML = STEPS.map((s) => {
  const c = CITIES[s.cityId];
  return `<a class="chip" href="#${s.id}" style="--c:var(--c-${c.id})">
    <span class="chip__dot" style="background:${c.color}"></span>${esc(c.name)}
    <span class="mut data"> ${formatDate(s.from).replace(/ (novembre|décembre)/, (m, p) => ' ' + p.slice(0, 3))}</span>
  </a>`;
}).join('');

// --- les jours, groupés par étape ---------------------------------------------
const byStep = DAYS.reduce((m, d) => ((m[d.stepId || 'depart'] ||= []).push(d), m), {});
const now = today();

// Comptés, pas écrits : le nombre de jours et de journées type a déjà changé
// une fois, et les phrases d'intro, elles, ne bougeaient pas.
q('lede').textContent =
  `${DAYS.length} jours. Rien n'est figé : chaque ville propose aussi des journées type, `
  + `si le programme tombe à l'eau.`;
q('jours-titre').textContent = `Les ${DAYS.length} jours`;

let html = '';
for (const step of STEPS) {
  const c = CITIES[step.cityId];
  const hotel = HOTELS.find((h) => h.id === step.hotelId);
  const days = byStep[step.id] || [];
  const seg = SEGMENTS.find((g) => g.toStepId === step.id);

  html += `
  <section class="phase" id="${step.id}" style="--c:var(--c-${c.id})">
    <figure class="phase__shot">
      <img src="${heroFor(step)}" alt="${esc(c.name)}" loading="lazy" decoding="async">
    </figure>
    <header class="phase__head">
      <span class="step-num" style="--c:var(--c-${c.id})">${step.n}</span>
      <div>
        <h2>${esc(c.name)}${step.area ? ` <span class="mut">· ${esc(step.area)}</span>` : ''}</h2>
        <p class="phase__sub">
          <span class="data">${formatDate(step.from)} → ${formatDate(step.to)}</span>
          · ${step.nights} nuit${step.nights > 1 ? 's' : ''}
          · ${esc(hotel.name)}
        </p>
      </div>
      ${seg ? `<span class="phase__arrive data">${esc(seg.duration)} depuis ${esc(CITIES[STEPS.find((s) => s.id === seg.fromStepId).cityId].name)}</span>` : ''}
    </header>

    ${days.map((d) => renderDay(d, c)).join('')}
    
  </section>`;
}

/**
 * Les journées type de la ville, une seule fois par étape et non sous chaque
 * jour : les répéter était précisément le défaut qu'on corrige.
 */

function templateItem(t) {
  return `
  <details class="alt__item" id="${t.id}">
    <summary>
      ${t.img ? `<img class="alt__thumb" src="${esc(t.img)}" alt="" loading="lazy" decoding="async">` : ''}
      <b>${esc(t.title)}</b>
      <span class="mut">${esc(t.sub)}</span>
      ${t.category ? `<span class="day__kind">${esc(t.category)}</span>` : ''}
      ${t.priority ? `<span class="prio prio--${t.priority}"></span>` : ''}
    </summary>
    <ol class="alt__steps">
      ${t.steps.map((s) => `
        <li>
          <span class="data alt__h">${esc(s.h)}</span>
          <span class="alt__what">${esc(s.text)}${s.note ? ` <span class="mut">— ${esc(s.note)}</span>` : ''}
          ${s.maps ? ` <a href="${esc(s.maps)}" target="_blank" rel="noopener" class="alt__pin" aria-label="Ouvrir dans Google Maps">↗</a>` : ''}</span>
          ${s.img ? `<img class="alt__stepshot" src="${esc(s.img)}" alt="" loading="lazy" decoding="async">` : ''}
        </li>`).join('')}
    </ol>
  </details>`;
}

// Le vol aller n'appartient à aucune étape : il ouvre le voyage.
const depart = byStep.depart || [];
if (depart.length) {
  html = `<section class="phase phase--depart" id="depart" style="--c:var(--mut)">
    <header class="phase__head">
      <span class="step-num" style="--c:var(--mut)">✈</span>
      <div><h2>Le départ</h2><p class="phase__sub">Paris → Shanghai → Tokyo</p></div>
    </header>
    ${depart.map((d) => renderDay(d, { color: 'var(--mut)', name: '' })).join('')}
  </section>` + html;
}

q('itin').innerHTML = html;

function renderDay(d, c) {
  const kind = KIND[d.kind];
  const past = d.date < now;
  const isToday = d.date === now;
  // Deux lignes d'aperçu suffisent : le détail — les arrêts situés, la carte,
  // le parcours dans Maps — vit sur la page du jour. Dérouler ici la même liste
  // faisait dix écrans à faire défiler, pour du contenu lu deux fois.
  const apercu = d.items.slice(0, 2).map((i) => esc(i.text.replace(/\s*[—:(].*$/, '').slice(0, 64))).join(' · ');
  const reste = d.items.length - 2;
  const resa = resasForDate(d.date).length;

  return `
  <a class="day day--lien${past ? ' day--past' : ''}${isToday ? ' day--today' : ''}" id="jour-${d.n}" href="jour.html?d=${d.n}">
    <span class="day__date">
      <b class="data">${d.label.split(' ')[0]}</b>
      <span class="label">${d.label.split(' ')[1]}</span>
    </span>
    <span class="day__title">
      <b>${esc(d.title)}</b>
      ${kind ? `<span class="day__kind">${kind}</span>` : ''}
      ${resa ? '<span class="day__kind day__kind--resa">billet daté</span>' : ''}
      <span class="day__apercu mut">${apercu}${reste > 0 ? ` <span class="data">+${reste}</span>` : ''}</span>
    </span>
    <span class="day__car" aria-hidden="true">›</span>
  </a>`;
}

// Les journées type ne sont plus redistribuées sous chaque étape ni regroupées
// en fin de page : la grille du haut les montre toutes, filtrables par ville,
// orphelines comprises. Elles apparaissaient trois fois sur la même page.

// Ouvrir le jour ciblé par l'ancre, et le placer sous la nav collante.
if (location.hash) {
  document.querySelector(location.hash)?.scrollIntoView({ block: 'start' });
}


// --- détail des journées type : modale au clic ---
(function(){
  var dlg=document.getElementById('tpldlg'), dbody=document.getElementById('tpldlg-body');
  function openTpl(id){
    var t=TEMPLATES.find(function(x){return x.id===id}); if(!t||!dlg) return;
    var c=t.cityId?CITIES[t.cityId]:null;
    var h='<div class="tpldlg__head">';
    if(t.img) h+='<img class="tpldlg__img" src="'+esc(t.img)+'" alt="" loading="lazy">';
    h+='<p class="tpldlg__kicker">'+(c?esc(c.name):'Day trip')+(t.category?' · '+esc(t.category):'')+'</p>';
    h+='<h3>'+esc(t.title)+'</h3><p class="mut">'+esc(t.sub)+'</p></div><ol class="tpldlg__steps">';
    t.steps.forEach(function(s){h+='<li><span class="tpldlg__h">'+esc(s.h||'·')+'</span><div><p>'+esc(s.text)+'</p>'+(s.note?'<p class="tpldlg__note">'+esc(s.note)+'</p>':'')+'</div></li>';});
    h+='</ol>';
    var nrm=function(x){return String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')};
    var CAND=window.__cand||(window.__cand=(function(){var a=[];try{Object.keys(LIEUX).forEach(function(k){var l=LIEUX[k];if(l.nom&&l.maps)a.push({n:l.nom,u:l.maps});});SPOTS.forEach(function(s){if(s.name&&s.maps)a.push({n:s.name,u:s.maps});});}catch(e){}return a;})());
    var txt=nrm(t.title+' '+t.steps.map(function(s){return s.text+' '+(s.note||'')}).join(' '));
    var links=[],seen={};
    (t.pins||[]).forEach(function(p){var k=nrm(p.name);if(!seen[k]){seen[k]=1;links.push({n:p.name,u:'https://www.google.com/maps/search/?api=1'+'\u0026query='+encodeURIComponent(p.name+' '+(c?c.name:'')+' Japon')});}});
    CAND.forEach(function(cd){var k=nrm(cd.n);if(cd.n.length>=4&&!seen[k]&&txt.indexOf(k)>-1){seen[k]=1;links.push({n:cd.n,u:cd.u});}});
    if(links.length){h+='<p class="tpldlg__kicker" style="margin-top:16px">Les lieux sur Maps</p><p class="tpldlg__links">';links.slice(0,14).forEach(function(l){h+='<a class="chip" target="_blank" rel="noopener" href="'+l.u+'">'+esc(l.n)+' \u2197</a> ';});h+='</p>';}
    dbody.innerHTML=h; dlg.showModal(); history.replaceState(null,'','#'+t.id);
  }
  q('tplgrid').addEventListener('click',function(e){var a=e.target.closest('a.tpl'); if(!a) return; e.preventDefault(); openTpl(a.getAttribute('href').slice(1));});
  document.getElementById('tpldlg-x').addEventListener('click',function(){dlg.close()});
  dlg.addEventListener('click',function(e){if(e.target===dlg)dlg.close()});
  dlg.addEventListener('close',function(){history.replaceState(null,'',location.pathname)});
  if(location.hash&&location.hash.indexOf('#tpl-')===0) openTpl(location.hash.slice(1));
})();

// --- à manger absolument ------------------------------------------------------
(function(){
  var KEY='jp2026_eat'; var done={}; try{done=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){}
  var st=(function(){var v=new URLSearchParams(location.search).get('ville');return DELICES.some(function(g){return g.cityId===v;})?v:'all';})();
  var CITYCHIPS=[{id:'all',name:'Toutes'}].concat(DELICES.map(function(g){var c=CITIES[g.cityId];return {id:g.cityId,name:c?c.name:g.cityId,color:c?c.color:null};}));
  function meta(){var tot=0,ok=0;DELICES.forEach(function(g){g.items.forEach(function(x){tot++;if(done[x.id])ok++;});});q('eat-meta').textContent=ok+' / '+tot+' goûtés';}
  function paint(){
    var h='';
    DELICES.forEach(function(g){
      if(st!=='all'&&g.cityId!==st)return;
      var c=CITIES[g.cityId];
      h+='<div class="eatgrp"><h3><span class="city-dot" style="--c:var(--c-'+g.cityId+')">'+esc(c?c.name:g.cityId)+'</span></h3>';
      g.items.forEach(function(x){
        h+='<label class="eat'+(done[x.id]?' is-done':'')+'"><input type="checkbox" data-id="'+x.id+'"'+(done[x.id]?' checked':'')+'><span class="eat__e">'+x.e+'</span><span><b>'+esc(x.n)+'</b><span class="eat__jp">'+esc(x.jp)+'</span></span><p class="eat__d">'+esc(x.d)+'</p></label>';
      });
      h+='</div>';
    });
    q('eatlist').innerHTML=h; meta();
  }
  q('eat-filter').innerHTML=CITYCHIPS.map(function(o){return '<button class="chip" data-city="'+o.id+'" aria-pressed="'+(o.id===st)+'">'+(o.color?'<span class="chip__dot" style="background:'+o.color+'"></span>':'')+esc(o.name)+'</button>';}).join('');
  q('eat-filter').addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;st=b.dataset.city;q('eat-filter').querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',String(c===b));});paint();});
  q('eatlist').addEventListener('change',function(e){var cb=e.target.closest('input[data-id]');if(!cb)return;done[cb.dataset.id]=cb.checked;if(!cb.checked)delete done[cb.dataset.id];try{localStorage.setItem(KEY,JSON.stringify(done));}catch(err){}cb.closest('.eat').classList.toggle('is-done',cb.checked);meta();});
  paint();
})();
initReveal();
initCoverParallax();
initProgressBar();
</script>

<script>
/* Enregistrement du service worker : c'est lui qui rend le site utilisable
   sans réseau. La page Pratique pilote en plus le téléchargement des photos. */
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
<script>
(function(){
  var CFG=[["jours","Les jours",["Les jours"]],["types","Journées type",["Les journées type"]],["manger","À manger",["À manger absolument"]]];
  var secs=[].slice.call(document.querySelectorAll("main > section.section"));
  var h=function(s){var x=s.querySelector("h2");return x?x.textContent.trim():"";};
  var groups=CFG.map(function(c){return {id:c[0],label:c[1],els:secs.filter(function(s){return c[2].indexOf(h(s))>-1;})};}).filter(function(g){return g.els.length;});
  if(groups.length<2)return;
  var bar=document.createElement("div");bar.className="chipbar ptabs";
  groups[0].els[0].parentNode.insertBefore(bar,groups[0].els[0]);
  groups.forEach(function(g){g.els.forEach(function(s){s.parentNode.insertBefore(s,null);});});
  bar.parentNode.insertBefore(bar,groups[0].els[0]);
  bar.innerHTML=groups.map(function(g){return "<button class=\"chip\" data-tab=\""+g.id+"\">"+g.label+"</button>";}).join("");
  function show(id,push){groups.forEach(function(g){var on=g.id===id;g.els.forEach(function(s){s.hidden=!on;});});
    [].forEach.call(bar.children,function(b){b.setAttribute("aria-pressed",String(b.dataset.tab===id));});
    if(push){var u=new URL(location.href);u.searchParams.set("onglet",id);history.replaceState(null,"",u.pathname+u.search+u.hash);}
    setTimeout(function(){window.dispatchEvent(new Event("resize"));},30);}
  bar.addEventListener("click",function(e){var b=e.target.closest("button[data-tab]");if(!b)return;show(b.dataset.tab,true);window.scrollTo({top:bar.getBoundingClientRect().top+scrollY-90,behavior:"smooth"});});
  var want=new URLSearchParams(location.search).get("onglet");
  if(!want&&/^#tpl-/.test(location.hash))want="types";
  show(groups.some(function(g){return g.id===want;})?want:groups[0].id,false);
})();
</script>
</body>
</html>
