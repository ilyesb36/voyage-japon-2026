<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le guide — Japon 2026</title>
<meta name="description" content="Les idées repérées pour le voyage : monuments, tables, quartiers, boutiques — filtrables par ville, par envie et par priorité.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1512" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
<script>
/* Avant le rendu : éviter l'éclair clair quand le sombre est choisi. */
try { if (localStorage.getItem('jp2026_theme') === 'dark')
  document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
</script>
</head>
<body>

<main class="wrap">
  <header class="section">
    <h1 class="disc">Le guide</h1>
    <p class="hero__lede" id="lede"></p>
  </header>

  <div class="chipbar ptabs" id="vue"></div>
  <div id="sel"></div>
  <div id="biblio">

  <!-- La recherche, puis une matrice villes × envies. Les pastilles de ville et
       le menu des envies obligeaient à croiser deux commandes à l'aveugle, sans
       jamais montrer ce qu'il y avait derrière. La matrice affiche les
       compteurs : on voit d'un coup où sont les 319 adresses, et on atteint
       n'importe quel croisement en un clic. -->
  <div class="chipbar ptabs" id="fam"></div>

  <div class="tools">
    <label class="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <input type="search" id="search" placeholder="Chercher une adresse, un quartier…"
             autocomplete="off" spellcheck="false">
    </label>
    <div class="tools__selects">
      <select id="f-priority" aria-label="Filtrer par priorité"></select>
      <select id="f-source" aria-label="Filtrer par provenance"></select>
      <select id="f-kind" aria-label="Filtrer par type de lieu"></select>
    </div>
    <span class="chipbar" id="mode"></span>
    <output id="count" class="tools__count" aria-live="polite"></output>
    <button class="chip" id="reset" hidden>Réinitialiser</button>
  </div>

  <div class="mat" id="mat"></div>

  <div class="spotgrid" id="grid"></div>
  <div class="more" id="more"></div>
  <p class="empty" id="empty" hidden>Rien ne correspond. Essaie un autre mot ou élargis les filtres.</p>
</div>
</main>

<script type="module">
import { SPOTS, CATEGORIES, PRIORITIES } from './data/spots.js';
import { SELECTION } from './data/selection.js';
import { DELICES } from './data/delices.js';
import { CITIES } from './data/trip.js';
import { mountChrome, initReveal, initCoverParallax, initProgressBar, esc, bindLightbox } from './app/ui.js';

mountChrome('guide.html');

const q = (id) => document.getElementById(id);

// La provenance est une donnée, pas un détail : les conseils de l'amie guide
// n'ont pas la même valeur qu'une suggestion, et il faut pouvoir les isoler.
const SOURCES = [
  { id: 'guide', name: "L'amie guide de Mathilde" },
  { id: 'secrets', name: 'Les Secrets de Tokyo' },
  { id: 'ilyes', name: 'Notre sélection' },
  { id: 'claude', name: 'Ajouts' },
];

// Le type de lieu — l'axe « concret » (temple, parc, resto…), complémentaire des envies.
// Les grandes familles, en onglets : on ne montre qu'un univers à la fois.
const FAMS = [
  { id: 'all', name: 'Tout', kinds: null },
  { id: 'voir', name: 'À voir', kinds: ['temple', 'jardin', 'musee', 'vue', 'quartier', 'nature'] },
  { id: 'manger', name: 'Manger & boire', kinds: ['resto', 'cafe', 'street', 'bar'] },
  { id: 'shopping', name: 'Shopping', kinds: ['shopping'] },
  { id: 'faire', name: 'Expériences', kinds: ['atelier', 'onsen'] },
  { id: 'events', name: 'Événements', kinds: ['event'] },
];

const KINDS = [
  { id: 'temple', name: 'Temples & sanctuaires' },
  { id: 'jardin', name: 'Parcs & jardins' },
  { id: 'musee', name: 'Musées & galeries' },
  { id: 'vue', name: 'Points de vue' },
  { id: 'quartier', name: 'Quartiers & balades' },
  { id: 'nature', name: 'Nature & excursions' },
  { id: 'cafe', name: 'Cafés & salons de thé' },
  { id: 'resto', name: 'Restaurants' },
  { id: 'street', name: 'Marchés & street food' },
  { id: 'bar', name: 'Bars & nuit' },
  { id: 'shopping', name: 'Boutiques & shopping' },
  { id: 'atelier', name: 'Expériences & ateliers' },
  { id: 'onsen', name: 'Onsen & sento' },
  { id: 'event', name: 'Événements datés' },
];

// Les facettes se croisent : on peut demander « Kyoto × Food × Obligatoire ».
// C'est ce que le champ cityId a débloqué — avant, la ville n'était qu'un
// intertitre dans le HTML, pas une donnée.
const FACETS = {
  city:     [{ id: 'all', name: 'Toutes' },
             ...Object.entries(CITIES).map(([id, c]) => ({ id, name: c.name, color: c.color })),
             { id: 'partout', name: 'Partout au Japon' }],
  category: [{ id: 'all', name: 'Tout' }, ...CATEGORIES],
  priority: [{ id: 'all', name: 'Toutes' }, ...PRIORITIES],
  source:   [{ id: 'all', name: 'Peu importe' }, ...SOURCES],
  kind:     [{ id: 'all', name: 'Tous les types' }, ...KINDS],
};

// On peut arriver ici déjà filtré : ?ville=kyoto&envie=t6 depuis la page du
// jour ou un lien partagé. Sans ça, « les adresses de Kyoto » obligeait à
// refaire le filtrage à la main en arrivant.
const entree = new URLSearchParams(location.search);
const valide = (v, liste) => (v && liste.some((x) => x.id === v) ? v : 'all');

const state = {
  city: valide(entree.get('ville'), FACETS.city),
  category: valide(entree.get('envie'), FACETS.category),
  priority: valide(entree.get('priorite'), FACETS.priority),
  source: 'all',
  // L'essentiel par défaut : Obligatoire + À voir. Le reste est à un clic.
  mode: 'all',
  fam: (FAMS.some((f) => f.id === entree.get('famille')) ? entree.get('famille') : 'all'),
  kind: valide(entree.get('type'), FACETS.kind),
  q: entree.get('q') || '',
};

const nGuide = SPOTS.filter((s) => s.source === 'guide').length;
q('lede').innerHTML =
  `Une sélection triée étape par étape, et toutes les adresses dans la bibliothèque. ` +
  `${nGuide} viennent de l'amie guide de Mathilde.`;

// --- filtres secondaires ------------------------------------------------------
const LABEL = { category: 'Toutes les envies', priority: 'Toutes priorités', source: 'Toutes provenances', kind: 'Tous les types' };
for (const facet of ['priority', 'source', 'kind']) {
  const sel = q(`f-${facet}`);
  sel.innerHTML = FACETS[facet].map((o) =>
    `<option value="${o.id}">${o.id === 'all' ? LABEL[facet] : esc(o.name)}</option>`).join('');
  sel.value = state[facet];
  sel.addEventListener('change', () => { state[facet] = sel.value; render(); });
}

q('search').addEventListener('input', (e) => {
  state.q = e.target.value.trim().toLowerCase();
  render();
});

// --- rendu -------------------------------------------------------------------
// La recherche porte sur le nom, la description et le quartier : c'est ce
// qu'on tape de tête (« ramen », « Asakusa », « couteaux »).
const haystack = new WeakMap();
const hay = (s) => {
  if (!haystack.has(s)) {
    haystack.set(s, `${s.name} ${s.blurb} ${s.area || ''}`
      .toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''));
  }
  return haystack.get(s);
};
const norm = (t) => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '');

/**
 * Le prédicat de filtrage, paramétrable par un état.
 *
 * Les compteurs de la matrice l'appellent avec un état modifié, si bien que le
 * nombre affiché dans une case EST le nombre de résultats qu'on obtient en
 * cliquant dessus. Dupliquer cette logique, c'était s'assurer qu'un jour la
 * matrice mentirait.
 */
const matchesWith = (st) => (s) =>
  (st.city === 'all'
    || (st.city === 'partout' ? s.cityId === null : s.cityId === st.city))
  && (st.category === 'all' || s.category === st.category)
  && (st.priority === 'all' || s.priority === st.priority)
  && (st.source === 'all' || s.source === st.source)
  && (st.kind === 'all' || s.kind === st.kind)
  && (st.mode !== 'ess' || s.priority === 'ob' || s.priority === 'top')
  && (!st.fam || st.fam === 'all' || (FAMS.find((f) => f.id === st.fam).kinds || []).includes(s.kind))
  && (!st.q || hay(s).includes(norm(st.q)));

const matches = (s) => matchesWith(state)(s);

// --- la matrice ---------------------------------------------------------------
// Les compteurs tiennent compte de la recherche, de la priorité et de la
// provenance — mais PAS de la ville ni de l'envie, qui sont les deux axes de la
// matrice elle-même. Autrement dit : le nombre affiché dans une case est
// exactement le nombre de résultats qu'on obtient en cliquant dessus. Une
// matrice qui ment est pire qu'un menu.
const matLarge = matchMedia('(min-width: 760px)').matches;

// Le même prédicat que la grille, avec la ville et l'envie de la case : le
// compteur ne peut donc pas diverger du résultat.
const compte = (city, category) =>
  SPOTS.filter(matchesWith({ ...state, city, category })).length;

const COLS = [{ id: 'all', name: 'Tout' }, ...CATEGORIES];
const ROWS = FACETS.city;

function renderMat() {
  const actuelle = ROWS.find((r) => r.id === state.city);
  const actuelleCat = COLS.find((c) => c.id === state.category);
  const filtre = state.city !== 'all' || state.category !== 'all';

  q('mat').innerHTML = `
    <details class="mat__pli">
      <summary class="mat__resume">
        <span class="mat__resumeQuoi">
          <b>${esc(filtre ? [actuelle?.name, actuelleCat?.id !== 'all' ? actuelleCat?.name : null].filter(Boolean).join(' · ') : 'Toutes les adresses')}</b>
        </span>
        <span class="mat__resumeAction">Choisir</span>
      </summary>
      <div class="mat__grille" style="--cols:${COLS.length}">
        <span class="mat__coin" aria-hidden="true"></span>
        ${COLS.map((c) => `
          <button class="mat__tete${state.category === c.id ? ' is-actif' : ''}"
                  data-col="${c.id}" title="${esc(c.name)} — toutes villes">${esc(c.name)}</button>`).join('')}
        ${ROWS.map((r) => `
          <button class="mat__tete mat__tete--ligne${state.city === r.id ? ' is-actif' : ''}"
                  data-row="${r.id}" ${r.color ? `style="--c:var(--c-${r.id})"` : ''}
                  title="${esc(r.name)} — toutes envies">${esc(r.name)}</button>
          ${COLS.map((c) => {
            const n = compte(r.id, c.id);
            const actif = state.city === r.id && state.category === c.id;
            return `
            <button class="mat__case${actif ? ' is-actif' : ''}${n === 0 ? ' is-vide' : ''}"
                    data-row="${r.id}" data-col="${c.id}" ${n === 0 ? 'disabled' : ''}
                    ${r.color ? `style="--c:var(--c-${r.id})"` : ''}
                    aria-label="${esc(r.name)}, ${esc(c.name)} : ${n}">${n || '·'}</button>`;
          }).join('')}`).join('')}
      </div>
    </details>`;
}

q('mat').addEventListener('click', (e) => {
  const b = e.target.closest('[data-row], [data-col]');
  if (!b || b.disabled) return;
  // Une en-tête ne touche qu'à son axe ; une case fixe les deux.
  if (b.dataset.row !== undefined && b.dataset.col !== undefined) {
    state.city = b.dataset.row; state.category = b.dataset.col;
  } else if (b.dataset.row !== undefined) {
    state.city = state.city === b.dataset.row ? 'all' : b.dataset.row;
  } else {
    state.category = state.category === b.dataset.col ? 'all' : b.dataset.col;
  }
  render();
});


const catName = Object.fromEntries(CATEGORIES.map((c) => [c.id, c.name]));
const prioName = Object.fromEntries(PRIORITIES.map((p) => [p.id, p.name]));

function card(s) {
  const city = s.cityId ? CITIES[s.cityId] : null;
  return `
  <button class="card card--link spot" type="button" data-id="${esc(s.id)}">
    <div class="thumb thumb--wide${s.img ? '' : ' thumb--nue'}"${city ? ` style="--c:var(--c-${city.id})"` : ''}>
      ${s.img
        ? `<img src="${esc(s.img)}" alt="${esc(s.name)}" loading="lazy" decoding="async">`
        : `<span class="thumb__initiale" aria-hidden="true">${esc(s.name.trim()[0] || '·')}</span>`}
      <span class="prio prio--${s.priority} spot__prio">${prioName[s.priority]}</span>
      ${s.source === 'guide' ? '<span class="spot__badge spot__badge--guide">Conseil de la guide</span>' : s.source === 'secrets' ? '<span class="spot__badge spot__badge--guide">Secret de Tokyo</span>' : ''}
    </div>
    <div class="spot__body">
      <h3>${esc(s.name)}</h3>
      <p>${esc(s.blurb)}</p>
      <p class="spot__meta">
        <span class="city-dot" style="--c:${city ? `var(--c-${city.id})` : 'var(--mut)'}">${city ? esc(city.name) : 'Partout'}</span>
        <span class="spot__facts">
          <span>${esc(s.duration)}</span>
          <span>${esc(s.budget)}</span>
        </span>
      </p>
    </div>
  </button>`;
}

// --- la fiche -----------------------------------------------------------------
// Les mêmes lignes pour toutes : durée, budget, moment. C'est ce qui permet
// de comparer deux adresses d'un coup d'œil.
const byId = new Map(SPOTS.map((s) => [s.id, s]));

function openSheet(id) {
  const s = byId.get(id);
  if (!s) return;
  const city = s.cityId ? CITIES[s.cityId] : null;
  let photoQ = s.name; try { photoQ = decodeURIComponent((s.maps || '').split('query=')[1]) || s.name; } catch (e) {}

  const el = document.createElement('div');
  el.className = 'sheet';
  el.innerHTML = `
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-label="${esc(s.name)}">
      <button class="sheet__close" aria-label="Fermer">✕</button>
      ${s.img ? `<img class="sheet__img" src="${esc(s.img)}" alt="">` : ''}
      <div class="sheet__body">
        <p class="sheet__where">
          <span class="city-dot" style="--c:${city ? `var(--c-${city.id})` : 'var(--mut)'}">${city ? esc(city.name) : 'Partout au Japon'}</span>
          <span class="mut">· ${catName[s.category]}</span>
          <span class="prio prio--${s.priority}">${prioName[s.priority]}</span>
        </p>
        <h2>${esc(s.name)}</h2>
        <p class="sheet__blurb">${esc(s.blurb)}</p>
        ${s.lore ? `<p class="sheet__lore">${esc(s.lore)}</p>` : ''}
        <dl class="sheet__facts">
          <div><dt>Durée</dt><dd>${esc(s.duration)}</dd></div>
          <div><dt>Budget</dt><dd>${esc(s.budget)}</dd></div>
          <div><dt>Le bon moment</dt><dd>${esc(s.when)}</dd></div>
        </dl>
        ${s.note ? `<p class="sheet__note">${esc(s.note)}</p>` : ''}
        ${s.acces ? `<p class="sheet__acces"><b>Y aller</b> ${esc(s.acces)}</p>` : ''}
        ${s.source === 'guide' ? '<p class="sheet__guide">Conseillé par l\'amie guide de Mathilde.</p>' : s.source === 'secrets' ? '<p class="sheet__guide">Tiré des « Secrets de Tokyo » du guide japonais.</p>' : ''}
        <a class="btn" href="${esc(s.maps)}" target="_blank" rel="noopener">Ouvrir dans Google Maps</a>
        ${s.img ? '' : `<a class="btn" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(photoQ)}" target="_blank" rel="noopener">Voir en photos</a>`}
      </div>
    </div>`;

  // Même traitement que la visionneuse : le fond devient inerte le temps de la
  // fiche, sinon Tab s'échappe dans les 277 cartes qu'on ne voit plus, et le
  // focus revient sur la carte cliquée à la fermeture.
  const veniat = document.activeElement;
  const fond = [...document.body.children];
  const close = () => {
    el.remove();
    document.removeEventListener('keydown', onKey);
    fond.forEach((n) => n.removeAttribute('inert'));
    veniat?.focus?.();
  };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  el.addEventListener('click', (e) => { if (e.target === el) close(); });
  el.querySelector('.sheet__close').addEventListener('click', close);
  document.addEventListener('keydown', onKey);
  fond.forEach((n) => n.setAttribute('inert', ''));
  document.body.appendChild(el);
  el.querySelector('.sheet__close').focus();
}

q('grid').addEventListener('click', (e) => {
  const card = e.target.closest('.spot');
  if (card) openSheet(card.dataset.id);
});

function render() {
  renderFam();
  renderMode();
  // La matrice se redessine avec la grille : ses compteurs dépendent de la
  // recherche et des filtres secondaires, ils ne peuvent pas rester figés.
  renderMat();

  const list = SPOTS.filter(matches);
  // 24 cartes, puis « voir plus » : 414 cartes d'un bloc, c'était 47 écrans.
  const sig = JSON.stringify([state.city, state.category, state.priority, state.source, state.kind, state.fam, state.mode, state.q]);
  if (sig !== window.__sig) { window.__sig = sig; window.__lim = 24; }
  // Groupée par ville, dans l'ordre du voyage, quand aucune ville n'est choisie.
  const ORDRE = ['tokyo', 'kanazawa', 'kyoto', 'osaka', 'hakone'];
  const rang = (s) => { const i = ORDRE.indexOf(s.cityId); return i < 0 ? 9 : i; };
  const trie = state.city === 'all' ? [...list].sort((a, b) => rang(a) - rang(b)) : list;
  const parVille = {}; trie.forEach((s) => { parVille[s.cityId] = (parVille[s.cityId] || 0) + 1; });
  // Sans ville ni recherche : un aperçu de 8 adresses par ville, et un lien vers la ville entière.
  // Sinon Tokyo (200+ adresses) occupait à lui seul toutes les pages avant Kanazawa.
  const apercu = state.city === 'all' && !state.q;
  const vus = {};
  const montres = apercu ? trie.filter((s) => { vus[s.cityId] = (vus[s.cityId] || 0) + 1; return vus[s.cityId] <= 8; }) : trie.slice(0, window.__lim);
  let avant;
  q('grid').innerHTML = montres.map((s, i) => {
    const fin = apercu && (i === montres.length - 1 || montres[i + 1].cityId !== s.cityId) && parVille[s.cityId] > 8
      ? `<p class="bib__all"><button class="btn btn--ghost" type="button" data-ville="${s.cityId || 'partout'}">Toutes les adresses ${s.cityId ? (/^[AEIOUHaeiouh]/.test(CITIES[s.cityId].name) ? "d'" : 'de ') + esc(CITIES[s.cityId].name) : 'hors étapes'} (${parVille[s.cityId]}) →</button></p>` : '';
    const tete = state.city === 'all' && s.cityId !== avant
      ? `<h3 class="bib__city"><span class="city-dot" style="--c:${s.cityId ? `var(--c-${s.cityId})` : 'var(--mut)'}">${esc(s.cityId ? CITIES[s.cityId].name : 'Partout au Japon')}</span><span class="mut">${parVille[s.cityId]} adresses</span></h3>` : '';
    avant = s.cityId;
    return tete + card(s) + fin;
  }).join('');
  const reste = apercu ? 0 : list.length - window.__lim;
  q('more').innerHTML = reste > 0 ? `<button class="btn" type="button" id="more-btn">Voir ${Math.min(reste, 48)} de plus <span class="mut">· ${reste} restantes</span></button>` : '';
  q('empty').hidden = list.length > 0;

  const filtered = state.q !== '' || ['city', 'category', 'priority', 'source', 'kind', 'fam'].some((k) => state[k] !== 'all');
  q('count').textContent = `${list.length} adresse${list.length > 1 ? 's' : ''}`;
  q('reset').hidden = !filtered;
}


// --- onglets de famille -------------------------------------------------------
function renderMode() {
  const n = (m) => SPOTS.filter(matchesWith({ ...state, mode: m })).length;
  q('mode').innerHTML = [['ess', 'L\'essentiel'], ['all', 'Tout voir']].map(([id, lab]) =>
    `<button class="chip" data-mode="${id}" aria-pressed="${state.mode === id}">${lab}<span class="ptabs__n">${n(id)}</span></button>`).join('');
}
q('mode').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-mode]');
  if (!b) return;
  state.mode = b.dataset.mode;
  render();
});

function renderFam() {
  const base = { ...state, fam: 'all', kind: 'all' };
  q('fam').innerHTML = FAMS.map((f) => {
    const n = SPOTS.filter(matchesWith({ ...base, fam: f.id })).length;
    return `<button class="chip" data-fam="${f.id}" aria-pressed="${state.fam === f.id}">${esc(f.name)}<span class="ptabs__n">${n}</span></button>`;
  }).join('');
}
q('fam').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-fam]');
  if (!b) return;
  state.fam = b.dataset.fam;
  state.kind = 'all'; q('f-kind').value = 'all';
  render();
});

// --- la sélection, étape par étape -------------------------------------------
function renderSelection() {
  const nav = SELECTION.map((st) => `<a class="chip" href="#etape-${st.step}"><span class="chip__dot" style="background:var(--c-${st.cityId})"></span>${esc(st.title)}</a>`).join('');
  q('sel').innerHTML = `<nav class="chipbar sel__nav">${nav}</nav>` + SELECTION.map((st) => {
    const plats = (DELICES.find((d) => d.cityId === st.cityId) || { items: [] }).items;
    const aGouter = st.step === 6 ? plats.filter((x) => ['monja', 'nikuman', 'shirasu', 'dorayaki'].includes(x.id))
                  : st.step === 1 ? plats.filter((x) => ['sushi-tsukiji', 'tsukemen', 'melonpan', 'yuba'].includes(x.id))
                  : plats.slice(0, 4);
    return `
    <section class="section sel__step" id="etape-${st.step}" style="--c:var(--c-${st.cityId})">
      <div class="shead"><h2><span class="sel__n">${String(st.step).padStart(2, '0')}</span> ${esc(st.title)}</h2><span class="shead__meta">${esc(st.dates)}</span></div>
      <p class="sel__intro">${esc(st.intro)}</p>
      <ol class="sel__list">${st.picks.map((p) => {
        const s = byId.get(p.id); if (!s) return '';
        return `<li><button class="sel__item" type="button" data-id="${esc(s.id)}">
          ${s.img ? `<img class="sel__img" src="${esc(s.img)}" alt="" loading="lazy" decoding="async">` : `<span class="sel__img sel__img--nue">${esc(s.name.trim()[0])}</span>`}
          <span><b>${esc(s.name)}</b><span class="sel__why">${esc(p.why)}</span>
          <span class="sel__meta">${[s.duration, s.budget].filter(Boolean).map(esc).join(' · ')}</span></span>
        </button></li>`;
      }).join('')}</ol>
      ${st.arbitrage ? `<p class="sel__arb"><b>Arbitrage</b> ${esc(st.arbitrage)}</p>` : ''}
      ${aGouter.length ? `<div class="sel__eat"><span class="label">À goûter</span>${aGouter.map((x) => `<a class="chip" href="itineraire.html?onglet=manger&ville=${st.cityId}">${x.e} ${esc(x.n)}</a>`).join('')}</div>` : ''}
    </section>`;
  }).join('');
}
q('sel').addEventListener('click', (e) => { const b = e.target.closest('.sel__item'); if (b) openSheet(b.dataset.id); });

// La sélection d'abord. Un lien filtré (?ville=, ?q=…) ouvre directement la bibliothèque.
const VUES = [['sel', 'La sélection', SELECTION.reduce((a, s) => a + s.picks.length, 0)], ['biblio', 'La bibliothèque', SPOTS.length]];
let vue = ['ville', 'envie', 'priorite', 'q', 'type', 'famille', 'tout'].some((k) => entree.has(k)) || entree.get('vue') === 'biblio' ? 'biblio' : 'sel';
function paintVue() {
  q('vue').innerHTML = VUES.map(([id, lab, n]) => `<button class="chip" data-vue="${id}" aria-pressed="${vue === id}">${lab}<span class="ptabs__n">${n}</span></button>`).join('');
  q('sel').hidden = vue !== 'sel';
  q('biblio').hidden = vue !== 'biblio';
}
q('vue').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-vue]'); if (!b) return;
  vue = b.dataset.vue; paintVue();
  const u = new URL(location.href); if (vue === 'biblio') u.searchParams.set('vue', 'biblio'); else u.searchParams.delete('vue');
  history.replaceState(null, '', u.pathname + u.search);
});
renderSelection();
paintVue();
// Arrivée depuis l'accueil sur une étape : la section est rendue en JS, il faut y descendre soi-même.
if (/^#etape-\d$/.test(location.hash)) requestAnimationFrame(() => document.querySelector(location.hash)?.scrollIntoView({ block: 'start' }));

q('grid').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-ville]');
  if (!b) return;
  e.stopPropagation();
  state.city = b.dataset.ville;
  render();
  q('biblio').scrollIntoView({ block: 'start' });
});

q('more').addEventListener('click', (e) => {
  if (!e.target.closest('#more-btn')) return;
  window.__lim += 48;
  const sig = window.__sig; render(); window.__sig = sig;
});

q('reset').addEventListener('click', () => {
  Object.assign(state, { city: 'all', category: 'all', priority: 'all', source: 'all', kind: 'all', fam: 'all', q: '' });
  q('f-kind').value = 'all';
  q('search').value = '';
  q('f-priority').value = 'all';
  q('f-source').value = 'all';
  render();
});

// L'état peut venir de l'URL : les commandes doivent le refléter au premier
// rendu, sinon la page dit « Kyoto » et le menu dit « toutes ».
q('search').value = state.q;
q('f-priority').value = state.priority;
q('f-source').value = state.source;

render();

initReveal();
initCoverParallax();
initProgressBar();
</script>

<script>
/* Enregistrement du service worker : c'est lui qui rend le site utilisable
   sans réseau. La page Pratique pilote en plus le téléchargement des photos. */
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
