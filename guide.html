<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chercher — Japon 2026</title>
<meta name="description" content="Une seule recherche pour tout le site : adresses, plats, quartiers, journées, logements, conseils et pages. Le catalogue des adresses, ville par ville, reste dessous.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1512" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Japon 2026">
<link rel="stylesheet" href="app.css">
<script>
/* Avant le rendu : éviter l'éclair clair quand le sombre est choisi. */
try { if (localStorage.getItem('jp2026_theme') === 'dark')
  document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
</script>
</head>
<body>

<main class="wrap">
  <header class="section chercher__tete">
    <h1 class="disc">Chercher</h1>
    <p class="hero__lede">Adresses, plats, quartiers, journées, logements, conseils et pages : un seul champ pour tout le site.</p>
  </header>

  <!-- Une seule recherche pour tout le site. Tant que le champ est vide, le
       catalogue des adresses reste dessous, ville par ville ; ses filtres (la
       matrice villes × envies, les quartiers, la priorité, la provenance) sont
       repliés dans « Filtres ». Dès qu'on tape, les résultats le remplacent. -->
  <div class="tools">
    <label class="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <input type="search" id="search" placeholder="Une adresse, un plat, un logement…"
             aria-label="Chercher dans tout le site" enterkeyhint="search"
             autocomplete="off" spellcheck="false">
    </label>
  </div>
  <div class="chercher__etat">
    <output id="count" aria-live="polite"></output>
    <button class="chip" id="reset" hidden>Réinitialiser</button>
  </div>

  <div class="resultats" id="resultats" hidden></div>

  <div id="biblio">
    <div class="shead">
      <h2>Les adresses, ville par ville</h2>
      <p id="intro"></p>
    </div>

    <!-- Les filtres du catalogue. La matrice affiche les compteurs : on voit d'un
         coup où sont les adresses, et on atteint n'importe quel croisement en un
         clic. Les pastilles de ville et le menu des envies obligeaient, avant, à
         croiser deux commandes à l'aveugle. -->
    <details class="filtres" id="filtres">
      <summary class="filtres__resume">
        <b>Filtres</b>
        <span class="filtres__etat" id="filtres-etat"></span>
      </summary>
      <div class="filtres__corps">
        <div class="mat" id="mat"></div>
        <div class="chipbar" id="fam"></div>
        <div class="chipbar" id="quartiers"></div>
        <div class="tools__selects">
          <select id="f-priority" aria-label="Filtrer par priorité"></select>
          <select id="f-source" aria-label="Filtrer par provenance"></select>
          <select id="f-kind" aria-label="Filtrer par type de lieu"></select>
        </div>
        <span class="chipbar" id="essentiel"></span>
      </div>
    </details>

    <div class="spotgrid" id="grid"></div>
    <div class="more" id="more"></div>
    <p class="empty" id="empty" hidden>Aucune adresse ne correspond à ces filtres. Élargissez-les, ou réinitialisez-les.</p>
  </div>
</main>

<script type="module">
import { SPOTS, CATEGORIES, PRIORITIES } from './data/spots.js';
import { DELICES } from './data/delices.js';
import { CITIES, STEPS, HOTELS } from './data/trip.js';
import { DAYS } from './data/days.js';
import { QUARTIERS } from './data/quartiers.js';
import { SURPLACE } from './data/pratique.js';
import { mountChrome, initReveal, initCoverParallax, initProgressBar, esc, bindLightbox, today, moment } from './app/ui.js';
import { quartiersDe, ouEst, metres, maPosition, familleDe, quartierNomDeSpot, distanceTexte, KONBINI_LIGNE, ficheExtra } from './app/quartiers.js';

mountChrome('guide.html');

const q = (id) => document.getElementById(id);

// La provenance est une donnée, pas un détail : les conseils de l'amie guide
// n'ont pas la même valeur qu'une suggestion, et il faut pouvoir les isoler.
const SOURCES = [
  { id: 'guide', name: "L'amie guide de Mathilde" },
  { id: 'secrets', name: 'Les Secrets de Tokyo' },
  { id: 'ilyes', name: 'Notre sélection' },
  { id: 'claude', name: 'Ajouts' },
];

// Le chemin unique, le même partout : Ville → Quartier → À voir / À faire /
// À manger. La famille (voir/faire/manger) vient de familleDe() — la vraie
// valeur du quartier si l'adresse est placée, sinon déduite du kind. C'est le
// filtre principal ; le « type de lieu » (temple, resto…) n'est qu'un affinage.
const FAMS = [
  { id: 'all', name: 'Tout' },
  { id: 'voir', name: 'À voir' },
  { id: 'faire', name: 'À faire' },
  { id: 'manger', name: 'À manger' },
];

const KINDS = [
  { id: 'temple', name: 'Temples & sanctuaires' },
  { id: 'jardin', name: 'Parcs & jardins' },
  { id: 'musee', name: 'Musées & galeries' },
  { id: 'vue', name: 'Points de vue' },
  { id: 'quartier', name: 'Quartiers & balades' },
  { id: 'nature', name: 'Nature & excursions' },
  { id: 'cafe', name: 'Cafés & salons de thé' },
  { id: 'resto', name: 'Restaurants' },
  { id: 'street', name: 'Marchés & street food' },
  { id: 'bar', name: 'Bars & nuit' },
  { id: 'shopping', name: 'Boutiques & shopping' },
  { id: 'atelier', name: 'Expériences & ateliers' },
  { id: 'onsen', name: 'Onsen & sento' },
  { id: 'event', name: 'Événements datés' },
];

// Les facettes se croisent : on peut demander « Kyoto × Food × Obligatoire ».
// C'est ce que le champ cityId a débloqué — avant, la ville n'était qu'un
// intertitre dans le HTML, pas une donnée.
const FACETS = {
  city:     [{ id: 'all', name: 'Toutes' },
             ...Object.entries(CITIES).map(([id, c]) => ({ id, name: c.name, color: c.color })),
             { id: 'partout', name: 'Partout au Japon' }],
  category: [{ id: 'all', name: 'Tout' }, ...CATEGORIES],
  priority: [{ id: 'all', name: 'Toutes' }, ...PRIORITIES],
  source:   [{ id: 'all', name: 'Peu importe' }, ...SOURCES],
  kind:     [{ id: 'all', name: 'Tous les types' }, ...KINDS],
};

// On peut arriver ici déjà filtré : ?ville=kyoto&envie=t6 depuis la page du
// jour ou un lien partagé. Sans ça, « les adresses de Kyoto » obligeait à
// refaire le filtrage à la main en arrivant. Deux entrées de plus : ?chercher
// (la loupe de la barre : le curseur dans le champ) et ?q=mot (champ prérempli).
const entree = new URLSearchParams(location.search);
const valide = (v, liste) => (v && liste.some((x) => x.id === v) ? v : 'all');

// Pendant le voyage, sans ?ville= : le catalogue s'ouvre sur la ville de l'étape
// courante (ce qui expose aussi les quartiers et « Près de moi »). La matrice
// « Toutes » reste le geste pour revenir à toutes les villes. Cette ville ne
// limite JAMAIS une recherche : elle y passe seulement en premier.
const jourCourant = DAYS.find((d) => d.date === today());
const villeEtape = (moment() === 'pendant' && jourCourant)
  ? (STEPS.find((s) => s.id === jourCourant.stepId)?.cityId || null) : null;

const state = {
  city: valide(entree.get('ville') || villeEtape, FACETS.city),
  // Les catégories t0–t6 ne sont plus un filtre principal : on garde le champ
  // (le prédicat le tolère) mais plus d'entrée d'UI — la famille l'a remplacé.
  category: 'all',
  priority: valide(entree.get('priorite'), FACETS.priority),
  source: 'all',
  // L'essentiel par défaut : Obligatoire + À voir. Le reste est à un clic.
  mode: 'all',
  fam: (FAMS.some((f) => f.id === entree.get('famille')) ? entree.get('famille') : 'all'),
  kind: valide(entree.get('type'), FACETS.kind),
  // Le quartier (dans la ville choisie) et le tri « Près de moi ». `pos` porte
  // la position du téléphone quand le tri par distance est actif, rien sinon.
  quartier: entree.get('quartier') || 'all',
  pos: null,
  // `elargi` : la recherche a été étendue aux synonymes (via « Voir aussi »).
  elargi: false,
  // La recherche : vide, on montre le catalogue ; sinon, les résultats.
  q: (entree.get('q') || '').trim(),
};

const nGuide = SPOTS.filter((s) => s.source === 'guide').length;
q('intro').innerHTML =
  `Toutes les adresses repérées, rangées par ville. ` +
  `${nGuide} viennent de l'amie guide de Mathilde.`;

// --- filtres secondaires ------------------------------------------------------
const LABEL = { category: 'Toutes les envies', priority: 'Toutes priorités', source: 'Toutes provenances', kind: 'Tous les types' };
for (const facet of ['priority', 'source', 'kind']) {
  const sel = q(`f-${facet}`);
  sel.innerHTML = FACETS[facet].map((o) =>
    `<option value="${o.id}">${o.id === 'all' ? LABEL[facet] : esc(o.name)}</option>`).join('');
  sel.value = state[facet];
  sel.addEventListener('change', () => { state[facet] = sel.value; render(); });
}

const deployes = new Set();   // les groupes de résultats dont on a demandé « Voir les N »
q('search').addEventListener('input', (e) => {
  state.q = e.target.value.trim();
  state.elargi = false;   // nouvelle recherche : on repart des correspondances directes
  deployes.clear();       // et des groupes repliés
  render();
});
// La touche « Rechercher » du clavier iPhone referme le clavier : les résultats
// se lisent en direct, il n'y a rien d'autre à valider.
q('search').addEventListener('keydown', (e) => { if (e.key === 'Enter') e.target.blur(); });

// --- rendu -------------------------------------------------------------------
// La recherche porte sur le nom, la description et le quartier : c'est ce
// qu'on tape de tête (« ramen », « Asakusa », « couteaux »).
// Insensible aux accents et aux macrons, à la casse, aux traits d'union et
// points médians, aux espaces multiples et à l'apostrophe (l'iPhone tape ’, les
// textes mélangent ' et ’) : « todaiji » trouve « Tōdai-ji », « d'or » trouve « d’or ».
const norm = (t) => (t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/[’‘ʼ]/g, "'")
  .replace(/[-\u2010\u2013\u2014\u30fb\u00b7]/g, '').replace(/\s+/g, ' ').trim();
// norm() retire les tirets mais garde les espaces : « kiyomizu dera » ne trouvait
// pas « Kiyomizu-dera ». Quand la requête contient un espace, on compare donc
// aussi sans aucun espace.
const sansEsp = (t) => t.replace(/ /g, '');
const contient = (t, nq) => t.includes(nq) || (nq.includes(' ') && sansEsp(t).includes(sansEsp(nq)));
const debute = (t, nq) => t.startsWith(nq) || (nq.includes(' ') && sansEsp(t).startsWith(sansEsp(nq)));
// Plusieurs mots (« hakone freepass », « pass hakone ») : on trouve ce qui les contient
// tous, dans n'importe quel ordre. La phrase entière, elle, pèse plus lourd au classement.
const motsDe = (nq) => nq.split(' ').map((m) => m.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '')).filter(Boolean);   // « kyoto, ramen » : sans la virgule
const tousLesMots = (t, nq) => motsDe(nq).every((m) => t.includes(m));
const correspond = (t, nq) => contient(t, nq) || tousLesMots(t, nq);
// La part des mots de la requête que `t` contient : 1 si la phrase y est (ou si c'est un
// mot seul, trouvé), sinon la fraction des mots. Un nom qui dit « ramen » vaut donc un
// demi-point pour « kyoto ramen », et un point entier pour « ramen ».
const part = (t, nq) => (contient(t, nq) ? 1 : motsDe(nq).filter((m) => t.includes(m)).length / motsDe(nq).length);

// Synonymes courants → types de lieu, pour que « temple », « café » ou
// « pluie » (ce qu'on fait à couvert) ramènent les bonnes adresses.
const SYNO = {
  ramen: ['resto'], sushi: ['resto'], izakaya: ['resto', 'bar'], restaurant: ['resto'],
  cafe: ['cafe'], the: ['cafe'], onsen: ['onsen'], sento: ['onsen'], bain: ['onsen'],
  temple: ['temple'], sanctuaire: ['temple'], jardin: ['jardin'], parc: ['jardin'],
  marche: ['street'], streetfood: ['street'], bar: ['bar'], musee: ['musee'],
  atelier: ['atelier'], boutique: ['shopping'], shopping: ['shopping'],
  cadeau: ['shopping'], souvenir: ['shopping'], omiyage: ['shopping'],
  vue: ['vue'], panorama: ['vue'],
  pluie: ['musee', 'cafe', 'atelier', 'shopping', 'event', 'onsen'],
  couvert: ['musee', 'cafe', 'atelier', 'shopping', 'event', 'onsen'],
};
let _synQ = null; let _synSet = new Set();
const synKinds = (nq) => {
  if (nq === _synQ) return _synSet;
  _synQ = nq; _synSet = new Set();
  // Un mot est de synonyme quand il COMMENCE par la clé (comme dans chercher) : « akihabara »
  // contient « bar », « katsushika » contient « sushi », et ne sont pas des bars ni des sushis.
  for (const m of motsDe(nq)) for (const k in SYNO) if (m.startsWith(k)) SYNO[k].forEach((x) => _synSet.add(x));
  return _synSet;
};
// Score de pertinence d'une adresse : le nom d'abord (la phrase entière, puis les
// mots, au prorata de ceux qu'il contient), puis le japonais, le quartier, la
// description, le reste, enfin le synonyme. Sert à ranger les adresses trouvées.
const score = (s, nq) => {
  const n = norm(s.name); let sc = 0;
  if (debute(n, nq)) sc += 100; else if (contient(n, nq)) sc += 60; else sc += 40 * part(n, nq);
  sc += 30 * part(norm(s.jp), nq);
  sc += 15 * part(norm(quartierNomDeSpot(s) || ''), nq);
  sc += 12 * part(norm(s.blurb), nq);
  sc += 4 * part(norm(s.lore || ''), nq);   // le lore est long : il pèse moins
  if (synKinds(nq).has(s.kind)) sc += 5;
  return sc;
};

// --- l'index : tout le site dans une seule liste -------------------------------
// Une seule recherche pour les adresses, les plats, les quartiers, les journées,
// les logements, les conseils et les pages : on tape, on trouve, où que ce soit
// rangé. Une entrée = un résultat possible. `lignes` : ce qui se lit (et d'où l'on
// tire l'extrait) ; `cache` : des mots qu'on cherche sans les montrer (le type de
// lieu, les mots-clés d'une page, le nom de la ville : « kyoto ramen » donne les
// ramen de Kyoto).
// Chaque page répond aux mots qu'on tape en détresse ou de tête, pas seulement à son titre :
// « taxi » mène à Secours (l'adresse du logement à montrer), « taux » au budget, « offline »
// au bouton du hors-ligne de la page À faire (son ancre).
const PAGES_MOTS = [
  { titre: 'Valises', href: 'valises.html', mots: 'valise valises bagage bagages takkyubin yamato consigne casier' },
  { titre: 'Transports', href: 'transports.html', mots: 'transport train shinkansen bus metro métro suica trajet' },
  { titre: 'Les passes', href: 'passes.html', mots: 'pass freepass hakone nikko tobu romancecar bus izu tozan' },
  { titre: 'Secours', href: 'secours.html', mots: 'urgence urgences ambassade police hopital hôpital medecin médecin seisme séisme secours taxi chauffeur adresse hotel hôtel logement appartement rentrer ambulance blesse blessé malade sos assurance pharmacie' },
  { titre: 'Le budget', href: 'budget.html', mots: 'budget argent yen euro depense dépense taux change' },
  { titre: 'À faire', href: 'aujourdhui.html', mots: 'faire reserver réserver echeance échéance preparatifs préparatifs' },
  { titre: 'Hors-ligne', href: 'aujourdhui.html#hors-ligne', mots: 'hors-ligne hors ligne offline sans réseau telecharger télécharger' },
];
// L'étape d'une ville où l'on est (sinon la première) : villes.html s'ouvre dessus.
const stepDe = (cityId) => {
  const now = today();
  return STEPS.find((s) => s.cityId === cityId && now >= s.from && now < s.to) || STEPS.find((s) => s.cityId === cityId);
};
const entreeIndex = (type, titre, lignes, href, cityId, cache = '') =>
  ({ type, titre, lignes: lignes.filter(Boolean), cache: `${cache} ${CITIES[cityId]?.name || ''}`, href, cityId });
const INDEX = [
  ...PAGES_MOTS.map((p) => entreeIndex('Pages', p.titre, [], p.href, null, p.mots)),
  // Une adresse n'a pas de lien : elle ouvre sa fiche, comme les cartes du catalogue.
  ...SPOTS.map((s) => ({ ...entreeIndex('Adresses', s.name, [s.blurb, s.jp, s.lore, quartierNomDeSpot(s)], null, s.cityId, `${s.area || ''} ${s.kind || ''}`), spot: s })),
  ...DELICES.flatMap((c) => c.items.map((it) => entreeIndex('Plats', it.n, [it.d, it.jp], `table.html?ville=${c.cityId}#d-${it.id}`, c.cityId))),
  ...DAYS.map((d) => entreeIndex('Journées', `${d.label} — ${d.title}`, d.items.map((i) => i.text), `jour.html?d=${d.n}`, d.cityId || null)),
  ...QUARTIERS.map((qq) => entreeIndex('Quartiers', qq.nom, [qq.resume, qq.jp], `villes.html?e=${stepDe(qq.cityId).n}#q-${qq.id}`, qq.cityId)),
  ...HOTELS.map((h) => entreeIndex('Logements', h.name, [h.dates, h.address], `secours.html#h-${h.id}`, h.cityId, `${h.bookingName} hôtel logement`)),
  // Un conseil mène à la page de sa place. Les valises font exception : la page
  // Valises le porte déjà, et Transports ne l'affiche pas dans « Au quotidien ».
  ...SURPLACE.map((s) => entreeIndex('Conseils', s.title, [s.what],
    s.id === 'valises' ? 'valises.html'
      : s.place === 'secours' ? 'secours.html#urgences'
      : s.place === 'transports' ? 'transports.html#quotidien' : 'aujourdhui.html#a-lire', null)),
];
const ORDRE_TYPES = ['Pages', 'Adresses', 'Plats', 'Quartiers', 'Journées', 'Logements', 'Conseils'];

// --- la recherche --------------------------------------------------------------
// Le texte cherché d'une entrée, normalisé une fois : titre, lignes, mots cachés.
const corpus = (e) => (e.corpus ??= norm([e.titre, ...e.lignes, e.cache].join(' ')));

// 0 : ne correspond pas. Sinon, plus c'est haut, plus c'est pertinent : le titre
// d'abord, et la phrase entière avant des mots épars (de 10 à 40 selon la part des
// mots que le titre contient).
const scoreDe = (e, nq) => {
  if (!correspond(corpus(e), nq)) return 0;
  if (e.spot) return score(e.spot, nq) || 1;   // le classement fin des adresses
  const t = norm(e.titre);
  return debute(t, nq) ? 100 : contient(t, nq) ? 60 : 10 + 30 * part(t, nq);
};

// Environ 120 caractères de `ligne` autour du mot cherché, coupés entre deux mots.
// La position se lit dans le texte normalisé : à quelques tirets près, c'est la bonne.
const autour = (ligne, nq) => {
  const MAX = 120;
  if (ligne.length <= MAX) return ligne;
  const nl = norm(ligne);
  const i = [nq, ...motsDe(nq)].map((m) => nl.indexOf(m)).find((p) => p >= 0) ?? 0;
  let a = Math.max(0, i - 40);
  if (a > 0) a = ligne.indexOf(' ', a) + 1 || a;
  let b = Math.min(ligne.length, a + MAX);
  if (b < ligne.length && ligne.lastIndexOf(' ', b) > a) b = ligne.lastIndexOf(' ', b);
  return (a > 0 ? '… ' : '') + ligne.slice(a, b) + (b < ligne.length ? ' …' : '');
};

// Pourquoi ce résultat ? La ligne où se trouvent les mots cherchés (à défaut, l'un
// d'eux), sauf si le titre les dit déjà.
const extraitDe = (e, nq) => {
  if (correspond(norm(e.titre), nq)) return '';
  const ligne = e.lignes.find((l) => correspond(norm(l), nq))
    || e.lignes.find((l) => motsDe(nq).some((m) => norm(l).includes(m)));
  return ligne ? autour(ligne, nq) : '';
};

// Les résultats d'une recherche, groupés par type, dans l'ordre d'ORDRE_TYPES.
// Dans chaque groupe : par pertinence ; à pertinence égale, la ville où l'on est
// d'abord (pendant le voyage). Une adresse qui ne correspond que par synonyme
// (« ramen » → les restaurants) n'est montrée qu'à la demande — sauf s'il n'y a
// rien d'autre. Et seulement si elle contient aussi les autres mots de la requête :
// « kyoto ramen » ne ramène que les restaurants de Kyoto, pas ceux du Japon entier.
function chercher(nq) {
  const synos = synKinds(nq);
  // Un mot est de synonyme quand il COMMENCE par la clé : « akihabara » contient « bar », « katsushika » « sushi ».
  const autres = motsDe(nq).filter((m) => !Object.keys(SYNO).some((k) => m.startsWith(k)));
  const notes = INDEX.map((e) => ({ e, sc: scoreDe(e, nq) }));
  const ici = (r) => (villeEtape && r.e.cityId === villeEtape ? 1 : 0);
  const ordre = (a, b) => (b.sc - a.sc) || (ici(b) - ici(a));
  return ORDRE_TYPES.map((type) => {
    let items = notes.filter((r) => r.sc > 0 && r.e.type === type).sort(ordre);
    let voirAussi = 0;
    if (type === 'Adresses') {
      const proches = notes.filter((r) => r.sc === 0 && r.e.spot && synos.has(r.e.spot.kind)
        && autres.every((m) => corpus(r.e).includes(m))).sort(ordre);
      if (!items.length || state.elargi) items = items.concat(proches); else voirAussi = proches.length;
    }
    return { type, items: items.map((r) => r.e), voirAussi };
  }).filter((g) => g.items.length);
}

/**
 * Le prédicat de filtrage du catalogue, paramétrable par un état.
 *
 * Les compteurs de la matrice l'appellent avec un état modifié, si bien que le
 * nombre affiché dans une case EST le nombre de résultats qu'on obtient en
 * cliquant dessus. Dupliquer cette logique, c'était s'assurer qu'un jour la
 * matrice mentirait.
 */
const matchesWith = (st) => (s) =>
  (st.city === 'all'
    || (st.city === 'partout' ? s.cityId === null : s.cityId === st.city))
  && (st.category === 'all' || s.category === st.category)
  && (st.priority === 'all' || s.priority === st.priority)
  && (st.source === 'all' || s.source === st.source)
  && (st.kind === 'all' || s.kind === st.kind)
  && (st.mode !== 'ess' || s.priority === 'ob' || s.priority === 'top')
  && (!st.fam || st.fam === 'all' || familleDe(s) === st.fam)
  && (!st.quartier || st.quartier === 'all' || (ouEst(s)?.quartierId === st.quartier));

const matches = (s) => matchesWith(state)(s);

// --- la matrice ---------------------------------------------------------------
// Les compteurs tiennent compte de la priorité et de la provenance — mais PAS
// de la ville ni de l'envie, qui sont les deux axes de la matrice elle-même.
// Autrement dit : le nombre affiché dans une case est exactement le nombre de
// résultats qu'on obtient en cliquant dessus. Une matrice qui ment est pire
// qu'un menu.
const matLarge = matchMedia('(min-width: 760px)').matches;

// Le même prédicat que la grille, avec la ville et l'envie de la case : le
// compteur ne peut donc pas diverger du résultat.
// On ignore le quartier (propre à une ville) pour que la matrice reste une vue
// d'ensemble ville × famille, et non un filtre qui se vide d'une ville à l'autre.
const compte = (city, fam) =>
  SPOTS.filter(matchesWith({ ...state, city, fam, quartier: 'all' })).length;

const COLS = FAMS;                 // Tout · À voir · À faire · À manger
const ROWS = FACETS.city;

function renderMat() {
  q('mat').innerHTML = `
    <div class="mat__grille" style="--cols:${COLS.length}">
      <span class="mat__coin" aria-hidden="true"></span>
      ${COLS.map((c) => `
        <button class="mat__tete${state.fam === c.id ? ' is-actif' : ''}"
                data-col="${c.id}" title="${esc(c.name)} — toutes villes">${esc(c.name)}</button>`).join('')}
      ${ROWS.map((r) => `
        <button class="mat__tete mat__tete--ligne${state.city === r.id ? ' is-actif' : ''}"
                data-row="${r.id}" ${r.color ? `style="--c:var(--c-${r.id})"` : ''}
                title="${esc(r.name)} — tout">${esc(r.name)}</button>
        ${COLS.map((c) => {
          const n = compte(r.id, c.id);
          const actif = state.city === r.id && state.fam === c.id;
          return `
          <button class="mat__case${actif ? ' is-actif' : ''}${n === 0 ? ' is-vide' : ''}"
                  data-row="${r.id}" data-col="${c.id}" ${n === 0 ? 'disabled' : ''}
                  ${r.color ? `style="--c:var(--c-${r.id})"` : ''}
                  aria-label="${esc(r.name)}, ${esc(c.name)} : ${n}">${n || '·'}</button>`;
        }).join('')}`).join('')}
    </div>`;
}

// Ce que disent les filtres quand « Filtres » est replié : la ville, le quartier,
// l'envie… d'un coup d'œil, sans l'ouvrir.
function renderEtatFiltres() {
  const nom = (facet) => (state[facet] !== 'all' ? FACETS[facet].find((o) => o.id === state[facet])?.name : null);
  q('filtres-etat').textContent = [
    nom('city'),
    state.quartier !== 'all' ? quartiersDe(state.city).find((x) => x.id === state.quartier)?.nom : null,
    state.fam !== 'all' ? FAMS.find((f) => f.id === state.fam)?.name : null,
    nom('priority'), nom('source'), nom('kind'),
    state.mode === 'ess' ? "L'essentiel" : null,
    state.pos ? 'Près de moi' : null,
  ].filter(Boolean).join(' · ');
}

q('mat').addEventListener('click', (e) => {
  const b = e.target.closest('[data-row], [data-col]');
  if (!b || b.disabled) return;
  // Une en-tête ne touche qu'à son axe ; une case fixe les deux.
  if (b.dataset.row !== undefined && b.dataset.col !== undefined) {
    state.city = b.dataset.row; state.fam = b.dataset.col;
  } else if (b.dataset.row !== undefined) {
    state.city = state.city === b.dataset.row ? 'all' : b.dataset.row;
  } else {
    state.fam = state.fam === b.dataset.col ? 'all' : b.dataset.col;
  }
  render();
  q('filtres').open = false;   // le choix est fait : on revoit les adresses
});


const catName = Object.fromEntries(CATEGORIES.map((c) => [c.id, c.name]));
const prioName = Object.fromEntries(PRIORITIES.map((p) => [p.id, p.name]));

function card(s) {
  const city = s.cityId ? CITIES[s.cityId] : null;
  // Chaque résultat dit son quartier, et sa distance quand « Près de moi » est
  // actif (sauf coordonnée de remplissage : 'quartier' → pas de distance).
  const nomQ = quartierNomDeSpot(s);
  const o = state.pos ? ouEst(s) : null;
  const dist = (o && o.confiance !== 'quartier')
    ? (o.confiance === 'approx' ? '~' : '') + distanceTexte(metres(state.pos, o.ll)) : null;
  return `
  <button class="card card--link spot" type="button" data-id="${esc(s.id)}">
    <div class="thumb thumb--wide${s.img ? '' : ' thumb--nue'}"${city ? ` style="--c:var(--c-${city.id})"` : ''}>
      ${s.img
        ? `<img src="${esc(s.img)}" alt="${esc(s.name)}" loading="lazy" decoding="async">`
        : `<span class="thumb__initiale" aria-hidden="true">${esc(s.name.trim()[0] || '·')}</span>`}
      <span class="prio prio--${s.priority} spot__prio">${prioName[s.priority]}</span>
      ${s.source === 'guide' ? '<span class="spot__badge spot__badge--guide">Conseil de la guide</span>' : s.source === 'secrets' ? '<span class="spot__badge spot__badge--guide">Secret de Tokyo</span>' : ''}
    </div>
    <div class="spot__body">
      <h3>${esc(s.name)}</h3>
      <p>${esc(s.blurb)}</p>
      <p class="spot__meta">
        <span class="city-dot" style="--c:${city ? `var(--c-${city.id})` : 'var(--mut)'}">${city ? esc(city.name) : 'Partout'}</span>
        ${nomQ ? `<span class="spot__q">${esc(nomQ)}</span>` : ''}
        <span class="spot__facts">
          ${dist ? `<span class="spot__dist data">${esc(dist)}</span>` : ''}
          <span>${esc(s.duration)}</span>
          <span>${esc(s.budget)}</span>
        </span>
      </p>
    </div>
  </button>`;
}

// --- la fiche -----------------------------------------------------------------
// Les mêmes lignes pour toutes : durée, budget, moment. C'est ce qui permet
// de comparer deux adresses d'un coup d'œil.
const byId = new Map(SPOTS.map((s) => [s.id, s]));

function openSheet(id) {
  const s = byId.get(id);
  if (!s) return;
  const city = s.cityId ? CITIES[s.cityId] : null;
  let photoQ = s.name; try { photoQ = decodeURIComponent((s.maps || '').split('query=')[1]) || s.name; } catch (e) {}

  const el = document.createElement('div');
  el.className = 'sheet';
  el.innerHTML = `
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-label="${esc(s.name)}">
      <button class="sheet__close" aria-label="Fermer">✕</button>
      ${s.img ? `<img class="sheet__img" src="${esc(s.img)}" alt="">` : ''}
      <div class="sheet__body">
        <p class="sheet__where">
          <span class="city-dot" style="--c:${city ? `var(--c-${city.id})` : 'var(--mut)'}">${city ? esc(city.name) : 'Partout au Japon'}</span>
          <span class="mut">· ${catName[s.category]}</span>
          <span class="prio prio--${s.priority}">${prioName[s.priority]}</span>
        </p>
        <h2>${esc(s.name)}</h2>
        <p class="sheet__blurb">${esc(s.blurb)}</p>
        ${s.lore ? `<p class="sheet__lore">${esc(s.lore)}</p>` : ''}
        <dl class="sheet__facts">
          ${[['Durée', s.duration], ['Budget', s.budget], ['Le bon moment', s.when]]
            .filter(([, v]) => v && v !== '—')   // « — » : rien à dire, pas de ligne
            .map(([nom, v]) => `<div><dt>${nom}</dt><dd>${esc(v)}</dd></div>`).join('')}
        </dl>
        ${ficheExtra(s)}
        ${s.note ? `<p class="sheet__note">${esc(s.note)}</p>` : ''}
        ${s.acces ? `<p class="sheet__acces"><b>Y aller</b> ${esc(s.acces)}</p>` : ''}
        ${s.source === 'guide' ? '<p class="sheet__guide">Conseillé par l\'amie guide de Mathilde.</p>' : s.source === 'secrets' ? '<p class="sheet__guide">Tiré des « Secrets de Tokyo » du guide japonais.</p>' : ''}
        ${s.maps ? `<a class="btn" href="${esc(s.maps)}" target="_blank" rel="noopener">Ouvrir dans Google Maps</a>` : ''}
        ${s.img ? '' : `<a class="btn" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(photoQ)}" target="_blank" rel="noopener">Voir en photos</a>`}
      </div>
    </div>`;

  // Même traitement que la visionneuse : le fond devient inerte le temps de la
  // fiche, sinon Tab s'échappe dans les 277 cartes qu'on ne voit plus, et le
  // focus revient sur la carte cliquée à la fermeture.
  const veniat = document.activeElement;
  const fond = [...document.body.children];
  const close = () => {
    el.remove();
    document.removeEventListener('keydown', onKey);
    fond.forEach((n) => n.removeAttribute('inert'));
    veniat?.focus?.();
  };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  el.addEventListener('click', (e) => { if (e.target === el) close(); });
  el.querySelector('.sheet__close').addEventListener('click', close);
  document.addEventListener('keydown', onKey);
  fond.forEach((n) => n.setAttribute('inert', ''));
  document.body.appendChild(el);
  el.querySelector('.sheet__close').focus();
}

q('grid').addEventListener('click', (e) => {
  const card = e.target.closest('.spot');
  if (card) openSheet(card.dataset.id);
});

// --- les résultats ------------------------------------------------------------
// Quand le champ n'est pas vide, une liste par type remplace le catalogue : huit
// lignes au plus par groupe, puis « Voir les N ».
const PAR_GROUPE = 8;

function ligneHTML(e, nq) {
  const ville = e.cityId ? CITIES[e.cityId] : null;
  const extrait = extraitDe(e, nq);
  const ou = ville
    ? ` · <span class="city-dot" style="--c:var(--c-${esc(ville.id)})">${esc(ville.name)}</span>`
    : (e.spot ? ' · Partout' : '');
  const corps = `<span class="resultat__texte"><span class="resultat__titre">${esc(e.titre)}</span>`
    + (extrait ? `<span class="resultat__extrait">${esc(extrait)}</span>` : '')
    + `<span class="label resultat__meta">${esc(e.type)}${ou}</span></span>`;
  // Une adresse ouvre sa fiche, comme les cartes du catalogue ; le reste mène à sa page.
  return e.spot
    ? `<li><button class="resultat" type="button" data-id="${esc(e.spot.id)}">${corps}</button></li>`
    : `<li><a class="resultat" href="${esc(e.href)}">${corps}</a></li>`;
}

function groupeHTML(g, nq) {
  const toutVoir = deployes.has(g.type) || g.items.length <= PAR_GROUPE;
  const vus = toutVoir ? g.items : g.items.slice(0, PAR_GROUPE);
  return `
  <section class="resultats__groupe">
    <h2 class="resultats__titre">${esc(g.type)}<span class="resultats__nb">${g.items.length}</span></h2>
    <ul class="resultats__liste">${vus.map((e) => ligneHTML(e, nq)).join('')}</ul>
    ${toutVoir ? '' : `<button class="btn btn--ghost resultats__plus" type="button" data-tout="${esc(g.type)}">Voir les ${g.items.length}</button>`}
    ${g.voirAussi ? `<button class="btn btn--ghost resultats__plus" type="button" id="voir-aussi">Voir aussi tout ce qui s'en rapproche (${g.voirAussi})</button>` : ''}
  </section>`;
}

function renderResultats() {
  const nq = norm(state.q);
  const groupes = chercher(nq);
  const n = groupes.reduce((a, g) => a + g.items.length, 0);
  // « konbini » : la bonne réponse n'est pas une adresse du guide, c'est la phrase.
  const estKonbini = /konbini|conbini|superette|convenience/.test(nq);
  q('resultats').innerHTML = (estKonbini ? `<p class="resultats__note">${esc(KONBINI_LIGNE)}</p>` : '')
    + (n ? groupes.map((g) => groupeHTML(g, nq)).join('')
      : estKonbini ? '' : '<p class="empty">Rien ne correspond. Essayez un autre mot.</p>');
  q('count').textContent = n ? `${n} résultat${n > 1 ? 's' : ''}` : 'Aucun résultat';
}

q('resultats').addEventListener('click', (e) => {
  const fiche = e.target.closest('button[data-id]');
  if (fiche) { openSheet(fiche.dataset.id); return; }
  const tout = e.target.closest('button[data-tout]');
  if (tout) { deployes.add(tout.dataset.tout); render(); return; }
  if (e.target.closest('#voir-aussi')) { state.elargi = true; render(); }
});

// --- le catalogue -------------------------------------------------------------
// Un aperçu de 8 adresses par ville, ou la liste d'une ville, d'une envie, d'un
// quartier : ce que les filtres demandent.
function renderCatalogue() {
  // Un quartier n'a de sens que dans sa ville : si la ville change, on l'oublie.
  if (state.quartier !== 'all' && !quartiersDe(state.city).some((x) => x.id === state.quartier)) state.quartier = 'all';

  renderFam();
  renderMode();
  renderQuartiers();
  // La matrice se redessine avec la grille : ses compteurs dépendent des
  // filtres secondaires, ils ne peuvent pas rester figés.
  renderMat();
  renderEtatFiltres();

  const list = SPOTS.filter(matches);
  // 24 cartes, puis « voir plus » : 414 cartes d'un bloc, c'était 47 écrans.
  const sig = JSON.stringify([state.city, state.category, state.priority, state.source, state.kind, state.fam, state.mode, state.quartier, !!state.pos]);
  if (sig !== window.__sig) { window.__sig = sig; window.__lim = 24; }

  // « Près de moi » : les adresses situées d'abord, de la plus proche à la plus
  // loin — à plat, sans regroupement par ville. Les remplissages ('quartier')
  // n'ont pas de coordonnée fiable → rejetés en fin de liste.
  const distOf = (s) => { const o = ouEst(s); return (o && o.confiance !== 'quartier') ? metres(state.pos, o.ll) : Infinity; };
  const parDistance = (a, b) => distOf(a) - distOf(b);

  // Groupée par ville, dans l'ordre du voyage, quand aucune ville n'est choisie.
  const ORDRE = ['tokyo', 'kanazawa', 'kyoto', 'osaka', 'hakone'];
  const rang = (s) => { const i = ORDRE.indexOf(s.cityId); return i < 0 ? 9 : i; };
  const trie = state.pos ? [...list].sort(parDistance)
    : state.city === 'all' ? [...list].sort((a, b) => rang(a) - rang(b)) : list;
  const parVille = {}; trie.forEach((s) => { parVille[s.cityId] = (parVille[s.cityId] || 0) + 1; });
  // Sans ville (et hors tri par distance) : un aperçu de 8 par ville.
  // Sinon Tokyo (200+ adresses) occupait à lui seul toutes les pages avant Kanazawa.
  const apercu = !state.pos && state.city === 'all';
  const vus = {};
  const montres = apercu ? trie.filter((s) => { vus[s.cityId] = (vus[s.cityId] || 0) + 1; return vus[s.cityId] <= 8; }) : trie.slice(0, window.__lim);
  let avant;
  q('grid').innerHTML = montres.map((s, i) => {
    const fin = apercu && (i === montres.length - 1 || montres[i + 1].cityId !== s.cityId) && parVille[s.cityId] > 8
      ? `<p class="bib__all"><button class="btn btn--ghost" type="button" data-ville="${s.cityId || 'partout'}">Toutes les adresses ${s.cityId ? (/^[AEIOUHaeiouh]/.test(CITIES[s.cityId].name) ? "d'" : 'de ') + esc(CITIES[s.cityId].name) : 'hors étapes'} (${parVille[s.cityId]}) →</button></p>` : '';
    const tete = !state.pos && state.city === 'all' && s.cityId !== avant
      ? `<h3 class="bib__city"><span class="city-dot" style="--c:${s.cityId ? `var(--c-${s.cityId})` : 'var(--mut)'}">${esc(s.cityId ? CITIES[s.cityId].name : 'Partout au Japon')}</span><span class="mut">${parVille[s.cityId]} adresses</span></h3>` : '';
    avant = s.cityId;
    return tete + card(s) + fin;
  }).join('');
  const reste = apercu ? 0 : list.length - window.__lim;
  q('more').innerHTML = reste > 0 ? `<button class="btn" type="button" id="more-btn">Voir ${Math.min(reste, 48)} de plus <span class="mut">· ${reste} restantes</span></button>` : '';
  q('empty').hidden = list.length > 0;
  q('count').textContent = `${list.length} adresse${list.length > 1 ? 's' : ''}${state.pos ? ' · au plus près' : ''}`;
}

// Le champ vide montre le catalogue ; dès qu'on tape, les résultats le remplacent.
function render() {
  const cherche = /[\p{L}\p{N}]/u.test(norm(state.q));   // « - », « ' » ou « ? » seuls ne cherchent rien
  const commence = cherche && q('resultats').hidden;
  q('resultats').hidden = !cherche;
  q('biblio').hidden = cherche;
  if (cherche) renderResultats(); else renderCatalogue();
  // Le catalogue, très long, vient de céder la place : si la page était défilée
  // plus bas que le début des résultats, on remonte à eux.
  if (commence) {
    const haut = q('resultats').getBoundingClientRect().top - 130;   // sous la barre et le champ
    if (haut < 0) window.scrollBy({ top: haut, behavior: 'instant' });
  }

  // « Réinitialiser » : dès qu'il y a une recherche ou un filtre à effacer.
  const filtre = !!state.pos || ['city', 'category', 'priority', 'source', 'kind', 'fam', 'quartier'].some((k) => state[k] !== 'all');
  q('reset').hidden = !(cherche || filtre);

  // URL : la recherche et le quartier sont partageables, comme ?ville= et ?envie=.
  // En revenant d'un résultat avec « Retour », on retrouve ainsi sa recherche.
  const u = new URL(location.href);
  if (cherche) u.searchParams.set('q', state.q); else u.searchParams.delete('q');
  if (state.quartier !== 'all') u.searchParams.set('quartier', state.quartier); else u.searchParams.delete('quartier');
  try { history.replaceState(null, '', u.pathname + u.search + u.hash); } catch {}   // Safari limite les appels
}

// --- quartiers de la ville choisie + tri « Près de moi » ----------------------
// N'apparaît qu'une ville choisie, et seulement si elle a des quartiers (donc
// des adresses situées) : sinon le tri par distance n'aurait rien à trier.
function renderQuartiers() {
  const qs = (state.city !== 'all' && state.city !== 'partout') ? quartiersDe(state.city) : [];
  if (!qs.length) { q('quartiers').innerHTML = ''; return; }
  const puces = [{ id: 'all', nom: 'Tous les quartiers' }].concat(qs.map((x) => ({ id: x.id, nom: x.nom })))
    .map((x) => `<button class="chip" data-quartier="${esc(x.id)}" aria-pressed="${state.quartier === x.id}">${esc(x.nom)}</button>`).join('');
  q('quartiers').innerHTML = `<button class="chip" data-proche aria-pressed="${!!state.pos}">Près de moi</button>` + puces;
}
q('quartiers').addEventListener('click', (e) => {
  const qb = e.target.closest('button[data-quartier]');
  if (qb) { state.quartier = qb.dataset.quartier; render(); return; }
  const pb = e.target.closest('button[data-proche]');
  if (pb) toggleProche(pb);
});

// GPS du téléphone : tri par distance, rien n'en sort. Échec/refus : on revient
// à l'ordre normal, avec un mot discret.
function toggleProche(btn) {
  if (state.pos) { state.pos = null; render(); return; }
  btn.textContent = 'Localisation…'; btn.disabled = true;
  maPosition().then((pos) => { state.pos = pos; render(); })
    .catch(() => { state.pos = null; render(); q('count').textContent = 'Localisation indisponible'; });
}


// --- onglets de famille -------------------------------------------------------
function renderMode() {
  const n = (m) => SPOTS.filter(matchesWith({ ...state, mode: m })).length;
  q('essentiel').innerHTML = [['ess', 'L\'essentiel'], ['all', 'Tout voir']].map(([id, lab]) =>
    `<button class="chip" data-mode="${id}" aria-pressed="${state.mode === id}">${lab}<span class="ptabs__n">${n(id)}</span></button>`).join('');
}
q('essentiel').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-mode]');
  if (!b) return;
  state.mode = b.dataset.mode;
  render();
});

function renderFam() {
  const base = { ...state, fam: 'all', kind: 'all' };
  q('fam').innerHTML = FAMS.map((f) => {
    const n = SPOTS.filter(matchesWith({ ...base, fam: f.id })).length;
    return `<button class="chip" data-fam="${f.id}" aria-pressed="${state.fam === f.id}">${esc(f.name)}<span class="ptabs__n">${n}</span></button>`;
  }).join('');
}
q('fam').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-fam]');
  if (!b) return;
  state.fam = b.dataset.fam;
  state.kind = 'all'; q('f-kind').value = 'all';
  render();
});

q('grid').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-ville]');
  if (!b) return;
  e.stopPropagation();
  state.city = b.dataset.ville;
  render();
  q('biblio').scrollIntoView({ block: 'start' });
});

q('more').addEventListener('click', (e) => {
  if (!e.target.closest('#more-btn')) return;
  window.__lim += 48;
  const sig = window.__sig; render(); window.__sig = sig;
});

q('reset').addEventListener('click', () => {
  Object.assign(state, { city: 'all', category: 'all', priority: 'all', source: 'all', kind: 'all', fam: 'all', quartier: 'all', pos: null, elargi: false, q: '' });
  q('f-kind').value = 'all';
  q('search').value = '';
  q('f-priority').value = 'all';
  q('f-source').value = 'all';
  render();
});

// L'état peut venir de l'URL : les commandes doivent le refléter au premier
// rendu, sinon la page dit « Kyoto » et le menu dit « toutes ».
q('search').value = state.q;
q('f-priority').value = state.priority;
q('f-source').value = state.source;

render();
// La loupe de la barre (?chercher) et un lien avec ?q= posent le curseur dans le champ.
if (entree.has('chercher') || entree.has('q')) q('search').focus();

initReveal();
initCoverParallax();
initProgressBar();
</script>
</body>
</html>
