<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le guide — Japon 2026</title>
<meta name="description" content="Les idées repérées pour le voyage : monuments, tables, quartiers, boutiques — filtrables par ville, par envie et par priorité.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F6F6F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14140F" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<main class="wrap">
  <header class="section">
    <p class="eyebrow">Le guide</p>
    <h1>Tout ce qu'on a repéré</h1>
    <p class="hero__lede" id="lede"></p>
  </header>

  <div class="filters" id="filters">
    <div class="filters__group">
      <span class="label">Ville</span>
      <div class="chipbar" data-facet="city"></div>
    </div>
    <div class="filters__group">
      <span class="label">Envie</span>
      <div class="chipbar" data-facet="category"></div>
    </div>
    <div class="filters__group">
      <span class="label">Priorité</span>
      <div class="chipbar" data-facet="priority"></div>
    </div>
    <div class="filters__group">
      <span class="label">Recommandé par</span>
      <div class="chipbar" data-facet="source"></div>
    </div>
  </div>

  <div class="results" id="results-bar">
    <output id="count" aria-live="polite"></output>
    <button class="chip" id="reset" hidden>Tout réafficher</button>
  </div>

  <div class="spotgrid" id="grid"></div>
  <p class="empty" id="empty" hidden>Aucune idée ne correspond. Élargis les filtres.</p>
</main>

<script type="module">
import { SPOTS, CATEGORIES, PRIORITIES } from './data/spots.js';
import { CITIES } from './data/trip.js';
import { mountChrome, esc, bindLightbox } from './app/ui.js';

mountChrome('guide.html');

const q = (id) => document.getElementById(id);

const SOURCES = [
  { id: 'guide', name: "L'amie guide de Mathilde" },
  { id: 'ilyes', name: 'Notre sélection' },
];

// Les facettes se croisent : on peut demander « Kyoto × Food × Obligatoire ».
// C'est ce que le champ cityId a débloqué — avant, la ville n'était qu'un
// intertitre dans le HTML, pas une donnée.
const FACETS = {
  city:     [{ id: 'all', name: 'Toutes' },
             ...Object.entries(CITIES).map(([id, c]) => ({ id, name: c.name, color: c.color })),
             { id: 'partout', name: 'Partout au Japon' }],
  category: [{ id: 'all', name: 'Tout' }, ...CATEGORIES],
  priority: [{ id: 'all', name: 'Toutes' }, ...PRIORITIES],
  source:   [{ id: 'all', name: 'Peu importe' }, ...SOURCES],
};

const state = { city: 'all', category: 'all', priority: 'all', source: 'all' };

q('lede').innerHTML =
  `<b>${SPOTS.length} idées</b> classées par ville, par envie et par priorité. ` +
  `Chaque carte ouvre son adresse dans Google Maps. ` +
  `Les <b>${SPOTS.filter((s) => s.source === 'guide').length} conseils de l'amie guide de Mathilde</b> sont signalés.`;

// --- filtres -----------------------------------------------------------------
for (const [facet, options] of Object.entries(FACETS)) {
  const bar = document.querySelector(`[data-facet="${facet}"]`);
  bar.innerHTML = options.map((o) => `
    <button class="chip" data-value="${o.id}" aria-pressed="${o.id === 'all'}"
            ${o.color ? `style="--c:${o.color}"` : ''}>
      ${o.color ? `<span class="chip__dot" style="background:${o.color}"></span>` : ''}${esc(o.name)}
    </button>`).join('');

  bar.addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    state[facet] = btn.dataset.value;
    bar.querySelectorAll('.chip').forEach((c) =>
      c.setAttribute('aria-pressed', String(c === btn)));
    render();
  });
}

q('reset').addEventListener('click', () => {
  Object.keys(state).forEach((k) => (state[k] = 'all'));
  document.querySelectorAll('.chipbar').forEach((bar) =>
    bar.querySelectorAll('.chip').forEach((c) =>
      c.setAttribute('aria-pressed', String(c.dataset.value === 'all'))));
  render();
});

// --- rendu -------------------------------------------------------------------
const matches = (s) =>
  (state.city === 'all'
    || (state.city === 'partout' ? s.cityId === null : s.cityId === state.city))
  && (state.category === 'all' || s.category === state.category)
  && (state.priority === 'all' || s.priority === state.priority)
  && (state.source === 'all' || s.source === state.source);

const catName = Object.fromEntries(CATEGORIES.map((c) => [c.id, c.name]));
const prioName = Object.fromEntries(PRIORITIES.map((p) => [p.id, p.name]));

function card(s) {
  const city = s.cityId ? CITIES[s.cityId] : null;
  return `
  <a class="card card--link spot" href="${esc(s.maps)}" target="_blank" rel="noopener">
    <div class="thumb thumb--wide">
      ${s.img ? `<img src="${esc(s.img)}" alt="${esc(s.name)}" loading="lazy" decoding="async">` : ''}
      <span class="prio prio--${s.priority} spot__prio">${prioName[s.priority]}</span>
      ${s.source === 'guide' ? '<span class="spot__guide" title="Conseillé par l\'amie guide de Mathilde">Conseil de la guide</span>' : ''}
    </div>
    <div class="spot__body">
      <h3>${esc(s.name)}</h3>
      <p>${esc(s.blurb)}</p>
      <p class="spot__meta">
        <span class="city-dot" style="--c:${city ? city.color : 'var(--mut)'}">${city ? esc(city.name) : 'Partout'}</span>
        <span class="mut">· ${catName[s.category]}</span>
      </p>
    </div>
  </a>`;
}

function render() {
  const list = SPOTS.filter(matches);
  q('grid').innerHTML = list.map(card).join('');
  q('empty').hidden = list.length > 0;

  const filtered = Object.values(state).some((v) => v !== 'all');
  q('count').innerHTML = filtered
    ? `<b>${list.length}</b> idée${list.length > 1 ? 's' : ''} sur ${SPOTS.length}`
    : `<b>${SPOTS.length}</b> idées`;
  q('reset').hidden = !filtered;
}

render();
bindLightbox(q('grid'), 'never'); // les cartes ouvrent Maps ; pas de visionneuse ici
</script>

<script>
/* Enregistrement du service worker : c'est lui qui rend le site utilisable
   sans réseau. La page Pratique pilote en plus le téléchargement des photos. */
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
