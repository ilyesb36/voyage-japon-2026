.aj{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.wx{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.wx b{font-family:'Fraunces',serif;font-size:34px}
.wx .wdesc{font-size:14px;color:var(--mut)}
.wrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--mut)}
.wrow span b{font-family:'Inter',sans-serif;font-size:12.5px;color:var(--ink);font-weight:600}
.plist{margin:0;padding:0;list-style:none}
.plist li{padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.5}
.plist li:last-child{border-bottom:none}
.plist li b{font-weight:600}
.hrow{display:flex;gap:14px;align-items:center}
.hrow img{width:86px;height:64px;border-radius:12px;object-fit:cover}
.hrow .hi b{display:block;font-family:'Fraunces',serif;font-size:16px}
.hrow .hi span{font-size:12.5px;color:var(--mut)}
.btn{display:inline-block;background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;text-decoration:none;margin:10px 8px 0 0}
.btn:hover{background:var(--acc)}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.o:hover{border-color:var(--acc);color:var(--acc);background:transparent}
.check{margin:0;padding:0;list-style:none}
.check li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px;display:flex;gap:10px;align-items:baseline}
.check li:last-child{border:none}
.check li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none;transform:translateY(-1px)}
.mini{font-size:12px;color:var(--mut);margin-top:14px}
