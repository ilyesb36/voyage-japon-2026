<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>À faire — Japon 2026</title>
<meta name="description" content="Les démarches et les réservations à faire avant et pendant le voyage, le mode hors-ligne et les conseils à lire avant de partir.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1512" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Japon 2026">
<link rel="stylesheet" href="app.css">
<script>
/* Avant le rendu : éviter l'éclair clair quand le sombre est choisi. */
try { if (localStorage.getItem('jp2026_theme') === 'dark')
  document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
</script>
</head>
<body>

<main class="wrap" id="app"></main>

<script type="module">
import { TRIP, CITIES, STEPS, HOTELS, EXCURSIONS, FLIGHTS, RESERVATIONS } from './data/trip.js';
import { SPOTS } from './data/spots.js';
import { DAYS } from './data/days.js';
import { AVANT, SURPLACE, METEO, RESERVER } from './data/pratique.js';
import { fetchMeteo, meteoCities, heureJapon } from './app/meteo.js';
import { mountChrome, initReveal, initCoverParallax, initProgressBar, esc, formatDate, daysBetween, today, moment } from './app/ui.js';
import { lireFaits } from './app/resa.js';

mountChrome('aujourdhui.html');

const now = today();
const app = document.getElementById('app');

const away = daysBetween(now, TRIP.start);

// La page montre ce qu'il reste à faire, avant le départ ET pendant le voyage :
// une échéance tombe là-bas (Saikō Shinkan le 14). Elle ne
// renvoie plus vers la journée en cours, qui vit sur jour.html. Après le
// voyage, c'est le mot de la fin. Le paramètre ?date=2026-11-18 permet de voir
// chaque état sans attendre novembre.
app.innerHTML = moment() === 'apres' ? after() : before();

// La météo arrive après le rendu : elle ne doit jamais retarder la page.
if (document.getElementById('meteo')) paintMeteo();

// --- avant le départ ----------------------------------------------------------
// La page disait quatre fois la même chose : « À réserver », « À faire »,
// « Réservations » et « Billets datés » se recouvraient largement — et deux
// entrées, le certificat médicaments et le Yakkan Shoumei, étaient littéralement
// la même démarche écrite deux fois. Tout tient désormais dans UNE liste
// d'échéances, triée, cochable, avec son avancement.
function before() {
  // Le compte à rebours n'a de sens que jusqu'au départ ; ensuite, on dit où l'on en est.
  const quand = away > 0 ? `Départ le ${formatDate(TRIP.start, { weekday: true })} · <span class="data">J−${away}</span>`
    : away === 0 ? "Départ aujourd'hui" : 'En voyage';
  // Sous les échéances viennent le hors-ligne (son script est plus bas) et les
  // réflexes de terrain de l'ancienne page Pratique, chacun replié : on lit la
  // ligne, on ouvre celui qu'on cherche.
  return `
  <header class="section countdown">
    <p class="eyebrow">${quand}</p>
    <h1>À faire</h1>
    <p class="hero__lede">
      ${TRIP.nights} nuits, ${new Set(STEPS.map((s) => s.cityId)).size} villes, ${EXCURSIONS.length} excursions.
      Les ${HOTELS.length} hébergements et les ${FLIGHTS.length} vols sont pris.
    </p>
  </header>

  <section class="section">
    <div id="avant"></div>
  </section>

  <section class="section" id="hors-ligne">
    <div class="shead"><h2>Hors-ligne</h2></div>
    <div class="offline card">
      <p><b id="off-state">Vérification…</b></p>
      <p class="mut">
        Tout le site — les pages, toutes les photos, les cartes déjà
        consultées — peut tenir sur le téléphone et fonctionner sans réseau.
        Environ 30 Mo. À faire avant de partir, en wifi.
      </p>
      <div class="offline__bar" id="off-bar" hidden><span></span></div>
      <p><button class="btn" id="off-go" disabled>Préparer le hors-ligne</button></p>
    </div>
  </section>

  <section class="section" id="a-lire">
    <div class="shead">
      <h2>À lire avant de partir</h2>
      <p>Ce qui surprend un Français au Japon, et ce qui coûte cher à ignorer.</p>
    </div>
    <div class="lire">
      ${SURPLACE.filter((k) => k.place === 'avant').map((k) => `
      <details class="lire__item">
        <summary>${esc(k.title)}</summary>
        <div class="lire__corps">
          <p>${esc(k.what)}</p>
          ${k.warn ? `<p class="lire__warn">${esc(k.warn)}</p>` : ''}
        </div>
      </details>`).join('')}
    </div>
  </section>

  ${RESERVATIONS.length ? `
  <section class="section">
    <div class="shead">
      <h2>${RESERVATIONS.length > 1 ? 'Déjà en poche' : 'Déjà en poche'}</h2>
      <p>Payé, à une heure précise. Le détail du jour même est sur la journée.</p>
    </div>
    ${RESERVATIONS.map((r) => {
      const dj = DAYS.find((d) => d.date === r.date);
      return `
      <div class="card cardlink">
        <a class="cardlink__in" href="${dj ? `jour.html?d=${dj.n}` : 'itineraire.html'}">
          <span class="cardlink__texte">
            <b>${esc(r.title)}</b>
            <span class="mut">${formatDate(r.date, { weekday: true })} · <span class="data">${esc(r.slot)}</span>
              · ${esc(r.where)} · ${esc(r.status)}</span>
          </span>
          <span class="cardlink__fleche" aria-hidden="true">›</span>
        </a>
      </div>`;
    }).join('')}
  </section>` : ''}

  <section class="section">
    <div class="shead">
      <h2>Le temps</h2>
      <p>Là-bas en ce moment, et les normales de novembre pour la valise.</p>
      <span class="shead__meta" id="meteo-when"></span>
    </div>
    <div class="meteo" id="meteo">${meteoSkeleton()}</div>
  </section>

  ${moment() === 'avant' ? `
  <section class="section">
    <div class="shead"><h2>Le premier jour</h2><span class="shead__meta data">${formatDate(DAYS[0].date)}</span></div>
    <div class="card cardlink">
      <a class="cardlink__in" href="jour.html?d=1">
        <span class="cardlink__texte">
          <b>${esc(DAYS[0].title)}</b>
          <span class="mut">${esc(DAYS[0].items[0]?.text || '')}</span>
        </span>
        <span class="cardlink__fleche" aria-hidden="true">›</span>
      </a>
    </div>
  </section>` : ''}`;
}

// --- la liste des échéances ---------------------------------------------------
// Démarches et réservations sont la même chose : quelque chose à faire avant une
// date. Les séparer obligeait à lire deux listes pour savoir ce qui presse.
// Ce qui est coché descend en bas, replié : on ne relit pas ce qui est fait.
// La lecture est celle de app/resa.js, qui sert aussi l'accueil et la page du
// jour ; l'écriture garde le même format (une table { id: true | false }).
const faits = lireFaits();
const noteFait = () => { try { localStorage.setItem('jp2026_faits', JSON.stringify(faits)); } catch { /* stockage plein ou refusé */ } };

function renderAvant() {
  const cible = document.getElementById('avant');
  if (!cible) return;

  const tout = [
    ...AVANT.map((x) => ({ ...x, genre: 'démarche' })),
    ...RESERVER.map((x) => ({ ...x, genre: 'réservation' })),
  ]
    // Une réservation marquée « réservé » dans les données est faite sur les deux téléphones,
    // cochée ou non ; le reste suit la case de ce téléphone.
    .map((x) => ({ ...x, fait: x.etat === 'reserve' || !!faits[x.id] }))
    .sort((a, b) => (a.fait - b.fait) || a.deadline.localeCompare(b.deadline));

  const restants = tout.filter((x) => !x.fait);
  const faites = tout.filter((x) => x.fait);
  const pct = Math.round((faites.length / tout.length) * 100);

  let lignes;
  if (vue === 'categorie') {
    // Par catégorie : ce qui se règle d'un même geste est ensemble (tout ce qui
    // touche au téléphone, tous les billets). Dans chaque catégorie, l'ordre
    // reste celui des échéances, et l'urgence se voit ligne par ligne.
    lignes = CATS.map((c) => {
      const lot = restants.filter((x) => categorie(x) === c.id);
      if (!lot.length) return '';
      return `<li class="ech__mois" aria-hidden="true">${esc(c.nom)} <span class="ech__compte">${lot.length}</span></li>`
        + lot.map((x) => ligneAvant(x)).join('');
    }).join('');
  } else {
    // Par échéance : un séparateur quand le mois change, comme sur un
    // calendrier, plutôt que vingt dates à comparer de tête.
    let mois = '';
    lignes = restants.map((x) => {
      const m = MOIS[+x.deadline.slice(5, 7) - 1];
      const sep = m !== mois ? `<li class="ech__mois" aria-hidden="true">${m}</li>` : '';
      mois = m;
      return sep + ligneAvant(x);
    }).join('');
  }

  cible.innerHTML = `
    <div class="shead">
      <h2>Avant de partir</h2>
      <p>Démarches et réservations, ${vue === 'categorie' ? 'rangées par catégorie' : "dans l'ordre des échéances"}. Une ligne s'ouvre sur son détail.</p>
      <span class="shead__meta data">${faites.length} sur ${tout.length}</span>
    </div>
    <div class="chipbar ech__vues" role="group" aria-label="Ranger les démarches">
      <button class="chip" type="button" data-vue="categorie" aria-pressed="${vue === 'categorie'}">Par catégorie</button>
      <button class="chip" type="button" data-vue="date" aria-pressed="${vue === 'date'}">Par échéance</button>
    </div>
    <div class="prog__bar"><span style="width:${pct}%"></span></div>
    <ol class="ech">
      ${lignes}
      ${faites.length ? `<li class="ech__mois" aria-hidden="true">Fait</li>` : ''}
      ${faites.map((x) => ligneAvant(x)).join('')}
    </ol>`;

  cible.querySelectorAll('button[data-vue]').forEach((b) => {
    b.addEventListener('click', () => {
      vue = b.dataset.vue;
      try { localStorage.setItem('jp2026_ech_vue', vue); } catch { /* navigation privée */ }
      renderAvant();
    });
  });
  cible.querySelectorAll('input[data-fait]').forEach((cb) => {
    cb.addEventListener('change', () => {
      faits[cb.dataset.fait] = cb.checked;
      noteFait();
      renderAvant();
    });
  });
  cible.querySelectorAll('details[data-id]').forEach((d) => {
    d.addEventListener('toggle', () => {
      const id = d.dataset.id;
      // Ouverte par l'ancre : on ne la note pas. Refermée au toucher, elle redevient une ligne comme les autres.
      if (id === idAncre) { if (d.open) return; idAncre = null; }
      d.open ? ouverts.add(id) : ouverts.delete(id);
      try { localStorage.setItem('jp2026_ech_ouverts', JSON.stringify([...ouverts])); } catch { /* navigation privée */ }
    });
  });
}

// Les catégories, dans l'ordre où on les traite : les papiers d'abord (les délais
// administratifs ne se rattrapent pas), la valise en dernier. Une entrée peut
// porter `cat` dans data/pratique.js ; sinon elle se range d'elle-même.
const CATS = [
  { id: 'papiers', nom: 'Santé et papiers' },
  { id: 'hebergements', nom: 'Hébergements' },
  { id: 'transports', nom: 'Transports' },
  { id: 'telephone', nom: 'Téléphone et cartes' },
  { id: 'billets', nom: 'Visites et billets' },
  { id: 'tables', nom: 'À table' },
  { id: 'valise', nom: 'Dans la valise' },
  { id: 'autres', nom: 'Le reste' },
];
const CAT_DEMARCHE = {
  medicaments: 'papiers', assurance: 'papiers', vjw: 'papiers',
  'hakone-paiement': 'hebergements', 'precheckin-osaka': 'hebergements',
  suica: 'transports', pass: 'transports', 'shinkansen-kanazawa': 'transports',
  esim: 'telephone', cartes: 'telephone',
  prise: 'valise',
};
function categorie(x) {
  if (x.cat) return x.cat;
  if (x.genre === 'démarche') return CAT_DEMARCHE[x.id] || 'autres';
  if (x.hotelId) return 'hebergements';
  const spot = x.spotId ? SPOTS.find((s) => s.id === x.spotId) : null;
  return spot && (spot.category === 't1' || ['resto', 'cafe', 'bar'].includes(spot.kind)) ? 'tables' : 'billets';
}
let vue = (() => {
  try { return localStorage.getItem('jp2026_ech_vue') || 'categorie'; } catch { return 'categorie'; }
})();

const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août',
  'septembre', 'octobre', 'novembre', 'décembre'];
const MOIS_COURT = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const court = (iso) => `${+iso.slice(8, 10)} ${MOIS_COURT[+iso.slice(5, 7) - 1]}`;
const ouverts = new Set((() => {
  try { return JSON.parse(localStorage.getItem('jp2026_ech_ouverts') || '[]'); } catch { return []; }
})());
// La ligne qu'une ancre (#e-<démarche>) vise s'ouvre à l'arrivée et reste ouverte le temps de la page,
// mais elle n'entre pas dans `ouverts` : seul un toucher enregistre une ligne ouverte (voir « toggle »).
let idAncre = (/^#e-(.+)$/.exec(location.hash) || [])[1] || null;

// Une ligne : la case, le titre et où ça se passe, l'échéance à droite. Tout le
// reste — photo, ce que c'est, où réserver, comment — est replié dessous. On
// balaie treize lignes d'un regard ; on n'ouvre que celle qu'on traite.
// Chaque ligne porte une ancre, #e-<id de la démarche> : l'accueil et la page du jour
// y renvoient, et la ligne s'ouvre à l'arrivée (voir « l'ancre » plus bas). La case est
// dans un label : sa zone tapable fait 44 px, la case garde sa taille.
function ligneAvant(x) {
  const j = daysBetween(now, x.deadline);
  const passe = j < 0;
  const urgent = !passe && j <= 14;

  const spot = x.spotId ? SPOTS.find((s) => s.id === x.spotId) : null;
  const hotel = x.hotelId ? HOTELS.find((h) => h.id === x.hotelId) : null;
  const ville = spot ? CITIES[spot.cityId] : hotel ? CITIES[hotel.cityId] : null;
  const img = spot?.img || hotel?.images?.[0] || null;
  const maps = spot?.maps || hotel?.maps || null;

  if (x.fait) {
    return `
    <li class="ech__item ech__item--fait" id="e-${esc(x.id)}">
      <label class="ech__case"><input type="checkbox" data-fait="${esc(x.id)}" checked${x.etat === 'reserve' ? ' disabled' : ''} aria-label="${esc(x.title)} — ${x.etat === 'reserve' ? 'réservé' : 'fait'}"></label>
      <span class="ech__quoi"><s>${esc(x.title)}</s>${x.etat === 'reserve' && x.heure ? ` <span class="mut data">· ${esc(x.heure)}</span>` : ''}</span>
    </li>`;
  }

  // « Tokyo · pour le 11 nov. » dit déjà que c'est une réservation ; le mot
  // n'est utile que pour les démarches sans lieu.
  const meta = [
    ville?.name,
    ville ? null : x.genre,
    x.forDate ? `pour le ${court(x.forDate)}` : null,
    x.hard ? 'date ferme' : null,
    x.check ? 'à vérifier' : null,
  ].filter(Boolean).join(' · ');

  return `
  <li class="ech__item${urgent ? ' is-urgent' : ''}${passe ? ' is-passe' : ''}" id="e-${esc(x.id)}">
    <label class="ech__case"><input type="checkbox" data-fait="${esc(x.id)}" aria-label="Marquer « ${esc(x.title)} » comme fait"></label>
    <details class="ech__pli" data-id="${esc(x.id)}" ${ouverts.has(x.id) || x.id === idAncre ? 'open' : ''}>
      <summary>
        <span class="ech__quoi">
          <b>${esc(x.title)}</b>
          <span class="mut">${esc(meta)}</span>
        </span>
        <span class="ech__quand">
          <b class="data">${passe ? 'passée' : `avant le ${court(x.deadline)}`}</b>
          <span class="mut">${passe ? court(x.deadline) : j === 0 ? "aujourd'hui" : `dans ${j} j`}</span>
        </span>
      </summary>
      <div class="ech__detail${img ? '' : ' ech__detail--nue'}">
        ${img ? `<img class="ech__shot" src="${esc(img)}" alt="" loading="lazy" decoding="async">` : ''}
        <div>
          ${spot?.blurb ? `<p class="ech__blurb">${esc(spot.blurb)}</p>` : ''}
          <p>${esc(x.what)}</p>
          ${x.tag ? `<p class="mut">${esc(x.tag)}.</p>` : ''}
          ${x.commentReserver ? `<p class="mut"><b>Comment</b> ${esc(x.commentReserver)}</p>` : ''}
          <p class="resa-item__actions">
            ${x.url && !/^https?:/.test(x.url) ? `<a class="btn" href="${esc(x.url)}">Ouvrir</a>` : ''}
            ${x.url && /^https?:/.test(x.url) ? `<a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener">${
              x.canal === 'téléphone' ? 'Voir le numéro' : x.canal ? 'Réserver' : 'Ouvrir le site officiel'}</a>` : ''}
            ${x.page ? `<a class="btn btn--ghost" href="${esc(x.page)}">${esc(x.pageLabel || 'Voir la page')}</a>` : ''}
            ${x.tel ? `<a class="btn btn--ghost" href="tel:${esc(x.tel.replace(/[^+\d]/g, ''))}">${esc(x.tel)}</a>` : ''}
            ${maps ? `<a class="btn btn--ghost" href="${esc(maps)}" target="_blank" rel="noopener">Où c'est</a>` : ''}
            ${x.forDate ? `<a class="btn btn--ghost" href="jour.html?date=${x.forDate}">La journée</a>` : ''}
          </p>
        </div>
      </div>
    </details>
  </li>`;
}

// --- après le voyage ----------------------------------------------------------
function after() {
  return `
  <header class="section countdown">
    <p class="eyebrow">${formatDate(TRIP.start)} — ${formatDate(TRIP.end, { year: true })}</p>
    <h1>C'est fini</h1>
    <p class="hero__lede">
      ${TRIP.nights} nuits, ${new Set(STEPS.map((s) => s.cityId)).size} villes. Tout est encore là :
      <a href="itineraire.html">les journées</a>,
      <a href="guide.html">les adresses</a>,
      <a href="secours.html#logements">les chambres</a>.
    </p>
  </header>`;
}

// --- la météo -----------------------------------------------------------------
// Rendue en deux temps : la grille apparaît tout de suite avec les normales,
// puis le relevé du moment se glisse dedans. Rien ne saute, rien n'attend.
function meteoSkeleton() {
  return meteoCities().map((c) => `
    <div class="meteo__row" style="--c:var(--c-${c.id})" data-city="${c.cityId}">
      <span class="meteo__city">${esc(c.name)}</span>
      <span class="meteo__now" data-now><span class="meteo__dots" aria-hidden="true"></span></span>
      <span class="meteo__norm data">${METEO[c.cityId].max}° / ${METEO[c.cityId].min}°
        <span class="mut">en novembre</span></span>
      <span class="meteo__note mut">${esc(METEO[c.cityId].note)}</span>
    </div>`).join('');
}

async function paintMeteo() {
  const data = await fetchMeteo();
  const when = document.getElementById('meteo-when');
  if (!data) {
    document.querySelectorAll('[data-now]').forEach((el) => { el.textContent = ''; });
    if (when) when.textContent = 'relevé indisponible hors-ligne';
    return;
  }
  for (const [cityId, m] of Object.entries(data.cities)) {
    const el = document.querySelector(`[data-city="${cityId}"] [data-now]`);
    if (!el) continue;
    el.innerHTML = `<span class="meteo__icon">${m.icon}</span>
      <b class="data">${m.temp}°</b> <span class="mut">${esc(m.label)}</span>`;
    el.classList.add('is-live');
  }
  if (when) {
    when.textContent = data.fresh
      ? `relevé à ${heureJapon()} au Japon`
      : `dernier relevé connu — pas de réseau`;
  }
}

// --- l'ancre ------------------------------------------------------------------
// Une ancre (#a-lire, #hors-ligne, #e-<démarche>) vise une section ou une ligne que ce
// script vient de dessiner : le navigateur n'a pas trouvé sa cible au chargement. On y va
// à la main, d'un coup — le défilement en douceur de la page partirait du haut et serait
// coupé —, sous la barre collante (scroll-margin). Une ligne d'échéance (#e-…) est déjà
// ouverte par le dessin de la liste (idAncre : on vient la traiter), sans que ce soit
// noté. Le service worker répond après coup, et la carte du hors-ligne, au-dessus de
// « À lire », change alors de hauteur : tant qu'on n'a pas défilé soi-même, on recadre
// (Safari ne le fait pas tout seul).
let yAncre = null;   // où l'ancre nous a posés ; null sans ancre
function allerALAncre() {
  const cible = document.getElementById(location.hash.slice(1));
  if (!cible) return;
  cible.scrollIntoView({ behavior: 'instant' });
  yAncre = scrollY;
}
function recadrerAncre() {
  if (yAncre !== null && Math.abs(scrollY - yAncre) < 2) allerALAncre();
}

// --- le hors-ligne ------------------------------------------------------------
// Une action explicite, avec une progression réelle : le pré-chargement
// silencieux à l'installation échouait sans que personne ne le sache.
// Le service worker répond { shell, shellTotal, media, mediaTotal }. Les photos
// restent en mémoire d'une version du site à l'autre ; les pages, non : chaque
// mise à jour vide la coque. L'état se lit donc sur les deux.
// Le bouton est là, grisé, dès le rendu : sa place est réservée, il ne surgit pas
// sous les yeux quand le service worker répond. Ce qui change de hauteur malgré tout
// (la phrase d'état, le bouton qui s'efface une fois prêt) recadre l'ancre.
function monteHorsLigne() {
  if (!document.getElementById('hors-ligne')) return;
  const q = (id) => document.getElementById(id);
  const state = q('off-state');
  const bar = q('off-bar');
  const go = q('off-go');
  // Sans service worker, il n'y a rien à préparer : on le dit, et le bouton s'en va.
  const indisponible = () => {
    state.textContent = 'Indisponible sur ce navigateur';
    go.hidden = true;
    recadrerAncre();
  };
  if (!('serviceWorker' in navigator)) { indisponible(); return; }
  // Là où il est interdit (iframe en bac à sable, cookies bloqués), c'est LIRE
  // navigator.serviceWorker qui lève, tout de suite : on le traite comme un navigateur
  // sans service worker, au lieu de laisser l'erreur arrêter le reste de la page.
  try { navigator.serviceWorker; } catch { indisponible(); return; }

  // « Incomplet » et « Reprendre » ne se disent que d'un téléchargement lancé sur ce téléphone :
  // les photos qu'on voit en naviguant s'ajoutent au cache toutes seules, et « 1 photo sur 447 »
  // n'est pas un téléchargement raté. Tant que rien n'est lancé, le bouton s'appelle « Préparer
  // le hors-ligne », comme le dit la démarche « Cartes hors-ligne ».
  const lance = () => { try { return localStorage.getItem('jp2026_hl_lance') === '1'; } catch { return false; } };
  const photos = (n) => `${n} photo${n > 1 ? 's' : ''}`;

  // Le verdict. « status » (au chargement) et « done » (à la fin du téléchargement)
  // portent les mêmes quatre compteurs : la même règle les lit, pour qu'un
  // téléchargement qui n'a pas tout mis en mémoire ne se dise jamais « prêt ».
  function montre(d) {
    const photosLa = d.mediaTotal > 0 && d.media >= d.mediaTotal;
    const pret = d.shell >= d.shellTotal && photosLa;
    // « Incomplet » ne se dit que des photos : des pages à refaire sur des photos
    // toutes là, c'est une mise à jour du site, pas un téléchargement raté.
    const incomplet = lance() && d.media < d.mediaTotal;

    state.textContent = pret ? `Prêt pour le hors-ligne — ${photos(d.media)} en mémoire`
      : photosLa ? 'Le site a été mis à jour : les pages sont à retélécharger, les photos sont déjà là.'
      : incomplet ? `Téléchargement incomplet — ${photos(d.media)} sur ${d.mediaTotal}`
      : 'Pas encore téléchargé';

    bar.hidden = true;
    go.hidden = pret;
    go.disabled = false;
    go.textContent = incomplet ? 'Reprendre le téléchargement' : 'Préparer le hors-ligne';
    recadrerAncre();
  }

  navigator.serviceWorker.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.type === 'status' || d.type === 'done') montre(d);
    if (d.type === 'progress') {
      bar.hidden = false;
      bar.firstElementChild.style.width = `${Math.round((d.done / d.total) * 100)}%`;
      state.textContent = d.phase === 'pages'
        ? `Pages — ${d.done} / ${d.total}`
        : `Photos — ${d.done} / ${d.total}`;
      go.disabled = true;
    }
  });

  navigator.serviceWorker.register('sw.js').then(async (reg) => {
    await navigator.serviceWorker.ready;
    const sw = () => navigator.serviceWorker.controller || reg.active;
    sw()?.postMessage({ type: 'cache-status' });
    go.addEventListener('click', () => {
      state.textContent = 'Démarrage…';
      try { localStorage.setItem('jp2026_hl_lance', '1'); } catch { /* navigation privée : le bouton garde son nom d'origine */ }
      sw()?.postMessage({ type: 'cache-all' });
    });
  }).catch(indisponible);
}

// La liste des échéances est montée après coup : elle se redessine à chaque
// case cochée. L'appel vit ici, après les déclarations qu'elle utilise — plus
// haut, `faits` était encore dans sa zone morte et la liste restait vide.
renderAvant();
monteHorsLigne();

if (location.hash) {
  history.scrollRestoration = 'manual';   // le navigateur ne rend pas la main à l'ancien défilement
  allerALAncre();
  addEventListener('load', recadrerAncre);   // une police qui se pose peut décaler la page
}

initReveal();
initCoverParallax();
initProgressBar();
</script>
</body>
</html>
