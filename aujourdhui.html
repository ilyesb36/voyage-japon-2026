<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Préparatifs — Japon 2026</title>
<meta name="description" content="Le programme du jour, l'hôtel du soir et le prochain train.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1512" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
<script>
/* Avant le rendu : éviter l'éclair clair quand le sombre est choisi. */
try { if (localStorage.getItem('jp2026_theme') === 'dark')
  document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
</script>
</head>
<body>

<main class="wrap" id="app"></main>

<script type="module">
import { TRIP, CITIES, STEPS, HOTELS, SEGMENTS, EXCURSIONS, FLIGHTS } from './data/trip.js';
import { SPOTS } from './data/spots.js';
import { DAYS, TEMPLATES } from './data/days.js';
import { AVANT, SURPLACE, METEO, RESERVER } from './data/pratique.js';
import { fetchMeteo, meteoCities, heureJapon, meteoDuJour } from './app/meteo.js';
import { mountChrome, initReveal, initCoverParallax, initProgressBar, esc, eur, formatDate, daysBetween, today } from './app/ui.js';
import { RESERVATIONS } from './data/trip.js';
import { resaStrip, resasForDate, resaCard } from './app/resa.js';

mountChrome('aujourdhui.html');

const now = today();
const app = document.getElementById('app');

const day = DAYS.find((d) => d.date === now);
const away = daysBetween(now, TRIP.start);

// La page a deux vies : un compte à rebours avant le départ, un compagnon de
// route pendant. Le paramètre ?date=2026-11-18 permet de voir la seconde
// sans attendre novembre.
// Pendant le voyage, cette page n'a plus de raison d'être : la journée en cours
// vit sur jour.html, avec la carte et le parcours. Elle y renvoie sans rien
// afficher entre-temps. Avant, c'est la page des préparatifs ; après, le mot de
// la fin.
if (day) location.replace(`jour.html?d=${day.n}`);
app.innerHTML = day ? '' : (away > 0 ? before() : after());

// La météo arrive après le rendu : elle ne doit jamais retarder la page.
if (document.getElementById('meteo')) paintMeteo();

// --- avant le départ ----------------------------------------------------------
// La page disait quatre fois la même chose : « À réserver », « À faire »,
// « Réservations » et « Billets datés » se recouvraient largement — et deux
// entrées, le certificat médicaments et le Yakkan Shoumei, étaient littéralement
// la même démarche écrite deux fois. Tout tient désormais dans UNE liste
// d'échéances, triée, cochable, avec son avancement.
function before() {
  return `
  <header class="section countdown">
    <p class="eyebrow">Départ le ${formatDate(TRIP.start, { weekday: true })}</p>
    <h1><span class="countdown__n data">J−${away}</span></h1>
    <p class="hero__lede">
      ${TRIP.nights} nuits, ${new Set(STEPS.map((s) => s.cityId)).size} villes, ${EXCURSIONS.length} excursions.
      Les ${HOTELS.length} hébergements et les ${FLIGHTS.length} vols sont pris.
    </p>
  </header>

  <section class="section">
    <div id="avant"></div>
  </section>

  ${RESERVATIONS.length ? `
  <section class="section">
    <div class="shead">
      <h2>${RESERVATIONS.length > 1 ? 'Déjà en poche' : 'Déjà en poche'}</h2>
      <p>Payé, à une heure précise. Le détail du jour même est sur la journée.</p>
    </div>
    ${RESERVATIONS.map((r) => {
      const dj = DAYS.find((d) => d.date === r.date);
      return `
      <div class="card cardlink">
        <a class="cardlink__in" href="${dj ? `jour.html?d=${dj.n}` : 'itineraire.html'}">
          <span class="cardlink__texte">
            <b>${esc(r.title)}</b>
            <span class="mut">${formatDate(r.date, { weekday: true })} · <span class="data">${esc(r.slot)}</span>
              · ${esc(r.where)} · ${esc(r.status)}</span>
          </span>
          <span class="cardlink__fleche" aria-hidden="true">›</span>
        </a>
      </div>`;
    }).join('')}
  </section>` : ''}

  <section class="section">
    <div class="shead">
      <h2>Le temps</h2>
      <p>Là-bas en ce moment, et les normales de novembre pour la valise.</p>
      <span class="shead__meta" id="meteo-when"></span>
    </div>
    <div class="meteo" id="meteo">${meteoSkeleton()}</div>
  </section>

  <section class="section">
    <div class="shead"><h2>Le premier jour</h2><span class="shead__meta data">${formatDate(DAYS[0].date)}</span></div>
    <div class="card cardlink">
      <a class="cardlink__in" href="jour.html?d=1">
        <span class="cardlink__texte">
          <b>${esc(DAYS[0].title)}</b>
          <span class="mut">${esc(DAYS[0].items[0]?.text || '')}</span>
        </span>
        <span class="cardlink__fleche" aria-hidden="true">›</span>
      </a>
    </div>
    <p class="jour__liens">
      <a class="btn btn--ghost" href="pratique.html">Ce qu'il faut savoir sur place</a>
    </p>
  </section>`;
}

// --- la liste des échéances ---------------------------------------------------
// Démarches et réservations sont la même chose : quelque chose à faire avant une
// date. Les séparer obligeait à lire deux listes pour savoir ce qui presse.
// Ce qui est coché descend en bas, replié : on ne relit pas ce qui est fait.
const faits = (() => {
  try { return JSON.parse(localStorage.getItem('jp2026_faits') || '{}'); } catch { return {}; }
})();
const noteFait = () => localStorage.setItem('jp2026_faits', JSON.stringify(faits));

function renderAvant() {
  const cible = document.getElementById('avant');
  if (!cible) return;

  const tout = [
    ...AVANT.map((x) => ({ ...x, genre: 'démarche' })),
    ...RESERVER.map((x) => ({ ...x, genre: 'réservation' })),
  ]
    .map((x) => ({ ...x, fait: !!faits[x.id] }))
    .sort((a, b) => (a.fait - b.fait) || a.deadline.localeCompare(b.deadline));

  const restants = tout.filter((x) => !x.fait);
  const faites = tout.filter((x) => x.fait);
  const pct = Math.round((faites.length / tout.length) * 100);

  // Les échéances se lisent par mois : un séparateur quand le mois change,
  // comme sur un calendrier, plutôt que treize dates à comparer de tête.
  let mois = '';
  const lignes = restants.map((x) => {
    const m = MOIS[+x.deadline.slice(5, 7) - 1];
    const sep = m !== mois ? `<li class="ech__mois" aria-hidden="true">${m}</li>` : '';
    mois = m;
    return sep + ligneAvant(x);
  }).join('');

  cible.innerHTML = `
    <div class="shead">
      <h2>Avant de partir</h2>
      <p>Démarches et réservations, dans l'ordre des échéances. Une ligne s'ouvre sur son détail.</p>
      <span class="shead__meta data">${faites.length} sur ${tout.length}</span>
    </div>
    <div class="prog__bar"><span style="width:${pct}%"></span></div>
    <ol class="ech">
      ${lignes}
      ${faites.length ? `<li class="ech__mois" aria-hidden="true">Fait</li>` : ''}
      ${faites.map((x) => ligneAvant(x)).join('')}
    </ol>`;

  cible.querySelectorAll('input[data-fait]').forEach((cb) => {
    cb.addEventListener('change', () => {
      faits[cb.dataset.fait] = cb.checked;
      noteFait();
      renderAvant();
    });
  });
  cible.querySelectorAll('details[data-id]').forEach((d) => {
    d.addEventListener('toggle', () => {
      d.open ? ouverts.add(d.dataset.id) : ouverts.delete(d.dataset.id);
      localStorage.setItem('jp2026_ech_ouverts', JSON.stringify([...ouverts]));
    });
  });
}

const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août',
  'septembre', 'octobre', 'novembre', 'décembre'];
const MOIS_COURT = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const court = (iso) => `${+iso.slice(8, 10)} ${MOIS_COURT[+iso.slice(5, 7) - 1]}`;
const ouverts = new Set((() => {
  try { return JSON.parse(localStorage.getItem('jp2026_ech_ouverts') || '[]'); } catch { return []; }
})());

// Une ligne : la case, le titre et où ça se passe, l'échéance à droite. Tout le
// reste — photo, ce que c'est, où réserver, comment — est replié dessous. On
// balaie treize lignes d'un regard ; on n'ouvre que celle qu'on traite.
function ligneAvant(x) {
  const j = daysBetween(now, x.deadline);
  const passe = j < 0;
  const urgent = !passe && j <= 14;

  const spot = x.spotId ? SPOTS.find((s) => s.id === x.spotId) : null;
  const hotel = x.hotelId ? HOTELS.find((h) => h.id === x.hotelId) : null;
  const ville = spot ? CITIES[spot.cityId] : hotel ? CITIES[hotel.cityId] : null;
  const img = spot?.img || hotel?.images?.[0] || null;
  const maps = spot?.maps || hotel?.maps || null;

  if (x.fait) {
    return `
    <li class="ech__item ech__item--fait">
      <input type="checkbox" data-fait="${esc(x.id)}" checked aria-label="${esc(x.title)} — fait">
      <span class="ech__quoi"><s>${esc(x.title)}</s></span>
    </li>`;
  }

  // « Tokyo · pour le 11 nov. » dit déjà que c'est une réservation ; le mot
  // n'est utile que pour les démarches sans lieu.
  const meta = [
    ville?.name,
    ville ? null : x.genre,
    x.forDate ? `pour le ${court(x.forDate)}` : null,
    x.hard ? 'date ferme' : null,
    x.check ? 'à vérifier' : null,
  ].filter(Boolean).join(' · ');

  return `
  <li class="ech__item${urgent ? ' is-urgent' : ''}${passe ? ' is-passe' : ''}">
    <input type="checkbox" data-fait="${esc(x.id)}" aria-label="Marquer « ${esc(x.title)} » comme fait">
    <details class="ech__pli" data-id="${esc(x.id)}" ${ouverts.has(x.id) ? 'open' : ''}>
      <summary>
        <span class="ech__quoi">
          <b>${esc(x.title)}</b>
          <span class="mut">${esc(meta)}</span>
        </span>
        <span class="ech__quand">
          <b class="data">${passe ? 'passée' : `J−${j}`}</b>
          <span class="mut">${court(x.deadline)}</span>
        </span>
      </summary>
      <div class="ech__detail${img ? '' : ' ech__detail--nue'}">
        ${img ? `<img class="ech__shot" src="${esc(img)}" alt="" loading="lazy" decoding="async">` : ''}
        <div>
          ${spot?.blurb ? `<p class="ech__blurb">${esc(spot.blurb)}</p>` : ''}
          <p>${esc(x.what)}</p>
          ${x.tag ? `<p class="mut">${esc(x.tag)}.</p>` : ''}
          ${x.commentReserver ? `<p class="mut"><b>Comment</b> ${esc(x.commentReserver)}</p>` : ''}
          <p class="resa-item__actions">
            ${x.url ? `<a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener">${
              x.canal === 'téléphone' ? 'Voir le numéro' : x.canal ? 'Réserver' : 'Ouvrir le site officiel'}</a>` : ''}
            ${x.tel ? `<a class="btn btn--ghost" href="tel:${esc(x.tel.replace(/[^+\d]/g, ''))}">${esc(x.tel)}</a>` : ''}
            ${maps ? `<a class="btn btn--ghost" href="${esc(maps)}" target="_blank" rel="noopener">Où c'est</a>` : ''}
            ${x.forDate ? `<a class="btn btn--ghost" href="jour.html?date=${x.forDate}">La journée</a>` : ''}
          </p>
        </div>
      </div>
    </details>
  </li>`;
}

// Le même bloc sert avant et pendant : c'est sur place qu'il compte le plus.
function knowBlock() {
  return `
  <section class="section">
    <div class="shead disc"><h2>Bon à savoir</h2></div>
    <div class="know">
      ${SURPLACE.map((k) => `
        <div class="know__item${k.check ? ' know__item--check' : ''}">
          <h3>${esc(k.title)}</h3>
          <p>${esc(k.what)}</p>
          ${k.warn ? `<p class="know__warn">${esc(k.warn)}</p>` : ''}
        </div>`).join('')}
    </div>
  </section>`;
}

// --- pendant le voyage --------------------------------------------------------
function during(d) {
  const step = STEPS.find((s) => s.id === d.stepId);
  const hotel = step ? HOTELS.find((h) => h.id === step.hotelId) : null;
  const c = step ? CITIES[step.cityId] : null;
  const tomorrow = DAYS[DAYS.indexOf(d) + 1];

  // Le trajet du jour, s'il y en a un : c'est l'information qu'on veut voir en
  // premier un jour de transfert.
  const leg = SEGMENTS.find((g) => {
    const to = STEPS.find((s) => s.id === g.toStepId);
    return to && to.from === d.date;
  });
  const volDuJour = FLIGHTS.find((f) => f.date === d.date) || null;

  // Le détail de la journée — les arrêts, la carte, le parcours dans Maps — vit
  // sur jour.html. Le répéter ici obligeait à faire défiler deux fois la même
  // chose. Cette page ne garde que ce qui a une heure : le train à prendre, le
  // vol, le rendez-vous payé, le temps qu'il fait, et le lit du soir.
  return `
  <header class="section today" ${c ? `style="--c:var(--c-${c.id})"` : ''}>
    <p class="eyebrow">${formatDate(d.date, { weekday: true })} · jour ${d.n} sur ${DAYS.length}</p>
    <h1>${esc(d.title)}</h1>
    ${c ? `<p class="today__where"><span class="city-dot" style="--c:var(--c-${c.id})">${esc(c.name)}</span>
      ${step.area ? `<span class="mut">· ${esc(step.area)}</span>` : ''}</p>` : ''}
  </header>

  ${leg ? `
  <section class="section">
    <div class="alert">
      <p class="label">Aujourd'hui, on change de ville</p>
      <p class="alert__main">
        ${esc(CITIES[STEPS.find((s) => s.id === leg.fromStepId).cityId].name)}
        → ${esc(CITIES[STEPS.find((s) => s.id === leg.toStepId).cityId].name)}
      </p>
      <p class="mut">${esc(leg.label)} · <span class="data">${esc(leg.duration)}</span>
         · <span class="data">${esc(leg.pricePerPerson)}</span></p>
      ${hotel ? `<p class="alert__note">Arrivée possible <span class="data">${esc(hotel.checkIn)}</span>
        à ${esc(hotel.name)}.</p>` : ''}
    </div>
  </section>` : ''}

  ${volDuJour ? `
  <section class="section">
    <div class="shead"><h2>Le vol</h2><span class="shead__meta">${esc(volDuJour.airline)}</span></div>
    <div class="alert">
      <p class="alert__main">${esc(volDuJour.total)}</p>
      ${volDuJour.legs.map((l) => `
      <p class="mut">
        <span class="data">${esc(l.flight)}</span> ·
        ${esc(l.fromCity)} <span class="data">${esc(l.depart)}</span>
        → ${esc(l.toCity)} <span class="data">${esc(l.arrive)}</span>
        ${l.dayShift ? '<span class="mut">+1</span>' : ''}
        · ${esc(l.duration)}
      </p>`).join('')}
      ${volDuJour.layover ? `<p class="alert__note">Escale de ${esc(volDuJour.layover.duration)} à ${esc(volDuJour.layover.at)}.</p>` : ''}
    </div>
  </section>` : ''}

  ${resasForDate(d.date).length ? `
  <section class="section">
    <div class="shead"><h2>Le rendez-vous du jour</h2></div>
    ${resaStrip(d.date)}
  </section>` : ''}

  <section class="section">
    <div id="meteo-jour"></div>
  </section>

  <section class="section">
    <div class="shead">
      <h2>La journée</h2>
      <span class="shead__meta data">${d.items.length} lignes</span>
    </div>
    <div class="card cardlink">
      <a class="cardlink__in" href="jour.html?d=${d.n}">
        <span class="cardlink__texte">
          <b>${esc(d.title)}</b>
          <span class="mut">Les arrêts dans l'ordre, sur une carte, et tout le parcours
            en un lien Google Maps.</span>
        </span>
        <span class="cardlink__fleche" aria-hidden="true">›</span>
      </a>
    </div>
  </section>

  ${hotel ? `
  <section class="section">
    <div class="shead"><h2>${d.date === TRIP.end || d.n === DAYS.length ? 'Départ' : 'Ce soir'}</h2></div>
    <div class="card tonight">
      <div class="tonight__body">
        <h3>${esc(hotel.name)}</h3>
        <p class="mut">${esc(hotel.address)}</p>
        <dl class="tonight__facts">
          <div><dt>Arrivée</dt><dd class="data">${esc(hotel.checkIn)}</dd></div>
          <div><dt>Départ</dt><dd class="data">${esc(hotel.checkOut)}</dd></div>
          <div><dt>Chambre</dt><dd>${esc(hotel.room)}</dd></div>
        </dl>
        ${hotel.arrivee ? `<p class="hotel__arrivee"><b>À l'arrivée</b> ${esc(hotel.arrivee)}</p>` : ''}
        <p><a class="btn" href="${esc(hotel.maps)}" target="_blank" rel="noopener">M'y emmener</a></p>
      </div>
    </div>
  </section>` : ''}

  ${tomorrow ? `
  <section class="section">
    <div class="shead"><h2>Demain</h2><span class="shead__meta data">${formatDate(tomorrow.date)}</span></div>
    ${resaStrip(tomorrow.date)}
    <div class="card cardlink">
      <a class="cardlink__in" href="jour.html?d=${tomorrow.n}">
        <span class="cardlink__texte">
          <b>${esc(tomorrow.title)}</b>
          <span class="mut">${tomorrow.items.length} lignes de programme.</span>
        </span>
        <span class="cardlink__fleche" aria-hidden="true">›</span>
      </a>
    </div>
  </section>` : ''}

  ${knowBlock()}`;
}

// --- après le voyage ----------------------------------------------------------
function after() {
  return `
  <header class="section countdown">
    <p class="eyebrow">${formatDate(TRIP.start)} — ${formatDate(TRIP.end, { year: true })}</p>
    <h1>C'est fini</h1>
    <p class="hero__lede">
      ${TRIP.nights} nuits, ${new Set(STEPS.map((s) => s.cityId)).size} villes. Tout est encore là :
      <a href="itineraire.html">les journées</a>,
      <a href="guide.html">les adresses</a>,
      <a href="pratique.html">les chambres</a>.
    </p>
  </header>`;
}

// --- la météo -----------------------------------------------------------------
// Rendue en deux temps : la grille apparaît tout de suite avec les normales,
// puis le relevé du moment se glisse dedans. Rien ne saute, rien n'attend.
function meteoSkeleton() {
  return meteoCities().map((c) => `
    <div class="meteo__row" style="--c:var(--c-${c.id})" data-city="${c.cityId}">
      <span class="meteo__city">${esc(c.name)}</span>
      <span class="meteo__now" data-now><span class="meteo__dots" aria-hidden="true"></span></span>
      <span class="meteo__norm data">${METEO[c.cityId].max}° / ${METEO[c.cityId].min}°
        <span class="mut">en novembre</span></span>
      <span class="meteo__note mut">${esc(METEO[c.cityId].note)}</span>
    </div>`).join('');
}

async function paintMeteo() {
  const data = await fetchMeteo();
  const when = document.getElementById('meteo-when');
  if (!data) {
    document.querySelectorAll('[data-now]').forEach((el) => { el.textContent = ''; });
    if (when) when.textContent = 'relevé indisponible hors-ligne';
    return;
  }
  for (const [cityId, m] of Object.entries(data.cities)) {
    const el = document.querySelector(`[data-city="${cityId}"] [data-now]`);
    if (!el) continue;
    el.innerHTML = `<span class="meteo__icon">${m.icon}</span>
      <b class="data">${m.temp}°</b> <span class="mut">${esc(m.label)}</span>`;
    el.classList.add('is-live');
  }
  if (when) {
    when.textContent = data.fresh
      ? `relevé à ${heureJapon()} au Japon`
      : `dernier relevé connu — pas de réseau`;
  }
}

// --- une journée --------------------------------------------------------------
function dayCard(d) {
  const c = d.cityId ? CITIES[d.cityId] : null;
  return `
  <div class="card daycard" ${c ? `style="--c:var(--c-${c.id})"` : ''}>
    <ul class="day__items">
      ${d.items.map((i) => `<li${i.evening ? ' class="day__evening"' : ''}>${esc(i.text)}</li>`).join('')}
    </ul>
    ${d.tip ? `<p class="day__tip">${esc(d.tip.replace(/^💡\s*/, ''))}</p>` : ''}
  </div>`;
}

// La météo de la journée en cours, dans le mode « pendant le voyage ». Le bloc
// météo n'existait que dans le compte à rebours, où il ne sert à rien.
const cible = document.getElementById('meteo-jour');
if (cible && day && day.stepId) {
  const s = STEPS.find((x) => x.id === day.stepId);
  if (s) {
    meteoDuJour(s.cityId, jour.date).then((m) => {
      if (!m || !Number.isFinite(m.max)) return;
      const prev = m.source === 'prevision';
      cible.innerHTML = `
        <div class="shead"><h2>Le temps aujourd'hui</h2></div>
        <div class="mjour${prev ? ' mjour--prev' : ''}">
          <span class="mjour__icone" aria-hidden="true">${m.icon}</span>
          <span class="mjour__temp data"><b>${m.max}°</b> / ${m.min}°</span>
          <span class="mjour__quoi">${esc(m.label || '')}</span>
          ${m.pluie != null ? `<span class="mjour__pluie data">${m.pluie} % de pluie</span>` : ''}
          ${m.coucher ? `<span class="mjour__nuit mut">nuit à ${esc(m.coucher)}</span>` : ''}
          <span class="mjour__source mut">${prev
            ? (m.fresh ? 'prévision' : 'dernière prévision connue')
            : 'normales de novembre'}</span>
        </div>`;
    });
  }
}

// La liste des échéances est montée après coup : elle se redessine à chaque
// case cochée. L'appel vit ici, après les déclarations qu'elle utilise — plus
// haut, `faits` était encore dans sa zone morte et la liste restait vide.
renderAvant();

initReveal();
initCoverParallax();
initProgressBar();
</script>

<script>
/* Enregistrement du service worker : c'est lui qui rend le site utilisable
   sans réseau. La page Pratique pilote en plus le téléchargement des photos. */
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
