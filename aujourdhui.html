<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aujourd'hui — Japon 2026</title>
<meta name="description" content="Le programme du jour, l'hôtel du soir et le prochain train.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1512" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
<script>
/* Avant le rendu : éviter l'éclair clair quand le sombre est choisi. */
try { if (localStorage.getItem('jp2026_theme') === 'dark')
  document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
</script>
</head>
<body>

<main class="wrap" id="app"></main>

<script type="module">
import { TRIP, CITIES, STEPS, HOTELS, SEGMENTS, EXCURSIONS } from './data/trip.js';
import { SPOTS } from './data/spots.js';
import { DAYS, TEMPLATES } from './data/days.js';
import { AVANT, SURPLACE, METEO, RESERVER } from './data/pratique.js';
import { fetchMeteo, meteoCities, heureJapon } from './app/meteo.js';
import { mountChrome, initReveal, initCoverParallax, initProgressBar, esc, eur, formatDate, daysBetween, today } from './app/ui.js';
import { RESERVATIONS } from './data/trip.js';
import { resaStrip, resasForDate, resaCard } from './app/resa.js';

mountChrome('aujourdhui.html');

const now = today();
const app = document.getElementById('app');

const day = DAYS.find((d) => d.date === now);
const away = daysBetween(now, TRIP.start);

// La page a deux vies : un compte à rebours avant le départ, un compagnon de
// route pendant. Le paramètre ?date=2026-11-18 permet de voir la seconde
// sans attendre novembre.
app.innerHTML = day ? during(day) : (away > 0 ? before() : after());

// La météo arrive après le rendu : elle ne doit jamais retarder la page.
if (document.getElementById('meteo')) paintMeteo();

// --- avant le départ ----------------------------------------------------------
function before() {
  const toGo = HOTELS.filter((h) => !h.paid);

  return `
  <header class="section countdown">
    <p class="eyebrow">Départ le ${formatDate(TRIP.start, { weekday: true })}</p>
    <h1><span class="countdown__n data">J−${away}</span></h1>
    <p class="hero__lede">
      ${TRIP.nights} nuits, ${new Set(STEPS.map((s) => s.cityId)).size} villes, ${EXCURSIONS.length} excursions.
    </p>
  </header>

  ${reserverBlock()}

  <section class="section">
    <div class="shead"><h2>À faire</h2><p>Du plus lointain au plus proche du départ.</p></div>
    <ol class="todo">
      ${AVANT.map((t) => `
        <li class="todo__item">
          <div class="todo__head">
            <h3>${esc(t.title)}</h3>
            ${t.tag ? `<span class="todo__tag">${esc(t.tag)}</span>` : ''}
            <span class="todo__when">${esc(t.when)}</span>
          </div>
          <p>${esc(t.what)}</p>
          ${t.url ? `<p><a class="todo__link" href="${esc(t.url)}" target="_blank" rel="noopener">Ouvrir le site officiel</a></p>` : ''}
        </li>`).join('')}
    </ol>
  </section>

  <section class="section">
    <div class="shead"><h2>Réservations</h2></div>
    <ul class="check">
      <li class="is-done"><span aria-hidden="true">✓</span>Les ${HOTELS.length} hébergements sont confirmés</li>
      <li class="is-done"><span aria-hidden="true">✓</span>Le ryokan de Hakone est validé</li>
      <li class="is-done"><span aria-hidden="true">✓</span>Les vols sont pris — China Eastern via Shanghai</li>
      <li><span aria-hidden="true">○</span>${toGo.length} hébergements à régler sur place ou avant — ${eur(toGo.reduce((s, h) => s + h.price, 0))}</li>
    </ul>
  </section>

  <section class="section">
    <div class="shead">
      <h2>Le temps</h2>
      <p>Là-bas en ce moment, et les normales de novembre pour la valise.</p>
      <span class="shead__meta" id="meteo-when"></span>
    </div>
    <div class="meteo" id="meteo">${meteoSkeleton()}</div>
  </section>

  ${RESERVATIONS.length ? `
  <section class="section">
    <div class="shead">
      <h2>Billets datés</h2>
      <p>Payés, à une heure précise. Ce sont les seuls rendez-vous du voyage qu'on ne peut pas déplacer.</p>
    </div>
    ${RESERVATIONS.map((r) => resaCard(r, { withDate: true })).join('')}
  </section>` : ''}

  ${knowBlock()}

  <section class="section">
    <div class="shead"><h2>Premier jour</h2><span class="shead__meta data">${formatDate(DAYS[0].date)}</span></div>
    ${dayCard(DAYS[0])}
  </section>`;
}

// « Résa conseillée » sans date ne veut rien dire. Ce bloc trie par échéance et
// compte les jours qui restent : c'est la seule façon qu'une échéance soit lue
// avant d'être dépassée. Ce qui est passé reste affiché, barré — l'effacer
// donnerait l'illusion que tout va bien.
function reserverBlock() {
  const now = today();
  const items = RESERVER.slice().sort((a, b) => a.deadline.localeCompare(b.deadline));
  const restants = items.filter((r) => r.deadline >= now).length;

  return `
  <section class="section">
    <div class="shead">
      <h2>À réserver, et avant quand</h2>
      <p>Novembre est le pic des momiji : c'est la période la plus tendue de l'année au Japon.</p>
      <span class="shead__meta data">${restants} sur ${items.length}</span>
    </div>
    <ol class="todo">
      ${items.map((r) => {
        const j = daysBetween(now, r.deadline);
        const passe = j < 0;
        const urgent = !passe && j <= 14;
        // La fiche du guide fournit la photo, la description et l'adresse :
        // « réserver Rurikō-in » ne dit rien si on ne sait pas ce que c'est.
        const spot = r.spotId ? SPOTS.find((x) => x.id === r.spotId) : null;
        const hotel = r.hotelId ? HOTELS.find((x) => x.id === r.hotelId) : null;
        const ville = spot ? CITIES[spot.cityId] : hotel ? CITIES[hotel.cityId] : null;
        const img = spot?.img || hotel?.images?.[0] || null;
        const maps = spot?.maps || hotel?.maps || null;
        // `area` répète tantôt la ville (« Tokyo · tokyo »), tantôt le lieu
        // lui-même (« Rurikō-in · rurikō-in »). On ne le garde que s'il nomme
        // vraiment un quartier, et on lui remet sa majuscule.
        const brut = spot?.area || hotel?.address || null;
        const plat = (x) => (x || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        const utile = brut
          && plat(brut) !== plat(ville?.name)
          && !plat(spot?.name || hotel?.name).includes(plat(brut));
        const quartier = utile ? brut.charAt(0).toUpperCase() + brut.slice(1) : null;
        const lieu = [ville?.name, quartier].filter(Boolean).join(' · ');

        return `
        <li class="todo__item resa-item${img ? '' : ' resa-item--nue'}${passe ? ' todo__item--past' : ''}">
          ${img ? `<img class="resa-item__shot" src="${esc(img)}" alt="" loading="lazy" decoding="async">` : ''}
          <div class="resa-item__body">
            <div class="todo__head">
              <h3>${esc(r.title)}</h3>
              ${r.hard ? '<span class="todo__tag">date limite ferme</span>' : ''}
              ${r.check ? '<span class="todo__tag todo__tag--soft">à vérifier</span>' : ''}
              <span class="todo__when${urgent ? ' is-urgent' : ''}">
                ${passe ? `échéance passée (${formatDate(r.deadline)})`
                        : `avant le ${formatDate(r.deadline)} · J−${j}`}
              </span>
            </div>
            ${lieu ? `<p class="resa-item__ou mut">${esc(lieu)}</p>` : ''}
            ${spot?.blurb ? `<p class="resa-item__quoi">${esc(spot.blurb)}</p>` : ''}
            <p>${esc(r.what)}</p>
            ${spot ? `<p class="mut resa-item__prat">
              ${[spot.duration, spot.budget, spot.when].filter((x) => x && x !== '—').map(esc).join(' · ')}
            </p>` : ''}
            ${r.forDate ? `<p class="mut">Pour la journée du ${formatDate(r.forDate, { weekday: true })}.</p>` : ''}
            <p class="resa-item__actions">
              ${r.url ? `<a class="btn" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.canal === 'téléphone' ? 'Voir le numéro' : 'Réserver')}</a>` : ''}
              ${r.tel ? `<a class="btn btn--ghost" href="tel:${esc(r.tel.replace(/[^+\d]/g, ''))}">${esc(r.tel)}</a>` : ''}
              ${maps ? `<a class="btn btn--ghost" href="${esc(maps)}" target="_blank" rel="noopener">Où c'est</a>` : ''}
            </p>
            ${r.commentReserver ? `<p class="resa-item__comment mut">${esc(r.commentReserver)}</p>` : ''}
          </div>
        </li>`;
      }).join('')}
    </ol>
  </section>`;
}

// Le même bloc sert avant et pendant : c'est sur place qu'il compte le plus.
function knowBlock() {
  return `
  <section class="section">
    <div class="shead disc"><h2>Bon à savoir</h2></div>
    <div class="know">
      ${SURPLACE.map((k) => `
        <div class="know__item${k.check ? ' know__item--check' : ''}">
          <h3>${esc(k.title)}</h3>
          <p>${esc(k.what)}</p>
          ${k.warn ? `<p class="know__warn">${esc(k.warn)}</p>` : ''}
        </div>`).join('')}
    </div>
  </section>`;
}

// --- pendant le voyage --------------------------------------------------------
function during(d) {
  const step = STEPS.find((s) => s.id === d.stepId);
  const hotel = step ? HOTELS.find((h) => h.id === step.hotelId) : null;
  const c = step ? CITIES[step.cityId] : null;
  const tomorrow = DAYS[DAYS.indexOf(d) + 1];

  // Le trajet à prendre aujourd'hui, s'il y en a un : c'est l'information
  // qu'on veut voir en premier un jour de transfert.
  const leg = SEGMENTS.find((g) => {
    const to = STEPS.find((s) => s.id === g.toStepId);
    return to && to.from === d.date;
  });

  const lastDay = d.date === TRIP.end || d.n === DAYS.length;

  return `
  <header class="section today" ${c ? `style="--c:${c.color}"` : ''}>
    <p class="eyebrow">${formatDate(d.date, { weekday: true })} · jour ${d.n} sur ${DAYS.length}</p>
    <h1>${esc(d.title)}</h1>
    ${c ? `<p class="today__where"><span class="city-dot" style="--c:${c.color}">${esc(c.name)}</span>
      ${step.area ? `<span class="mut">· ${esc(step.area)}</span>` : ''}</p>` : ''}
  </header>

  ${leg ? `
  <section class="section">
    <div class="alert">
      <p class="label">Aujourd'hui, on change de ville</p>
      <p class="alert__main">
        ${esc(CITIES[STEPS.find((s) => s.id === leg.fromStepId).cityId].name)}
        → ${esc(CITIES[STEPS.find((s) => s.id === leg.toStepId).cityId].name)}
      </p>
      <p class="mut">${esc(leg.label)} · <span class="data">${esc(leg.duration)}</span>
         · <span class="data">${esc(leg.pricePerPerson)}</span></p>
      ${hotel ? `<p class="alert__note">Arrivée possible <span class="data">${esc(hotel.checkIn)}</span>
        à ${esc(hotel.name)}.</p>` : ''}
    </div>
  </section>` : ''}

  ${resasForDate(d.date).length ? `
  <section class="section">
    <div class="shead"><h2>Le rendez-vous du jour</h2></div>
    ${resaStrip(d.date)}
  </section>` : ''}

  <section class="section">
    <div class="shead"><h2>Programme</h2></div>
    ${dayCard(d)}
  </section>

  ${hotel ? `
  <section class="section">
    <div class="shead"><h2>${lastDay ? 'Départ' : 'Ce soir'}</h2></div>
    <div class="card tonight">
      <div class="tonight__body">
        <h3>${esc(hotel.name)}</h3>
        <p class="mut">${esc(hotel.address)}</p>
        <dl class="tonight__facts">
          <div><dt>Arrivée</dt><dd class="data">${esc(hotel.checkIn)}</dd></div>
          <div><dt>Départ</dt><dd class="data">${esc(hotel.checkOut)}</dd></div>
          <div><dt>Chambre</dt><dd>${esc(hotel.room)}</dd></div>
        </dl>
        <p><a class="btn" href="${esc(hotel.maps)}" target="_blank" rel="noopener">M'y emmener</a></p>
      </div>
    </div>
  </section>` : ''}

  ${tomorrow ? `
  <section class="section">
    <div class="shead"><h2>Demain</h2><span class="shead__meta data">${formatDate(tomorrow.date)}</span></div>
    ${resaStrip(tomorrow.date)}
    ${dayCard(tomorrow)}
  </section>` : ''}

  ${knowBlock()}

  <section class="section">
    <p><a class="btn btn--ghost" href="itineraire.html#jour-${d.n}">Voir tout l'itinéraire</a></p>
  </section>`;
}

// --- après le voyage ----------------------------------------------------------
function after() {
  return `
  <header class="section countdown">
    <p class="eyebrow">${formatDate(TRIP.start)} — ${formatDate(TRIP.end, { year: true })}</p>
    <h1>C'est fini</h1>
    <p class="hero__lede">
      ${TRIP.nights} nuits, ${new Set(STEPS.map((s) => s.cityId)).size} villes. Tout est encore là :
      <a href="itineraire.html">les journées</a>,
      <a href="guide.html">les adresses</a>,
      <a href="pratique.html">les chambres</a>.
    </p>
  </header>`;
}

// --- la météo -----------------------------------------------------------------
// Rendue en deux temps : la grille apparaît tout de suite avec les normales,
// puis le relevé du moment se glisse dedans. Rien ne saute, rien n'attend.
function meteoSkeleton() {
  return meteoCities().map((c) => `
    <div class="meteo__row" style="--c:${c.color}" data-city="${c.cityId}">
      <span class="meteo__city">${esc(c.name)}</span>
      <span class="meteo__now" data-now><span class="meteo__dots" aria-hidden="true"></span></span>
      <span class="meteo__norm data">${METEO[c.cityId].max}° / ${METEO[c.cityId].min}°
        <span class="mut">en novembre</span></span>
      <span class="meteo__note mut">${esc(METEO[c.cityId].note)}</span>
    </div>`).join('');
}

async function paintMeteo() {
  const data = await fetchMeteo();
  const when = document.getElementById('meteo-when');
  if (!data) {
    document.querySelectorAll('[data-now]').forEach((el) => { el.textContent = ''; });
    if (when) when.textContent = 'relevé indisponible hors-ligne';
    return;
  }
  for (const [cityId, m] of Object.entries(data.cities)) {
    const el = document.querySelector(`[data-city="${cityId}"] [data-now]`);
    if (!el) continue;
    el.innerHTML = `<span class="meteo__icon">${m.icon}</span>
      <b class="data">${m.temp}°</b> <span class="mut">${esc(m.label)}</span>`;
    el.classList.add('is-live');
  }
  if (when) {
    when.textContent = data.fresh
      ? `relevé à ${heureJapon()} au Japon`
      : `dernier relevé connu — pas de réseau`;
  }
}

// --- une journée --------------------------------------------------------------
function dayCard(d) {
  const c = d.cityId ? CITIES[d.cityId] : null;
  return `
  <div class="card daycard" ${c ? `style="--c:${c.color}"` : ''}>
    <ul class="day__items">
      ${d.items.map((i) => `<li${i.evening ? ' class="day__evening"' : ''}>${esc(i.text)}</li>`).join('')}
    </ul>
    ${d.tip ? `<p class="day__tip">${esc(d.tip.replace(/^💡\s*/, ''))}</p>` : ''}
  </div>`;
}

initReveal();
initCoverParallax();
initProgressBar();
</script>

<script>
/* Enregistrement du service worker : c'est lui qui rend le site utilisable
   sans réseau. La page Pratique pilote en plus le téléchargement des photos. */
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
