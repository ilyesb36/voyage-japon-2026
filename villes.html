<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les villes — Japon 2026</title>
<meta name="description" content="Une page par étape : où vous êtes, les quartiers à voir, à faire et à manger, les fêtes datées, l'hôtel et les plans B.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1512" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Japon 2026">
<link rel="stylesheet" href="app.css">
<script>
/* Avant le rendu : éviter l'éclair clair quand le sombre est choisi. */
try { if (localStorage.getItem('jp2026_theme') === 'dark')
  document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
</script>
</head>
<body>

<header class="cover cover--short">
  <img class="cover__img" id="cover-img" src="img/hero/ouverture.webp" alt="" fetchpriority="high">
  <div class="cover__text wrap">
    <h1 id="titre">Les villes</h1>
    <p class="cover__dates" id="cover-sub"></p>
  </div>
</header>

<main class="wrap villes">
  <nav class="chipbar ptabs" id="etapes" aria-label="Choisir une étape"></nav>
  <section class="section" id="ou">
    <button class="btn" id="ou-btn" type="button">Où suis-je ?</button>
    <p class="mut" id="ou-msg" aria-live="polite"></p>
  </section>
  <p class="hero__lede" id="lede"></p>
  <p class="mut villes__arb" id="arbitrage" hidden></p>
  <section class="section" id="manger">
    <div class="shead"><h2 id="manger-titre">Ce qu'on mange ici</h2><p>Les spécialités de la ville, à goûter.</p></div>
    <div class="qbloc__defil" id="plats"></div>
  </section>
  <section class="section" id="evenements" hidden>
    <div class="shead"><h2>Pendant votre séjour</h2><p>Fêtes et illuminations datées. <a href="itineraire.html?onglet=fetes">Toutes les fêtes du voyage</a></p></div>
    <div class="qbloc__defil" id="events"></div>
  </section>
  <section class="section" id="quartiers">
    <div class="shead"><h2>Les quartiers</h2><p>Ce qui se fait à pied, regroupé. <span class="etoile">★</span> incontournable</p></div>
    <nav class="chipbar qnav" id="qnav" aria-label="Aller à un quartier"></nav>
    <div class="qblocs" id="qcards"></div>
  </section>
  <section class="section" id="hotel"></section>
  <section class="section" id="types">
    <details class="vplans">
      <summary><span class="vplans__txt"><span class="vplans__nom">Plans B</span> <span class="mut">si le programme tombe à l'eau</span></span></summary>
      <div class="vtypes" id="tpls"></div>
    </details>
  </section>
  <p class="more" id="biblio"></p>
</main>

<dialog class="tpldlg" id="fiche"><div class="tpldlg__in"><button class="tpldlg__x" id="fiche-x" aria-label="Fermer">&times;</button><div id="fiche-body"></div></div></dialog>

<script type="module">
import { CITIES, STEPS, HOTELS } from './data/trip.js';
import { TEMPLATES } from './data/days.js';
import { SPOTS } from './data/spots.js';
import { SELECTION } from './data/selection.js';
import { DELICES } from './data/delices.js';
import { mountChrome, esc, today, moment, formatDate } from './app/ui.js';
import { quartiersOrdonnes, blocQuartierHTML, maPosition, ouSuisJe, ficheExtra } from './app/quartiers.js';

// Une page par étape : on y trouve son quartier (« Où suis-je ? »), ce qu'il y a
// à voir, à faire et à manger autour, et les fêtes datées. Les plats et les tables
// sont sur table.html, l'adresse de l'hôtel sur secours.html, les jours sur jour.html.
mountChrome('villes.html');
var q = function (id) { return document.getElementById(id); };
var HERO = { tokyo: 'img/hero/tokyo.webp', kanazawa: 'img/hero/kanazawa.webp', kyoto: 'img/hero/kyoto.webp', osaka: 'img/hero/osaka.webp', hakone: 'img/hero/hakone.webp' };
var byId = new Map(SPOTS.map(function (s) { return [s.id, s]; }));

// L'étape du jour, ou null hors du séjour. `cityId` : seulement si elle est dans cette ville.
// Le 2 déc., jour du vol, la dernière étape est déjà finie d'après ses dates : on la garde, on y a dormi.
var now = today();
function etapeDuJour(cityId) {
  var s = STEPS.find(function (x) { return now >= x.from && now < x.to; }) || (moment() === 'pendant' ? STEPS[STEPS.length - 1] : null);
  return s && (!cityId || s.cityId === cityId) ? s : null;
}

// Quelle étape ? ?e=3, sinon celle du jour pendant le voyage, sinon la première.
var par = parseInt(new URLSearchParams(location.search).get('e'), 10);
var step = STEPS.find(function (s) { return s.n === par; }) || etapeDuJour() || STEPS[0];
var city = CITIES[step.cityId];
var sel = SELECTION.find(function (x) { return x.step === step.n; }) || { picks: [] };
var hotel = HOTELS.find(function (h) { return h.id === step.hotelId; });
var titre = city.name + (step.cityId === 'tokyo' ? ' · ' + step.area : '');
// Le libellé suit le moment : on découvre « Les villes » avant le départ, on cherche « Autour de moi » sur place.
document.title = `${titre} — ${moment() === 'pendant' ? 'Autour de moi' : 'Les villes'} · Japon 2026`;
document.documentElement.style.setProperty('--c', 'var(--c-' + city.id + ')');

// --- en-tête ------------------------------------------------------------------
q('cover-img').src = step.n === 6 ? 'img/hero/tokyo2.webp' : (HERO[step.cityId] || 'img/hero/ouverture.webp');
q('cover-img').alt = city.name;
q('titre').textContent = titre;
q('cover-sub').textContent = step.label + ' · ' + step.nights + ' nuit' + (step.nights > 1 ? 's' : '');
q('etapes').innerHTML = STEPS.map(function (s) {
  var c = CITIES[s.cityId];
  return '<a class="chip" href="villes.html?e=' + s.n + '" aria-pressed="' + (s.n === step.n) + '"><span class="chip__dot" style="background:var(--c-' + c.id + ')"></span>' + esc(c.name + (s.cityId === 'tokyo' ? ' · ' + s.area : '')) + '</a>';
}).join('');
q('lede').textContent = sel.intro || '';
// Ce qu'on laisse de côté à cette étape, et pourquoi : une ligne discrète sous le chapeau.
q('arbitrage').textContent = sel.arbitrage || '';
q('arbitrage').hidden = !sel.arbitrage;

// --- les plats de la ville : la photo, sinon l'emoji (data/delices.js) -------------
var plats = (DELICES.find(function (g) { return g.cityId === step.cityId; }) || { items: [] }).items;
q('manger-titre').textContent = "Ce qu'on mange " + (city.id === 'hakone' ? 'à Hakone' : 'à ' + city.name);
q('plats').innerHTML = plats.map(function (p) {
  return '<div class="qph qph--plat">' +
    (p.img ? '<img class="qph__img" src="' + esc(p.img) + '" alt="" loading="lazy" decoding="async">' : '<span class="qph__img qph__img--nue" aria-hidden="true">' + esc(p.e || '') + '</span>') +
    '<span class="qph__nom">' + esc(p.n) + (p.jp ? ' <span class="qbloc__jp" lang="ja">' + esc(p.jp) + '</span>' : '') + '</span>' +
    '<span class="qph__why">' + esc(p.d || '') + '</span></div>';
}).join('') + '<a class="qph qph--plus" href="table.html?ville=' + esc(city.id) + '">Les bonnes tables de ' + esc(city.name) + ' →</a>';
if (!plats.length) q('manger').hidden = true;

// --- les fêtes de l'étape : le champ `etape` de data/spots.js ------------------------
var court = function (iso) { return formatDate(iso, { weekday: true }).replace(/^(\S{3})\S*/, '$1.').replace(/ (novembre|décembre)/, function (m, p) { return ' ' + p.slice(0, 3) + '.'; }); };
var evs = SPOTS.filter(function (s) { return s.kind === 'event' && s.etape === step.n; })
  .sort(function (a, b) { return ((a.jours || [])[0] || a.du || '').localeCompare((b.jours || [])[0] || b.du || ''); });
if (evs.length) {
  q('evenements').hidden = false;
  q('events').innerHTML = evs.map(function (s) {
    return '<button class="qph qph--fete" type="button" data-fiche="' + esc(s.id) + '">' +
      (s.img ? '<img class="qph__img" src="' + esc(s.img) + '" alt="" loading="lazy" decoding="async">' : '') +
      '<span class="qph__date">' + esc((s.jours || []).map(court).join(' · ') || 'selon vos soirs') + '</span>' +
      '<span class="qph__nom">' + esc(s.name) + (s.confirme === false ? ' <span class="fete__statut">à confirmer</span>' : '') + '</span>' +
      '<span class="qph__why">' + esc([s.horaires, s.budget].filter(Boolean).join(' · ')) + '</span></button>';
  }).join('');
}

// --- les quartiers, ouverts, dans l'ordre du programme ---------------------------
// Les incontournables de l'étape (SELECTION) ne sont plus une liste : ils portent une étoile.
const etoiles = new Set(sel.picks.map((p) => p.id));
const quartiers = quartiersOrdonnes(step);
q('qnav').innerHTML = quartiers.map((e) => `<a class="chip" href="#q-${esc(e.q.id)}">${esc(e.q.nom.split(/ [:–] | et /)[0])}</a>`).join('');
q('qcards').innerHTML = quartiers.map((e) => blocQuartierHTML(e, { etoiles, hotel })).join('');

// --- l'hôtel de l'étape : une ligne, tout le reste est dans Secours --------------
if (hotel) {
  q('hotel').innerHTML = `<p><span><span class="label">Hôtel</span> <b>${esc(hotel.name)}</b></span> <a href="secours.html#h-${esc(hotel.id)}">adresse, téléphone, arrivée</a></p>`;
} else {
  q('hotel').hidden = true;
}

// --- plans B : les journées type de la ville --------------------------------------
var tpls = TEMPLATES.filter(function (t) { return t.cityId === step.cityId; });
q('tpls').innerHTML = tpls.map(function (t) {
  return '<a class="vtype" href="itineraire.html?onglet=types#' + esc(t.id) + '"><b>' + esc(t.title) + '</b><span class="mut">' + esc(t.sub) + ' · ' + t.steps.length + ' étapes</span></a>';
}).join('');
if (!tpls.length) q('types').hidden = true;
var nAdr = SPOTS.filter(function (s) { return s.cityId === step.cityId; }).length;
q('biblio').innerHTML = '<a class="btn btn--ghost" href="guide.html?ville=' + step.cityId + '">Toutes les adresses ' + (/^[AEIOUH]/.test(city.name) ? "d'" : 'de ') + esc(city.name) + ' dans le guide (' + nAdr + ') →</a>';

// --- arriver par une ancre --------------------------------------------------------
// #table visait l'ancienne section « À table » : elle vit maintenant sur sa page.
if (location.hash === '#table') location.replace(`table.html?ville=${city.id}`);
// La page défile en douceur (scroll-behavior), et « auto » s'y plie : au chargement cette
// animation part du haut et peut se faire couper, donc on demande « instant ».
const ouvrirQuartier = (id) => {
  const d = document.getElementById('q-' + id);
  if (!d) return false;
  d.scrollIntoView({ behavior: 'instant', block: 'start' });
  return true;
};
if (location.hash.startsWith('#q-')) ouvrirQuartier(location.hash.slice(3));

// --- « Où suis-je ? » ---------------------------------------------------------------
// Tout est calculé sur le téléphone, la position ne quitte jamais l'appareil.
q('ou-btn').addEventListener('click', async () => {
  const msg = q('ou-msg');
  msg.textContent = 'Je cherche votre position…';
  // Seule la position peut échouer « normalement » : une erreur de code plus bas ne doit pas
  // passer pour un refus de localisation.
  let pos;
  try {
    pos = await maPosition();
  } catch (e) {
    msg.textContent = e && e.code === 3   // 3 : le délai est dépassé (9 s), les Réglages n'y sont pour rien
      ? `La position met trop de temps à arriver. Réessayez, si possible à l'air libre.`
      : 'Position indisponible. Sur iPhone : Réglages › Confidentialité › Service de localisation › Sites Safari. Sinon, ouvrez le quartier dans la liste ci-dessous.';
    return;
  }
  const r = ouSuisJe(pos);           // toutes villes : on peut être ailleurs que la page affichée
  const qd = r.quartier;
  if (!qd) { msg.textContent = `Aucun quartier repéré autour de vous. Choisissez l'étape où vous êtes, ou cherchez avec la loupe.`; return; }
  if (qd.cityId !== city.id) {
    // L'étape du jour si elle est dans cette ville, sinon la première de la ville.
    const cible = etapeDuJour(qd.cityId) || STEPS.find((s) => s.cityId === qd.cityId);
    msg.textContent = `Vous êtes à ${CITIES[qd.cityId].name} : j'ouvre l'étape.`;
    location.href = `villes.html?e=${cible.n}#q-${qd.id}`;
    return;
  }
  ouvrirQuartier(qd.id);
  msg.textContent = r.type === 'dans' ? `Vous êtes dans le quartier ${qd.nom}.` : `Vous êtes près de ${r.spot.name}, quartier ${qd.nom}.`;
});

// --- la fiche d'une adresse -----------------------------------------------------
var dlg = q('fiche');
function ouvrir(id) {
  var s = byId.get(id); if (!s) return;
  var why = (sel.picks.find(function (p) { return p.id === id; }) || {}).why;
  q('fiche-body').innerHTML = (s.img ? '<img class="tpldlg__img" src="' + esc(s.img) + '" alt="">' : '') +
    '<p class="tpldlg__kicker">' + esc(city.name) + (s.area && s.area.toLowerCase() !== city.id ? ' · ' + esc(s.area) : '') + '</p><div class="tpldlg__head"><h3>' + esc(s.name) + '</h3><p class="mut">' + esc(s.blurb || '') + '</p></div>' +
    (why ? '<p class="fiche__why">' + esc(why) + '</p>' : '') + (s.lore ? '<p class="fiche__lore">' + esc(s.lore) + '</p>' : '') +
    '<dl class="fiche__facts">' + [['Durée', s.duration], ['Budget', s.budget], ['Le bon moment', s.when]].filter(function (x) { return x[1] && x[1] !== '—'; }).map(function (x) { return '<div><dt>' + x[0] + '</dt><dd>' + esc(x[1]) + '</dd></div>'; }).join('') + '</dl>' +
    ficheExtra(s, hotel) +
    (s.maps ? '<p class="tpldlg__links"><a class="btn" href="' + esc(s.maps) + '" target="_blank" rel="noopener">Ouvrir dans Google Maps</a></p>' : '');
  dlg.showModal();
}
document.addEventListener('click', function (e) { var b = e.target.closest('.sel__item, [data-fiche]'); if (b) ouvrir(b.dataset.id || b.dataset.fiche); });
q('fiche-x').addEventListener('click', function () { dlg.close(); });
dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
if (location.hash) requestAnimationFrame(function () { var t = document.querySelector(location.hash); if (t) t.scrollIntoView({ behavior: 'instant', block: 'start' }); });
</script>
</body>
</html>
