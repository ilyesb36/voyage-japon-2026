<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La journée — Japon 2026</title>
<meta name="description" content="Une journée à la fois : les arrêts dans l'ordre, la carte en regard, et tout le parcours en un lien.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1512" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Japon 2026">
<link rel="stylesheet" href="app.css">
<script>
/* Avant le rendu : éviter l'éclair clair quand le sombre est choisi. */
try { if (localStorage.getItem('jp2026_theme') === 'dark')
  document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
</script>
<script src="vendor/leaflet.js"></script>
</head>
<body>

<main class="wrap jour">
  <!-- Le calendrier d'abord : on choisit sa journée en un clic, pas en treize
       appuis sur « jour suivant ». -->
  <div class="cal" id="cal"></div>

  <header class="jour__tete" id="tete"></header>

  <!-- Dans l'ordre où l'on en a besoin : la barre « Ce soir » (rentrer, montrer
       l'adresse, appeler), ce qu'il ne faut pas manquer, le trajet du jour. -->
  <div id="soir"></div>
  <div id="resa"></div>
  <div id="trajet"></div>

  <!-- Le parcours vient avant la carte dans le document : sur téléphone la carte
       passe donc dessous, et sur grand écran la grille la range dans la colonne
       de droite, à côté de la liste. -->
  <div class="jour__grille">
    <div class="jour__corps">
      <div id="parcours"></div>
    </div>

    <aside class="jour__aside">
      <div class="jour__sticky">
        <div id="map" class="map map--jour"></div>
        <p class="jour__carteMeta mut" id="carte-meta"></p>
        <div class="jour__actions" id="go"></div>
        <div id="meteo"></div>
      </div>
    </aside>
  </div>
</main>

<script type="module">
import { CITIES, STEPS, HOTELS, SEGMENTS, FLIGHTS } from './data/trip.js';
import { DAYS } from './data/days.js';
import { TRAJETS as VALISES } from './data/valises.js';
import { PASSES, PROGRAMME } from './data/passes.js';
import { LIEUX } from './data/lieux.js';
import { mountChrome, esc, formatDate, daysBetween, today } from './app/ui.js';
import { resaStrip, reservationsDuJour, echeancesAVenir, ETAT } from './app/resa.js';
import { createMap } from './app/map.js';
import { meteoDuJour } from './app/meteo.js';
import { montreChauffeur, lienRentrer } from './app/quartiers.js';

mountChrome('jour.html');
const q = (id) => document.getElementById(id);

// Les mots japonais d'une phrase portent lang="ja" : le téléphone choisit alors les
// bons caractères (le nom lu sur un bus doit ressembler à celui du bus).
const avecJp = (t) => esc(t).replace(/[぀-ヿ㐀-鿿＀-￯]+/g, (m) => `<span lang="ja">${m}</span>`);

// --- quelle journée ? ---------------------------------------------------------
const url = new URLSearchParams(location.search);
const parNum = DAYS.find((d) => String(d.n) === url.get('d'));
const parDate = DAYS.find((d) => d.date === url.get('date'));
const duJour = DAYS.find((d) => d.date === today());
// Sans paramètre et hors voyage, on ouvre la première journée qui a des arrêts
// situés — pas le vol Paris → Shanghai, qui ne montre qu'une ligne. Une fois
// le voyage fini (le 3 décembre, on atterrit), c'est la dernière journée.
const premiereSituee = DAYS.find((d) => d.items.some((i) => i.lieux)) || DAYS[0];
const demande = url.get('date') || today();
const apres = demande > DAYS[DAYS.length - 1].date ? DAYS[DAYS.length - 1] : null;
const jour = parNum || parDate || duJour || apres || premiereSituee;

const step = STEPS.find((s) => s.id === jour.stepId);
const ville = step ? CITIES[step.cityId] : null;
const hotel = step ? HOTELS.find((h) => h.id === step.hotelId) : null;

document.title = `${jour.title} — ${formatDate(jour.date)} · Japon 2026`;

// --- le calendrier ------------------------------------------------------------
// Du 8 novembre au 2 décembre, en semaines qui commencent le lundi. Les cases
// hors voyage restent visibles mais éteintes : voir où le voyage s'inscrit dans
// le mois vaut mieux qu'une liste de 25 boutons.
const JOURS_SEM = ['lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'];
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet',
              'août', 'septembre', 'octobre', 'novembre', 'décembre'];

const isoDe = (d) => d.toISOString().slice(0, 10);
const lundiAvant = (dateIso) => {
  const d = new Date(`${dateIso}T00:00:00Z`);
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
  return d;
};

const cases = [];
{
  const curseur = lundiAvant(DAYS[0].date);
  const fin = new Date(`${DAYS[DAYS.length - 1].date}T00:00:00Z`);
  while (curseur <= fin || cases.length % 7 !== 0) {
    cases.push(isoDe(curseur));
    curseur.setUTCDate(curseur.getUTCDate() + 1);
    if (cases.length > 60) break;                  // garde-fou
  }
}

const parJourDate = new Map(DAYS.map((d) => [d.date, d]));
const villeDe = (d) => {
  const s = STEPS.find((x) => x.id === d.stepId);
  return s ? CITIES[s.cityId] : null;
};

// Sur téléphone, la grille mangeait un tiers du premier écran alors qu'on ne
// s'en sert qu'au moment de changer de jour. Elle se replie donc derrière la
// date courante, et reste dépliée sur grand écran, où la place ne manque pas.
const large = matchMedia('(min-width: 700px)').matches;

q('cal').innerHTML = `
  <details class="cal__pli"${large ? ' open' : ''}>
    <summary class="cal__resume">
      <span class="cal__resumeDate">
        <b>${esc(formatDate(jour.date, { weekday: true }))}</b>
        <span class="mut">· jour ${jour.n} sur ${DAYS.length}</span>
      </span>
      <span class="cal__resumeAction">Changer de jour</span>
    </summary>
  <div class="cal__tete">
    <b class="cal__titre">${MOIS[+cases[0].slice(5, 7) - 1]} — ${MOIS[+cases[cases.length - 1].slice(5, 7) - 1]} 2026</b>
    <span class="cal__legende">
      ${Object.entries(CITIES).map(([, c]) => `
        <span class="cal__pastille" style="--c:var(--c-${c.id})">${esc(c.name)}</span>`).join('')}
    </span>
  </div>
  <div class="cal__grille" role="group" aria-label="Choisir une journée">
    ${JOURS_SEM.map((j) => `<span class="cal__jsem" aria-hidden="true">${j}</span>`).join('')}
    ${cases.map((date) => {
      const d = parJourDate.get(date);
      const num = +date.slice(8, 10);
      if (!d) return `<span class="cal__case cal__case--hors" aria-hidden="true">${num}</span>`;
      const c = villeDe(d);
      const actif = date === jour.date;
      return `
      <a class="cal__case${actif ? ' is-actif' : ''}${date < today() ? ' is-passe' : ''}"
         href="?d=${d.n}" style="--c:${c ? `var(--c-${c.id})` : 'var(--mut)'}"
         ${actif ? 'aria-current="date"' : ''}
         title="${esc(formatDate(date, { weekday: true }))} — ${esc(d.title)}">
        <b>${num}</b>
        <span class="cal__ville">${c ? esc(c.name.slice(0, 3)) : '✈'}</span>
      </a>`;
    }).join('')}
  </div>
  </details>`;

// --- en-tête ------------------------------------------------------------------
const KIND = { transfert: 'Transfert', vol: 'Vol', etape: null };
q('tete').innerHTML = `
  <p class="eyebrow">Jour ${jour.n} sur ${DAYS.length} · ${esc(formatDate(jour.date, { weekday: true }))}</p>
  <h1>${esc(jour.title)}</h1>
  ${ville ? `<p class="jour__ou">
    <span class="city-dot" style="--c:var(--c-${ville.id})">${esc(ville.name)}</span>
    ${step.area ? `<span class="mut">· ${esc(step.area)}</span>` : ''}
    ${KIND[jour.kind] ? `<span class="day__kind">${KIND[jour.kind]}</span>` : ''}
  </p>` : ''}`;

// --- la barre « Ce soir » ------------------------------------------------------
// Ce qu'on cherche fatigué ou perdu : rentrer, montrer l'adresse, appeler.
// Le jour du départ, c'est le vol qui compte. Le 8 novembre (le vol aller), la
// journée n'a pas d'étape : pas d'hôtel, donc pas de barre.
const retour = FLIGHTS.find((f) => f.id === 'retour');
const estDepart = retour && jour.date === retour.date;
const arriveeDuJour = hotel && step && step.from === jour.date;
const teinte = ville ? `var(--c-${ville.id})` : 'var(--mut)';   // la couleur de la ville, comme au calendrier
if (estDepart) {
  const leg = retour.legs[0];
  q('soir').innerHTML = `<section class="soir soir--depart" style="--c:${teinte}" aria-label="Départ">
    <p class="soir__titre"><span class="label">Départ</span> ${esc(leg.flight)} à <span class="data">${esc(leg.depart)}</span>, Haneda terminal 3</p>
    <p class="soir__actions">
      <a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent('Haneda Airport Terminal 3')}&travelmode=transit" target="_blank" rel="noopener">Y aller</a>
      <a class="btn btn--ghost" href="valises.html#t6">Les valises du départ</a>
    </p></section>`;
} else if (hotel) {
  // Sous le nom du logement, une ligne d'accès : la gare la plus proche (`hotel.gare`,
  // avec le temps à pied) ; à défaut, la première partie de `access` (avant « · »), le
  // quartier ou le repère le plus proche. Plus longue que ACCES_MAX caractères, ce n'est
  // plus une ligne courte : on s'en passe.
  const ACCES_MAX = 70;
  const acces = (hotel.gare || (hotel.access || '').split(' · ')[0]).trim();

  // Le jour d'arrivée dans un logement, les consignes sont dépliées. checkIn
  // s'écrit « 15:00 – 19:00 » ou « à partir de 16:00 ». Une plage se lisait comme
  // un couvre-feu (« Arrivée : 16:00 – 00:00 ») : on dit qu'elle est possible, de
  // l'heure d'ouverture à l'heure limite, et minuit s'écrit « minuit ». Une forme
  // inconnue garde l'ancienne tournure, citée telle quelle.
  const ci = hotel.checkIn || '';
  const plage = /^(\d{1,2}:\d{2})\s*[–-]\s*(\d{1,2}:\d{2})$/.exec(ci);
  const arriveeTitre = plage ? `Arrivée possible de ${plage[1]} à ${plage[2] === '00:00' ? 'minuit' : plage[2]}`
    : /^à partir de /.test(ci) ? `Arrivée possible ${ci}`
    : `Arrivée : ${ci}`;

  q('soir').innerHTML = `<section class="soir" style="--c:${teinte}" aria-label="Ce soir">
    <p class="soir__titre"><span class="label">Ce soir</span> ${esc(hotel.name)}</p>
    ${acces && acces.length <= ACCES_MAX ? `<p class="soir__acces mut">${esc(acces)}</p>` : ''}
    <p class="soir__actions">
      <a class="btn" href="${esc(lienRentrer(hotel))}" target="_blank" rel="noopener">Y aller</a>
      <button class="btn btn--ghost" type="button" id="chauffeur-btn">Montrer au chauffeur</button>
      ${hotel.tel
        ? `<a class="btn btn--ghost" href="tel:${esc(hotel.tel.replace(/[^+\d]/g, ''))}">Appeler</a>`
        : '<span class="mut soir__sanstel">Pas de téléphone : messagerie Booking</span>'}
    </p>
    ${arriveeDuJour && hotel.arrivee ? `<details class="soir__arrivee" open><summary>${esc(arriveeTitre)}</summary><p>${esc(hotel.arrivee)}</p>${hotel.meals ? `<p class="mut">Repas : ${esc(hotel.meals)}</p>` : ''}</details>` : ''}
  </section>`;
  q('chauffeur-btn').addEventListener('click', () => montreChauffeur(hotel));
}

// --- à ne pas manquer -----------------------------------------------------------
// Les rendez-vous à heure fixe du jour, avec leur état, et les échéances qui
// tombent ce jour-là. Un billet payé garde sa grande carte, en tête (resaStrip) :
// la liste reprend le reste, puis deux rappels sans heure : le pass du jour (et,
// à Hakone, la règle des bus) et, la veille d'un changement de ville, les valises.
const resas = reservationsDuJour(jour.date);
const duJourMeme = echeancesAVenir(jour.date).filter((x) => x.deadline === jour.date);
// « aujourd'hui » seulement si l'on regarde la journée en cours : en parcourant
// les jours à l'avance, ce serait faux.
const quand = jour.date === today() ? "aujourd'hui" : 'ce jour-là';

// Le pass du jour : PROGRAMME dit les jours qu'un pass couvre (12, 25, 26, 27 nov.).
const progPass = PROGRAMME.find((d) => d.date === jour.date);
const passDuJour = progPass && PASSES.find((p) => p.id === progPass.passId);
// La veille d'un changement de ville : le trajet de valises (TRAJETS) qui a lieu demain.
const nomDe = (hotelId) => CITIES[HOTELS.find((h) => h.id === hotelId).cityId].name;
const trajetDemain = VALISES.find((t) => daysBetween(jour.date, t.date) === 1);

const lignesAmanquer = [
  // Sans heure (une table sans créneau), pas de « — » devant le nom.
  ...resas.filter((r) => r.etat !== 'paye').map((r) => `<li class="amanquer__item amanquer__item--${r.etat}">
      ${r.heure ? `<span class="data">${esc(r.heure)}</span> ` : ''}${esc(r.titre)} <span class="label">${ETAT[r.etat]}</span>
      ${r.etat === 'a-reserver' && r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">en ligne</a>` : ''}</li>`),
  // L'ancre #e-<id> est posée par la page À faire sur la ligne de la démarche.
  ...duJourMeme.map((x) => `<li class="amanquer__item amanquer__item--echeance">
      <span class="label">Échéance ${quand}</span> ${esc(x.titre)} — <a href="aujourdhui.html#e-${esc(x.id)}">À faire</a></li>`),
  ...(passDuJour ? [`<li class="amanquer__item amanquer__item--pass">
      <span class="label">Votre pass :</span> ${esc(passDuJour.nom)} — <a href="passes.html#${esc(passDuJour.id)}">ce qu'il couvre</a>
      ${passDuJour.regleBus ? `<span class="amanquer__bus">${avecJp(passDuJour.regleBus)}</span>` : ''}</li>`] : []),
  ...(trajetDemain ? [`<li class="amanquer__item amanquer__item--demain">
      <span class="label">Demain :</span> ${esc(nomDe(trajetDemain.fromHotelId))} → ${esc(trajetDemain.toAirport ? 'Haneda' : nomDe(trajetDemain.toHotelId))}
      · Les valises : ${esc(trajetDemain.decision)} — <a href="valises.html#t${trajetDemain.n}">le détail</a></li>`] : []),
].join('');
q('resa').innerHTML = (resas.length || lignesAmanquer) ? `
  <div class="shead"><h2>À ne pas manquer</h2></div>
  ${resaStrip(jour.date)}
  ${lignesAmanquer ? `<ul class="amanquer">${lignesAmanquer}</ul>` : ''}` : '';

// --- distances ----------------------------------------------------------------
// À vol d'oiseau : on ne connaît pas le tracé des rues. C'est un ordre de
// grandeur — l'étape suivante est-elle à deux pas ou à l'autre bout ?
function metres(a, b) {
  const R = 6371000, rad = (x) => (x * Math.PI) / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2
    + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
// Les kilomètres s'écrivent à la française : « 1,4 km », pas « 1.4 km ».
const enKm = (m) => `${(m / 1000).toFixed(1).replace('.', ',')} km`;
const ecart = (m) => m < 250 ? 'à côté'
  : m < 1200 ? `${Math.round(m / 100) * 100} m à vol d'oiseau`
  : `${enKm(m)} à vol d'oiseau`;

// --- les étapes ---------------------------------------------------------------
const etapes = jour.items.map((it, i) => ({
  ...it, i, lieux: (it.lieux || []).map((id) => LIEUX[id]).filter(Boolean),
}));
const situees = etapes.filter((e) => e.lieux.length);
const points = situees.flatMap((e) => e.lieux);

// Un numéro de téléphone japonais dans le texte devient appelable (iOS/Android).
const TEL_RE = /(\+81[\d-]{6,}\d|0\d{1,3}-\d{3,4}-\d{4})/g;
const telLink = (txt) => txt.replace(TEL_RE, (m) => `<a href="tel:${m.replace(/[^+\d]/g, '')}">${m}</a>`);

// Le parcours part-il en transports ? Oui un jour de transfert, ou si les lieux
// s'étalent sur plus de ~3 km (on ne traverse pas Tokyo à pied).
const transfert = jour.kind === 'transfert';
let etendue = 0;
for (let i = 0; i < points.length; i++) for (let j = i + 1; j < points.length; j++) {
  etendue = Math.max(etendue, metres(points[i], points[j]));
}
const transitDabord = transfert || etendue > 3000;

// L'hôtel du matin : celui qu'on quitte un jour de transfert (l'étape qui se
// termine aujourd'hui). Le jour d'arrivée (9 novembre), aucune étape ne se
// termine : il n'y a rien à libérer.
const stepVeille = STEPS.find((s) => s.to === jour.date);
const hotelMatin = stepVeille ? HOTELS.find((h) => h.id === stepVeille.hotelId) : null;

// --- le lien qui ouvre tout le parcours --------------------------------------
const MAX_ETAPES = 11;
const gardes = points.slice(0, MAX_ETAPES);
const tronque = points.length - gardes.length;
// Les liens passent par le NOM du lieu, pas ses coordonnées : Google Maps ouvre alors
// la fiche de l'établissement (horaires, avis, photos) au lieu d'une épingle anonyme.
const nomLieu = (l) => [l.nom, l.quartier && !String(l.nom).toLowerCase().includes(String(l.quartier).toLowerCase()) ? l.quartier : null, (CITIES[l.cityId] && CITIES[l.cityId].name) || 'Japon'].filter(Boolean).join(', ');
const coord = (l) => (l && l.nom) ? nomLieu(l) : `${l.lat},${l.lng}`;

function lienParcours(mode = 'walking') {
  if (gardes.length < 2) return null;
  const p = new URLSearchParams({
    api: '1', origin: coord(gardes[0]),
    destination: coord(gardes[gardes.length - 1]), travelmode: mode,
  });
  const inter = gardes.slice(1, -1);
  if (inter.length) p.set('waypoints', inter.map(coord).join('|'));
  return `https://www.google.com/maps/dir/?${p}`;
}
const lienLieu = (l) => l.maps || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(l.nom ? nomLieu(l) : l.lat + ',' + l.lng)}`;

// Le bouton vit sous la carte, dans la colonne collante : il reste sous les
// yeux quelle que soit la position dans la liste.
const lienWalk = lienParcours('walking');
const lienTransit = lienParcours('transit');
q('go').innerHTML = lienWalk ? `
  <a class="btn btn--big" href="${esc(transitDabord ? lienTransit : lienWalk)}" target="_blank" rel="noopener">
    ${transitDabord ? 'Ouvrir le parcours en transports' : 'Ouvrir le parcours dans Maps'}
  </a>
  <a class="btn btn--ghost" href="${esc(transitDabord ? lienWalk : lienTransit)}" target="_blank" rel="noopener">
    ${transitDabord ? 'À pied' : 'En transports'}
  </a>
  ${tronque > 0 ? `<p class="mut jour__tronque">Maps s'arrête à ${MAX_ETAPES} arrêts : les ${tronque} derniers sont dans la liste, pas dans le lien.</p>` : ''}`
  : '<p class="mut">Jour de trajet — aucun arrêt à cartographier.</p>';

// --- le parcours --------------------------------------------------------------
let numero = 0;
const lignes = etapes.map((e) => {
  const situee = e.lieux.length > 0;
  if (situee) numero += 1;
  const n = numero;
  const rang = situees.indexOf(e);
  const avant = rang > 0 ? situees[rang - 1] : null;
  const d = avant ? metres(avant.lieux[avant.lieux.length - 1], e.lieux[0]) : null;

  return `
  <li class="etape${situee ? '' : ' etape--sansLieu'}${e.evening ? ' etape--soir' : ''}">
    <div class="etape__num">${situee ? `<b>${n}</b>` : '<span aria-hidden="true">·</span>'}</div>
    <div class="etape__corps">
      ${e.h ? `<p class="etape__h">${esc(e.h)}</p>` : ''}
      ${d !== null ? `<p class="etape__ecart mut">${esc(ecart(d))}</p>` : ''}
      <p class="etape__texte">${telLink(esc(e.text))}</p>
      ${situee ? `<p class="etape__lieux">
        ${e.lieux.map((l) => `
          <a class="lieu" href="${esc(lienLieu(l))}" target="_blank" rel="noopener">
            ${esc(l.nom)}${l.quartier ? `<span class="mut"> · ${esc(l.quartier)}</span>` : ''}
            ${l.confiance === 'approx' ? '<span class="lieu__approx" title="position approchée">≈</span>' : ''}
          </a>`).join('')}
        <button class="lieu lieu--carte" type="button" data-voir="${n}">Sur la carte</button>
      </p>` : ''}
    </div>
  </li>`;
}).join('');

// Jour de transfert : rappeler de libérer l'hôtel de la veille, et le trajet
// vers la nouvelle ville (route.text de l'hôtel d'arrivée).
// checkOut s'écrit « jusqu'à 11:00 » ou « 00:00 – 10:00 » : seule l'heure limite compte.
const heureLimite = (txt) => ((txt || '').match(/\d{1,2}:\d{2}/g) || []).pop() || txt || '—';
const departBlock = (transfert && hotelMatin) ? `<div class="alert jour__depart">
    <p class="alert__main">Départ : libérer <b>${esc(hotelMatin.name)}</b> avant <span class="data">${esc(heureLimite(hotelMatin.checkOut))}</span></p>
    ${hotel && hotel.route && hotel.route.text ? `<p class="mut">${esc(hotel.route.text)}</p>` : ''}
  </div>` : '';

// Les jours où l'on change de ville avec les valises (les six trajets de la
// page Valises, y compris le départ pour Haneda, un jour « vol » sans
// departBlock) : la décision, et un renvoi vers la fiche du trajet.
const trajetValises = VALISES.find((t) => t.date === jour.date);
const valisesLigne = trajetValises
  ? `<p class="jour__valises"><span class="label">Les valises</span> ${esc(trajetValises.decision)} — <a href="valises.html#t${trajetValises.n}">le détail</a></p>`
  : '';

// --- le trajet du jour --------------------------------------------------------
// Les jours de changement de ville : le train, ce qu'on libère, les valises.
const legDuJour = SEGMENTS.find((g) => {
  const to = STEPS.find((s) => s.id === g.toStepId);
  return to && to.from === jour.date;
});

q('trajet').innerHTML = `
  ${legDuJour ? `
  <div class="shead"><h2>Le trajet du jour</h2></div>
  <div class="alert">
    <p class="alert__main">
      ${esc(CITIES[STEPS.find((s) => s.id === legDuJour.fromStepId).cityId].name)}
      → ${esc(CITIES[STEPS.find((s) => s.id === legDuJour.toStepId).cityId].name)}
    </p>
    <p class="mut">${esc(legDuJour.label)} · <span class="data">${esc(legDuJour.duration)}</span>
       · <span class="data">${esc(legDuJour.pricePerPerson)}</span></p>
  </div>` : ''}
  ${departBlock}
  ${valisesLigne}`;

// Jour normal : « Depuis l'hôtel : X km — itinéraire en transports » vers le
// premier arrêt. Origine = l'hôtel (ses coordonnées), jamais celles du voyageur.
const premier = points[0];
let depuisLigne = '';
if (!transfert && hotel && hotel.ll && premier) {
  const d0 = metres({ lat: hotel.ll[0], lng: hotel.ll[1] }, premier);
  const dist = d0 < 1000 ? `${Math.round(d0 / 100) * 100} m` : enKm(d0);
  const pq = new URLSearchParams({ api: '1', origin: `${hotel.ll[0]},${hotel.ll[1]}`, destination: coord(premier), travelmode: 'transit' });
  depuisLigne = `<p class="jour__depuis"><span class="label">Depuis l'hôtel</span> <span class="data">${esc(dist)}</span> — <a href="https://www.google.com/maps/dir/?${pq}" target="_blank" rel="noopener">itinéraire en transports</a></p>`;
}

q('parcours').innerHTML = `
  <div class="shead">
    <h2>Le parcours</h2>
    <p>${etapes.length} étape${etapes.length > 1 ? 's' : ''}, dont ${situees.length || 'aucune'} sur la carte.</p>
  </div>
  ${depuisLigne}
  <ol class="etapes">${lignes}</ol>
  ${jour.tip ? `<p class="day__tip">${esc(jour.tip.replace(/^💡\s*/, ''))}</p>` : ''}
  <p class="jour__ailleurs">
    <a class="btn btn--ghost" href="itineraire.html#jour-${jour.n}">Cette journée dans le programme</a>
    <a class="btn btn--ghost" href="villes.html${step ? `?e=${step.n}` : ''}">Autour de moi</a>
  </p>`;

// --- la carte -----------------------------------------------------------------
if (points.length) {
  const map = createMap('map', { scrollWheelZoom: false });
  const marqueurs = new Map();
  const ll = [];
  let k = 0;
  for (const e of situees) {
    k += 1;
    for (const l of e.lieux) {
      ll.push([l.lat, l.lng]);
      const m = L.marker([l.lat, l.lng], {
        icon: L.divIcon({
          className: '',
          html: `<div class="map-pin" style="background:${ville ? ville.color : 'var(--mut)'}">${k}</div>`,
          iconSize: [26, 26], iconAnchor: [13, 13],
        }),
      }).addTo(map).bindPopup(
        `<b>${esc(l.nom)}</b><br><a href="${esc(lienLieu(l))}" target="_blank" rel="noopener">Y aller</a>`);
      if (!marqueurs.has(k)) marqueurs.set(k, { m, ll: [l.lat, l.lng] });
    }
  }
  if (ll.length > 1) {
    L.polyline(ll, {
      color: ville ? ville.color : 'var(--mut)',
      weight: 2, opacity: .55, dashArray: '4 5',
    }).addTo(map);
  }

  // Une carte Leaflet sans vue ne s'affiche pas du tout, et fitBounds ne peut
  // rien calculer tant que le conteneur a une largeur de 0. Vue de repli tout
  // de suite, cadrage exact dès que la taille arrive.
  const el = q('map');
  const bornes = L.latLngBounds(ll);
  if (ll.length === 1) map.setView(ll[0], 15);
  else map.setView(bornes.getCenter(), 12);

  const cadrer = () => {
    map.invalidateSize(true);
    if (ll.length > 1) map.fitBounds(bornes, { padding: [34, 34], animate: false });
  };
  let restant = 12;
  const tenter = () => {
    if (el.clientWidth > 0) { cadrer(); return; }
    if (restant-- > 0) requestAnimationFrame(tenter);
  };
  tenter();
  if ('ResizeObserver' in window) new ResizeObserver(() => { if (el.clientWidth > 0) cadrer(); }).observe(el);
  addEventListener('load', tenter);

  // « Sur la carte » va chercher l'arrêt, plutôt que de laisser repérer la
  // pastille à l'œil. Sur téléphone la carte est sous la liste : on y descend.
  q('parcours').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-voir]');
    if (!b) return;
    const cible = marqueurs.get(+b.dataset.voir);
    if (!cible) return;
    if (matchMedia('(max-width: 900px)').matches) el.scrollIntoView({ block: 'center' });
    map.setView(cible.ll, 16, { animate: false });
    cible.m.openPopup();
  });

  const total = situees.reduce((m, e, i) =>
    i === 0 ? 0 : m + metres(situees[i - 1].lieux[situees[i - 1].lieux.length - 1], e.lieux[0]), 0);
  q('carte-meta').innerHTML =
    `<span class="data">${enKm(total)}</span> cumulés, à vol d'oiseau · ${situees.length} étape${situees.length > 1 ? 's' : ''}`;

  window.__carte = map;   // pour inspecter le cadrage depuis la console
} else {
  q('map').remove();
  q('carte-meta').remove();
}

// --- la météo de cette journée ------------------------------------------------
// Sur place, ce qui décide d'une journée n'est pas la température de l'instant
// mais l'amplitude et la pluie. Au-delà de la fenêtre de prévision, on affiche
// les normales de saison en le disant : annoncer une prévision qu'on n'a pas
// serait pire que se taire.
if (ville) {
  meteoDuJour(step.cityId, jour.date).then((m) => {
    if (!m || !Number.isFinite(m.max)) return;
    const prev = m.source === 'prevision';
    q('meteo').innerHTML = `
      <div class="mjour${prev ? ' mjour--prev' : ''}">
        <span class="mjour__icone" aria-hidden="true">${m.icon}</span>
        <span class="mjour__temp data"><b>${m.max}°</b> / ${m.min}°</span>
        <span class="mjour__quoi">${esc(m.label || '')}</span>
        ${m.pluie != null ? `<span class="mjour__pluie data">${m.pluie} % de pluie</span>` : ''}
        ${m.coucher ? `<span class="mjour__nuit mut">nuit à ${esc(m.coucher)}</span>` : ''}
        <span class="mjour__source mut">${prev
          ? (m.fresh ? 'prévision' : 'dernière prévision connue')
          : 'normales de novembre — trop loin pour une prévision'}</span>
      </div>`;
  });
}

// --- clavier ------------------------------------------------------------------
// Flèches gauche/droite pour changer de journée : plus rapide que viser une
// case, et naturel sur une page qui parle de dates.
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
  const i = DAYS.indexOf(jour);
  if (e.key === 'ArrowLeft' && DAYS[i - 1]) location.href = `?d=${DAYS[i - 1].n}`;
  if (e.key === 'ArrowRight' && DAYS[i + 1]) location.href = `?d=${DAYS[i + 1].n}`;
});
</script>
</body>
</html>
