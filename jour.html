<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La journée — Japon 2026</title>
<meta name="description" content="Une journée à la fois : les arrêts dans l'ordre, la carte en regard, et tout le parcours en un lien.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1512" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
<script src="vendor/leaflet.js"></script>
</head>
<body>

<main class="wrap jour">
  <!-- Le calendrier d'abord : on choisit sa journée en un clic, pas en treize
       appuis sur « jour suivant ». -->
  <div class="cal" id="cal"></div>

  <header class="jour__tete" id="tete"></header>

  <!-- La carte est AVANT le parcours dans le document : sur téléphone elle
       apparaît donc tout de suite, et sur grand écran la grille l'envoie dans
       la colonne de droite, où elle reste collée pendant qu'on lit la liste. -->
  <div class="jour__grille">
    <aside class="jour__aside">
      <div class="jour__sticky">
        <div id="map" class="map map--jour"></div>
        <p class="jour__carteMeta mut" id="carte-meta"></p>
        <div class="jour__actions" id="go"></div>
      </div>
    </aside>

    <div class="jour__corps">
      <div id="resa"></div>
      <div id="parcours"></div>
      <div id="soir"></div>
    </div>
  </div>
</main>

<script type="module">
import { CITIES, STEPS, HOTELS, SEGMENTS } from './data/trip.js';
import { DAYS } from './data/days.js';
import { LIEUX } from './data/lieux.js';
import { mountChrome, esc, formatDate, today } from './app/ui.js';
import { resaStrip } from './app/resa.js';
import { createMap } from './app/map.js';

mountChrome('jour.html');
const q = (id) => document.getElementById(id);

// --- quelle journée ? ---------------------------------------------------------
const url = new URLSearchParams(location.search);
const parNum = DAYS.find((d) => String(d.n) === url.get('d'));
const parDate = DAYS.find((d) => d.date === url.get('date'));
const duJour = DAYS.find((d) => d.date === today());
const jour = parNum || parDate || duJour || DAYS[0];

const step = STEPS.find((s) => s.id === jour.stepId);
const ville = step ? CITIES[step.cityId] : null;
const hotel = step ? HOTELS.find((h) => h.id === step.hotelId) : null;

document.title = `${jour.title} — ${formatDate(jour.date)} · Japon 2026`;

// --- le calendrier ------------------------------------------------------------
// Du 8 novembre au 2 décembre, en semaines qui commencent le lundi. Les cases
// hors voyage restent visibles mais éteintes : voir où le voyage s'inscrit dans
// le mois vaut mieux qu'une liste de 25 boutons.
const JOURS_SEM = ['lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'];
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet',
              'août', 'septembre', 'octobre', 'novembre', 'décembre'];

const isoDe = (d) => d.toISOString().slice(0, 10);
const lundiAvant = (dateIso) => {
  const d = new Date(`${dateIso}T00:00:00Z`);
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
  return d;
};

const cases = [];
{
  const curseur = lundiAvant(DAYS[0].date);
  const fin = new Date(`${DAYS[DAYS.length - 1].date}T00:00:00Z`);
  while (curseur <= fin || cases.length % 7 !== 0) {
    cases.push(isoDe(curseur));
    curseur.setUTCDate(curseur.getUTCDate() + 1);
    if (cases.length > 60) break;                  // garde-fou
  }
}

const parJourDate = new Map(DAYS.map((d) => [d.date, d]));
const villeDe = (d) => {
  const s = STEPS.find((x) => x.id === d.stepId);
  return s ? CITIES[s.cityId] : null;
};

// Sur téléphone, la grille mangeait un tiers du premier écran alors qu'on ne
// s'en sert qu'au moment de changer de jour. Elle se replie donc derrière la
// date courante, et reste dépliée sur grand écran, où la place ne manque pas.
const large = matchMedia('(min-width: 700px)').matches;

q('cal').innerHTML = `
  <details class="cal__pli"${large ? ' open' : ''}>
    <summary class="cal__resume">
      <span class="cal__resumeDate">
        <b>${esc(formatDate(jour.date, { weekday: true }))}</b>
        <span class="mut">· jour ${jour.n} sur ${DAYS.length}</span>
      </span>
      <span class="cal__resumeAction">Changer de jour</span>
    </summary>
  <div class="cal__tete">
    <b class="cal__titre">${MOIS[+cases[0].slice(5, 7) - 1]} — ${MOIS[+cases[cases.length - 1].slice(5, 7) - 1]} 2026</b>
    <span class="cal__legende">
      ${Object.entries(CITIES).map(([, c]) => `
        <span class="cal__pastille" style="--c:${c.color}">${esc(c.name)}</span>`).join('')}
    </span>
  </div>
  <div class="cal__grille" role="group" aria-label="Choisir une journée">
    ${JOURS_SEM.map((j) => `<span class="cal__jsem" aria-hidden="true">${j}</span>`).join('')}
    ${cases.map((date) => {
      const d = parJourDate.get(date);
      const num = +date.slice(8, 10);
      if (!d) return `<span class="cal__case cal__case--hors" aria-hidden="true">${num}</span>`;
      const c = villeDe(d);
      const actif = date === jour.date;
      return `
      <a class="cal__case${actif ? ' is-actif' : ''}${date < today() ? ' is-passe' : ''}"
         href="?d=${d.n}" style="--c:${c ? c.color : '#78766D'}"
         ${actif ? 'aria-current="date"' : ''}
         title="${esc(formatDate(date, { weekday: true }))} — ${esc(d.title)}">
        <b>${num}</b>
        <span class="cal__ville">${c ? esc(c.name.slice(0, 3)) : '✈'}</span>
      </a>`;
    }).join('')}
  </div>
  </details>`;

// --- en-tête ------------------------------------------------------------------
const KIND = { transfert: 'Transfert', vol: 'Vol', etape: null };
q('tete').innerHTML = `
  <p class="eyebrow">Jour ${jour.n} sur ${DAYS.length} · ${esc(formatDate(jour.date, { weekday: true }))}</p>
  <h1>${esc(jour.title)}</h1>
  ${ville ? `<p class="jour__ou">
    <span class="city-dot" style="--c:${ville.color}">${esc(ville.name)}</span>
    ${step.area ? `<span class="mut">· ${esc(step.area)}</span>` : ''}
    ${KIND[jour.kind] ? `<span class="day__kind">${KIND[jour.kind]}</span>` : ''}
  </p>` : ''}`;

// --- distances ----------------------------------------------------------------
// À vol d'oiseau : on ne connaît pas le tracé des rues. C'est un ordre de
// grandeur — l'étape suivante est-elle à deux pas ou à l'autre bout ?
function metres(a, b) {
  const R = 6371000, rad = (x) => (x * Math.PI) / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2
    + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const ecart = (m) => m < 250 ? 'à côté'
  : m < 1200 ? `${Math.round(m / 100) * 100} m à vol d'oiseau`
  : `${(m / 1000).toFixed(1)} km à vol d'oiseau`;

// --- les étapes ---------------------------------------------------------------
const etapes = jour.items.map((it, i) => ({
  ...it, i, lieux: (it.lieux || []).map((id) => LIEUX[id]).filter(Boolean),
}));
const situees = etapes.filter((e) => e.lieux.length);
const points = situees.flatMap((e) => e.lieux);

// --- le lien qui ouvre tout le parcours --------------------------------------
const MAX_ETAPES = 11;
const gardes = points.slice(0, MAX_ETAPES);
const tronque = points.length - gardes.length;
const coord = (l) => `${l.lat},${l.lng}`;

function lienParcours(mode = 'walking') {
  if (gardes.length < 2) return null;
  const p = new URLSearchParams({
    api: '1', origin: coord(gardes[0]),
    destination: coord(gardes[gardes.length - 1]), travelmode: mode,
  });
  const inter = gardes.slice(1, -1);
  if (inter.length) p.set('waypoints', inter.map(coord).join('|'));
  return `https://www.google.com/maps/dir/?${p}`;
}
const lienLieu = (l) => `https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lng}`;

// Le bouton vit sous la carte, dans la colonne collante : il reste sous les
// yeux quelle que soit la position dans la liste.
const lien = lienParcours();
q('go').innerHTML = lien ? `
  <a class="btn btn--big" href="${esc(lien)}" target="_blank" rel="noopener">
    Ouvrir le parcours dans Maps
  </a>
  <a class="btn btn--ghost" href="${esc(lienParcours('transit'))}" target="_blank" rel="noopener">
    En transports
  </a>
  ${tronque > 0 ? `<p class="mut jour__tronque">Maps s'arrête à ${MAX_ETAPES} arrêts : les ${tronque} derniers sont dans la liste, pas dans le lien.</p>` : ''}`
  : '<p class="mut">Jour de trajet — aucun arrêt à cartographier.</p>';

// --- le parcours --------------------------------------------------------------
q('resa').innerHTML = resaStrip(jour.date).trim()
  ? `<div class="shead"><h2>Le rendez-vous du jour</h2></div>${resaStrip(jour.date)}`
  : '';

let numero = 0;
const lignes = etapes.map((e) => {
  const situee = e.lieux.length > 0;
  if (situee) numero += 1;
  const n = numero;
  const rang = situees.indexOf(e);
  const avant = rang > 0 ? situees[rang - 1] : null;
  const d = avant ? metres(avant.lieux[avant.lieux.length - 1], e.lieux[0]) : null;

  return `
  <li class="etape${situee ? '' : ' etape--sansLieu'}${e.evening ? ' etape--soir' : ''}">
    <div class="etape__num">${situee ? `<b>${n}</b>` : '<span aria-hidden="true">·</span>'}</div>
    <div class="etape__corps">
      ${d !== null ? `<p class="etape__ecart mut">${esc(ecart(d))}</p>` : ''}
      <p class="etape__texte">${esc(e.text)}</p>
      ${situee ? `<p class="etape__lieux">
        ${e.lieux.map((l) => `
          <a class="lieu" href="${esc(lienLieu(l))}" target="_blank" rel="noopener">
            ${esc(l.nom)}${l.quartier ? `<span class="mut"> · ${esc(l.quartier)}</span>` : ''}
            ${l.confiance === 'approx' ? '<span class="lieu__approx" title="position approchée">≈</span>' : ''}
          </a>`).join('')}
        <button class="lieu lieu--carte" type="button" data-voir="${n}">Sur la carte</button>
      </p>` : ''}
    </div>
  </li>`;
}).join('');

q('parcours').innerHTML = `
  <div class="shead">
    <h2>Le parcours</h2>
    <p>${situees.length} arrêt${situees.length > 1 ? 's' : ''} situé${situees.length > 1 ? 's' : ''} sur ${etapes.length} ligne${etapes.length > 1 ? 's' : ''}.</p>
  </div>
  <ol class="etapes">${lignes}</ol>
  ${jour.tip ? `<p class="day__tip">${esc(jour.tip.replace(/^💡\s*/, ''))}</p>` : ''}`;

// --- la carte -----------------------------------------------------------------
if (points.length) {
  const map = createMap('map', { scrollWheelZoom: false });
  const marqueurs = new Map();
  const ll = [];
  let k = 0;
  for (const e of situees) {
    k += 1;
    for (const l of e.lieux) {
      ll.push([l.lat, l.lng]);
      const m = L.marker([l.lat, l.lng], {
        icon: L.divIcon({
          className: '',
          html: `<div class="map-pin" style="background:${ville ? ville.color : '#78766D'}">${k}</div>`,
          iconSize: [26, 26], iconAnchor: [13, 13],
        }),
      }).addTo(map).bindPopup(
        `<b>${esc(l.nom)}</b><br><a href="${esc(lienLieu(l))}" target="_blank" rel="noopener">Y aller</a>`);
      if (!marqueurs.has(k)) marqueurs.set(k, { m, ll: [l.lat, l.lng] });
    }
  }
  if (ll.length > 1) {
    L.polyline(ll, {
      color: ville ? ville.color : '#78766D',
      weight: 2, opacity: .55, dashArray: '4 5',
    }).addTo(map);
  }

  // Une carte Leaflet sans vue ne s'affiche pas du tout, et fitBounds ne peut
  // rien calculer tant que le conteneur a une largeur de 0. Vue de repli tout
  // de suite, cadrage exact dès que la taille arrive.
  const el = q('map');
  const bornes = L.latLngBounds(ll);
  if (ll.length === 1) map.setView(ll[0], 15);
  else map.setView(bornes.getCenter(), 12);

  const cadrer = () => {
    map.invalidateSize(true);
    if (ll.length > 1) map.fitBounds(bornes, { padding: [34, 34], animate: false });
  };
  let restant = 12;
  const tenter = () => {
    if (el.clientWidth > 0) { cadrer(); return; }
    if (restant-- > 0) requestAnimationFrame(tenter);
  };
  tenter();
  if ('ResizeObserver' in window) new ResizeObserver(() => { if (el.clientWidth > 0) cadrer(); }).observe(el);
  addEventListener('load', tenter);

  // « Sur la carte » va chercher l'arrêt, plutôt que de laisser repérer la
  // pastille à l'œil. Sur téléphone la carte est en haut : on y remonte.
  q('parcours').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-voir]');
    if (!b) return;
    const cible = marqueurs.get(+b.dataset.voir);
    if (!cible) return;
    if (matchMedia('(max-width: 900px)').matches) el.scrollIntoView({ block: 'center' });
    map.setView(cible.ll, 16, { animate: false });
    cible.m.openPopup();
  });

  const total = situees.reduce((m, e, i) =>
    i === 0 ? 0 : m + metres(situees[i - 1].lieux[situees[i - 1].lieux.length - 1], e.lieux[0]), 0);
  q('carte-meta').innerHTML =
    `<span class="data">${(total / 1000).toFixed(1)} km</span> cumulés, à vol d'oiseau · ${points.length} arrêts`;

  window.__carte = map;   // pour inspecter le cadrage depuis la console
} else {
  q('map').remove();
  q('carte-meta').remove();
}

// --- le trajet et le soir -----------------------------------------------------
const legDuJour = SEGMENTS.find((g) => {
  const to = STEPS.find((s) => s.id === g.toStepId);
  return to && to.from === jour.date;
});

q('soir').innerHTML = `
  ${legDuJour ? `
  <div class="shead"><h2>Le trajet du jour</h2></div>
  <div class="alert">
    <p class="alert__main">
      ${esc(CITIES[STEPS.find((s) => s.id === legDuJour.fromStepId).cityId].name)}
      → ${esc(CITIES[STEPS.find((s) => s.id === legDuJour.toStepId).cityId].name)}
    </p>
    <p class="mut">${esc(legDuJour.label)} · <span class="data">${esc(legDuJour.duration)}</span>
       · <span class="data">${esc(legDuJour.pricePerPerson)}</span></p>
  </div>` : ''}

  ${hotel ? `
  <div class="shead"><h2>Ce soir</h2></div>
  <div class="card tonight">
    <div class="tonight__body">
      <h3>${esc(hotel.name)}</h3>
      <p class="mut">${esc(hotel.address)}</p>
      <dl class="tonight__facts">
        <div><dt>Arrivée</dt><dd class="data">${esc(hotel.checkIn)}</dd></div>
        <div><dt>Chambre</dt><dd>${esc(hotel.room)}</dd></div>
        ${hotel.meals ? `<div><dt>Repas</dt><dd>${esc(hotel.meals)}</dd></div>` : ''}
      </dl>
      ${hotel.arrivee ? `<p class="hotel__arrivee"><b>À l'arrivée</b> ${esc(hotel.arrivee)}</p>` : ''}
      <p><a class="btn" href="${esc(hotel.maps)}" target="_blank" rel="noopener">M'y emmener</a></p>
    </div>
  </div>` : ''}`;

// --- clavier ------------------------------------------------------------------
// Flèches gauche/droite pour changer de journée : plus rapide que viser une
// case, et naturel sur une page qui parle de dates.
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
  const i = DAYS.indexOf(jour);
  if (e.key === 'ArrowLeft' && DAYS[i - 1]) location.href = `?d=${DAYS[i - 1].n}`;
  if (e.key === 'ArrowRight' && DAYS[i + 1]) location.href = `?d=${DAYS[i + 1].n}`;
});
</script>
</body>
</html>
